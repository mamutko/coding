<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Example Presentation &mdash; Titanium Deck Style</title>
<!--
  EXAMPLE PRESENTATION for the `presentation` skill.
  A self-contained slide deck in the repo's titanium / schematic style:
  paged deck, reactive canvas background, animated reveals, an animated SVG
  flow diagram, stat callouts and "check" bullet cards. Replace the SLIDES
  content to build your own deck.
-->
<style>
  :root{
    --bg:#080b11; --ink:#e4ebf2; --muted:#93a1b1;
    --accent:#4fd1e0; --accent2:#76a8e6; --good:#5fe0a6;
    --line:rgba(150,175,200,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:"Consolas","SF Mono",ui-monospace,Menlo,monospace}

  /* ---------- engineering background ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(120,150,180,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,150,180,.05) 1px,transparent 1px),
      linear-gradient(rgba(120,150,180,.10) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,150,180,.10) 1px,transparent 1px);
    background-size:26px 26px,26px 26px,130px 130px,130px 130px;
    background-position:var(--gx,0px) 0,var(--gx,0px) 0,var(--gx,0px) 0,var(--gx,0px) 0;
    transition:background-position .72s cubic-bezier(.76,0,.24,1);
    mask-image:radial-gradient(120% 110% at 50% 40%,#000 55%,transparent 100%);}
  .bg-vignette{position:absolute;inset:0;
    background:radial-gradient(130% 120% at 50% 30%,transparent 40%,rgba(0,0,0,.55) 100%),
               radial-gradient(80% 80% at 80% 90%,rgba(40,70,90,.18),transparent 60%);}
  .bg-schem{position:absolute;inset:0;width:100%;height:100%;opacity:.92}

  /* ---------- deck ---------- */
  .deck{position:relative;z-index:2;height:100%;width:100%;display:flex;transition:transform .72s cubic-bezier(.76,0,.24,1)}
  .slide{position:relative;min-width:100%;height:100vh;flex:0 0 100%;overflow-y:auto}
  .inner{min-height:100%;max-width:1080px;margin:0 auto;padding:9vh 7vw 13vh;display:flex;flex-direction:column;justify-content:center}

  .eyebrow{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);margin:0 0 18px;font-weight:600}
  h1{font-size:clamp(34px,5.4vw,68px);line-height:1.04;margin:0;font-weight:700;letter-spacing:-.01em}
  h2{font-size:clamp(22px,3.1vw,38px);line-height:1.12;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:clamp(15px,1.6vw,20px);margin:14px 0 0;max-width:60ch;line-height:1.5}
  .lead{font-size:clamp(16px,1.7vw,21px);line-height:1.55;max-width:64ch;margin:6px 0 0;color:#cdd8e3}
  .footer{margin-top:30px;color:var(--muted);font-size:13px;letter-spacing:.22em}
  .gradtext{background:linear-gradient(92deg,#dfe9f2,#7fb4ea 60%,#4fd1e0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .closing{font-size:clamp(22px,3vw,40px);line-height:1.25;font-weight:700;max-width:24ch;margin:18px 0 0}

  /* ---------- metallic cards ---------- */
  .card{position:relative;border-radius:15px;padding:18px 20px;
    background:linear-gradient(155deg,rgba(140,162,184,.20),rgba(34,42,52,.62));
    border:1px solid rgba(150,172,194,calc(.22 + var(--p,0)*.4));border-top-color:rgba(206,220,234,.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 34px rgba(0,0,0,.42),0 0 calc(var(--p,0)*26px) rgba(79,209,224,calc(var(--p,0)*.4));
    backdrop-filter:blur(2px);transition:box-shadow .3s,border-color .3s,transform .25s}
  .card.reactive:hover{transform:translateY(-2px)}

  /* stat callouts */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:34px;max-width:820px}
  .stat .big{font-size:clamp(26px,3.6vw,44px);font-weight:700;line-height:1;
    background:linear-gradient(92deg,#eaf2fa,#5fd6e4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .lbl{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.4}

  /* check bullet cards */
  .checks{display:grid;gap:14px;margin-top:30px;max-width:760px}
  .check{display:flex;gap:14px;align-items:flex-start}
  .check .ic{flex:0 0 30px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#06120d;
    background:linear-gradient(135deg,#5fe0a6,#3bbf86)}
  .check .ct b{display:block;font-size:17px;margin-bottom:2px}
  .check .ct span{color:var(--muted);font-size:14.5px;line-height:1.45}

  /* diagram */
  .diagram{margin-top:32px;width:100%;max-width:920px}
  .diagram svg{width:100%;height:auto;overflow:visible}
  .dg-edge{stroke:rgba(150,180,210,.5);stroke-width:2;fill:none;
    stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .8s ease}
  .slide.active .dg-edge{stroke-dashoffset:0}
  .dg-flow{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 14;opacity:.9;
    animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}

  .reveal{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0s)}
  .slide.active .reveal{opacity:1;transform:none}

  /* ---------- top overlay (brand + counter) ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;
    padding:18px 30px;pointer-events:none;background:transparent;transition:background .3s}
  .brand{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9cf3ff,#2aa6b6);box-shadow:0 0 14px rgba(79,209,224,.8)}
  .brand .t{font-size:14px;letter-spacing:.3em;font-weight:700}
  .brand .s{font-size:11px;letter-spacing:.16em;color:var(--muted)}
  .counter{font-size:13px;letter-spacing:.18em;color:var(--muted);pointer-events:auto}
  .counter b{color:var(--ink)}

  /* ---------- bottom controls (footer nav on mobile) ---------- */
  .bottombar{position:fixed;left:0;right:0;bottom:0;height:0;z-index:5;pointer-events:none;background:transparent;transition:background .3s}
  .progress{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;display:flex;gap:6px;align-items:center;max-width:62vw;flex-wrap:wrap;justify-content:center}
  /* All page indicators share one fixed length; the active tick is shown by colour and glow only. */
  .tick{width:22px;height:6px;border-radius:4px;cursor:pointer;background:rgba(150,175,200,.18);transition:background .3s,box-shadow .3s}
  .tick:hover{background:rgba(150,175,200,.4)}
  .tick.on{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 calc(8px + var(--p,0)*14px) rgba(79,209,224,.6)}

  .nav{position:fixed;top:50%;z-index:6;transform:translateY(-50%);width:60px;height:84px;display:grid;place-items:center;cursor:pointer;
    border-radius:14px;border:1px solid rgba(150,175,200,calc(.18 + var(--p,0)*.5));
    background:linear-gradient(155deg,rgba(140,162,184,calc(.10 + var(--p,0)*.22)),rgba(30,38,48,.5));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 calc(var(--p,0)*34px) rgba(79,209,224,calc(var(--p,0)*.7));
    transition:opacity .35s,transform .25s,background .3s;backdrop-filter:blur(2px)}
  .nav:hover{transform:translateY(-50%) scale(1.05)}
  .nav svg{width:24px;height:24px;stroke:#dbe6f1;stroke-width:2.2;fill:none;filter:drop-shadow(0 0 calc(var(--p,0)*6px) rgba(79,209,224,.9))}
  .nav.next{right:30px} .nav.prev{left:30px} .nav.hide{opacity:0;pointer-events:none}
  .hint{position:fixed;right:34px;bottom:26px;z-index:6;color:var(--muted);font-size:12px;letter-spacing:.05em}

  /* ============ MOBILE / CELL PHONE ============ */
  @media (max-width:760px){
    .inner{padding:104px 22px 116px}
    /* top: semi-opaque overlay holding the wordmark + counter */
    .topbar{padding:12px 16px;background:linear-gradient(180deg,rgba(8,11,17,.86),rgba(8,11,17,.5) 78%,transparent);
      backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    .brand .t{font-size:13px;letter-spacing:.22em}
    .brand .s{display:none}
    .counter{font-size:12px}
    /* bottom: a footer bar holding prev / progress / next */
    .bottombar{height:74px;background:linear-gradient(0deg,rgba(8,11,17,.9),rgba(8,11,17,.55) 70%,transparent);
      backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    .nav{top:auto;bottom:14px;transform:none;width:46px;height:46px;border-radius:12px;
      background:linear-gradient(155deg,rgba(140,162,184,.22),rgba(30,38,48,.7));border-color:rgba(150,175,200,.4)}
    .nav:hover{transform:none}
    .nav.prev{left:16px} .nav.next{right:16px} .nav svg{width:22px;height:22px}
    .progress{bottom:28px;max-width:calc(100vw - 140px);gap:5px;flex-wrap:nowrap;overflow:hidden}
    .tick{width:11px;height:5px}
    .hint{display:none}
  }
  @media (max-width:380px){ .tick{width:9px} .progress{gap:4px} }
</style>
</head>
<body>

<div class="bg">
  <div class="bg-grid"></div>
  <canvas class="bg-schem" id="schem"></canvas>
  <div class="bg-vignette"></div>
</div>

<header class="topbar">
  <div class="brand">
    <div class="dot"></div>
    <div><div class="t mono">EXAMPLE&nbsp;DECK</div><div class="s mono">TITANIUM PRESENTATION STYLE</div></div>
  </div>
  <span class="counter mono"><b id="curNo">01</b> / <span id="totNo">--</span></span>
</header>

<div class="deck" id="deck"></div>

<div class="bottombar"></div>

<div class="nav prev reactive hide" id="prev" title="Previous"><svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg></div>
<div class="nav next reactive" id="next" title="Next"><svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></div>

<div class="progress" id="progress"></div>
<div class="hint mono">&larr; &rarr; / space</div>

<script>
const deck=document.getElementById('deck');

/* A tiny flow-diagram builder: a horizontal row of boxes joined by arrows whose
   stroke animates in when the slide becomes active (replayed on each entry). */
function buildFlow(nodes){
  const W=900,H=150,n=nodes.length,bw=170,bh=64,gap=(W-n*bw)/(n-1||1);
  let boxes='',edges='';
  const cx=i=>i*(bw+gap)+bw/2, cy=H/2;
  nodes.forEach((label,i)=>{
    const x=i*(bw+gap), y=cy-bh/2;
    boxes+=`<g class="reveal" style="--d:${(0.2+i*0.15).toFixed(2)}s">
      <rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="12"
        fill="url(#metal)" stroke="rgba(150,172,194,.5)"/>
      <text x="${x+bw/2}" y="${cy+5}" text-anchor="middle" fill="#dbe6f1"
        font-size="15" font-family="Segoe UI,system-ui,sans-serif">${label}</text></g>`;
    if(i<n-1){ const x1=cx(i)+bw/2, x2=cx(i+1)-bw/2, len=x2-x1;
      edges+=`<path class="dg-edge" style="--len:${len}" d="M${x1} ${cy} H${x2-8}"/>
        <path class="dg-flow" d="M${x1} ${cy} H${x2-8}"/>
        <path d="M${x2-8} ${cy} l-9 -6 v12 z" fill="var(--accent)"/>`; }
  });
  return `<div class="diagram"><svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(140,162,184,.34)"/><stop offset="1" stop-color="rgba(34,42,52,.7)"/>
    </linearGradient></defs>${edges}${boxes}</svg></div>`;
}

/* ---------- slide content ---------- */
const SLIDES=[
  // hero / title
  `<div class="inner" style="align-items:flex-start">
     <p class="eyebrow reveal" style="--d:.05s">Example &middot; Project Beacon</p>
     <h1 class="reveal" style="--d:.15s">A titanium <span class="gradtext">deck</span><br>you can present from</h1>
     <p class="sub reveal" style="--d:.35s">A self-contained slide template demonstrating the repo's engineering style: a live reactive background, paged navigation, and animated content.</p>
     <p class="footer reveal mono" style="--d:.55s">PRESENTATION SKILL &middot; EXAMPLE</p>
   </div>`,

  // problem + animated flow diagram
  `<div class="inner">
     <p class="eyebrow reveal" style="--d:.05s">The Problem</p>
     <h2 class="reveal" style="--d:.12s">A plan of steps, start to finish</h2>
     <p class="lead reveal" style="--d:.22s">Show a structural or sequential idea as an animated flow. The edges draw themselves in when the slide arrives, with a flowing accent dash.</p>
     ${buildFlow(['Collect input','Build plan','Execute','Report'])}
   </div>`,

  // stat callouts
  `<div class="inner">
     <p class="eyebrow reveal" style="--d:.05s">By the numbers</p>
     <h2 class="reveal" style="--d:.12s">Land the figures that matter</h2>
     <div class="stats">
       <div class="card stat reactive reveal" style="--d:.2s"><div class="big">~1M</div><div class="lbl">records updated in a weekend</div></div>
       <div class="card stat reactive reveal" style="--d:.32s"><div class="big">3</div><div class="lbl">sprints from prototype to production</div></div>
       <div class="card stat reactive reveal" style="--d:.44s"><div class="big">20min</div><div class="lbl">to run across the whole corpus</div></div>
     </div>
   </div>`,

  // check bullet cards
  `<div class="inner">
     <p class="eyebrow reveal" style="--d:.05s">Design Decisions</p>
     <h2 class="reveal" style="--d:.12s">A few principles</h2>
     <div class="checks">
       <div class="check reveal" style="--d:.2s"><div class="ic">&#10003;</div><div class="ct"><b>Dark launch</b><span>Ship dormant, enable gradually, roll out with confidence.</span></div></div>
       <div class="check reveal" style="--d:.32s"><div class="ic">&#10003;</div><div class="ct"><b>Idempotent</b><span>Operations can be safely re-run without double-acting.</span></div></div>
       <div class="check reveal" style="--d:.44s"><div class="ic">&#10003;</div><div class="ct"><b>Start narrow</b><span>Begin with the immediate need; leave room to expand.</span></div></div>
     </div>
   </div>`,

  // closing
  `<div class="inner">
     <p class="eyebrow reveal" style="--d:.05s">Where It Stands</p>
     <p class="closing reveal gradtext" style="--d:.2s">One clear idea, presented simply, beats a wall of bullet points.</p>
     <p class="sub reveal" style="--d:.4s">Copy this file, swap the SLIDES array, and you have a new deck in the same style.</p>
   </div>`,
];
const TITLES=['Title','Problem','Numbers','Decisions','Closing'];

SLIDES.forEach((html,i)=>{
  const s=document.createElement('section'); s.className='slide'; s.dataset.title=TITLES[i]; s.innerHTML=html; deck.appendChild(s);
});

/* ---------- navigation ---------- */
const slides=[...document.querySelectorAll('.slide')];
const prev=document.getElementById('prev'), next=document.getElementById('next');
const curNo=document.getElementById('curNo'), totNo=document.getElementById('totNo'), prog=document.getElementById('progress');
totNo.textContent=String(slides.length).padStart(2,'0');
let idx=0;
slides.forEach((s,i)=>{ const t=document.createElement('div'); t.className='tick reactive'; t.title=s.dataset.title;
  t.addEventListener('click',()=>go(i)); prog.appendChild(t); });
const ticks=[...prog.children];

function go(i){
  idx=Math.max(0,Math.min(slides.length-1,i));
  deck.style.transform=`translateX(${-idx*100}%)`;
  document.documentElement.style.setProperty('--gx',(-idx*100)+'vw');
  // re-trigger reveal + diagram animations on the slide we land on
  slides.forEach((s,k)=>{ if(k===idx){ s.classList.remove('active'); void s.offsetWidth; s.classList.add('active'); } else s.classList.remove('active'); });
  ticks.forEach((t,k)=>t.classList.toggle('on',k===idx));
  curNo.textContent=String(idx+1).padStart(2,'0');
  prev.classList.toggle('hide',idx===0);
  next.classList.toggle('hide',idx===slides.length-1);
}
next.addEventListener('click',()=>go(idx+1));
prev.addEventListener('click',()=>go(idx-1));
window.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){ if(e.key===' '&&e.target!==document.body)return; e.preventDefault(); go(idx+1); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1);}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(slides.length-1);
});
let tx=0,ty=0;
window.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))go(idx+(dx<0?1:-1));},{passive:true});

/* ---------- mouse proximity (reactive chrome) ---------- */
const mouse={x:-99999,y:-99999};
window.addEventListener('pointermove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY;
  document.querySelectorAll('.reactive').forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width===0)return;
    const d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));
    el.style.setProperty('--p',Math.max(0,1-d/240).toFixed(3)); }); });
window.addEventListener('pointerleave',()=>{mouse.x=-99999;mouse.y=-99999;});

/* ---------- reactive schematic network (generic, content-agnostic) ---------- */
const schem=document.getElementById('schem'), ctxS=schem.getContext('2d');
let SW=0,SH=0,DPR=1,net=null,scrollX=0; const pulses=[];
const CHARGE_R=130,CHARGE_RATE=1.45,SPEED=700,HOPDECAY=0.8,MININTEN=0.1,MAXDEPTH=8,MAXP=220,PERSCREEN=6;
let timeNow=0;
function genPoly(x,y,H){ const pts=[{x:Math.round(x),y:Math.round(y)}]; const steps=3+(Math.random()*4|0); let horiz=Math.random()<0.5;
  for(let s=0;s<steps;s++){ const len=(60+Math.random()*170)*1.75,dir=Math.random()<0.5?-1:1; let nx=pts[pts.length-1].x,ny=pts[pts.length-1].y;
    if(horiz)nx+=dir*len; else ny+=dir*len; ny=Math.max(26,Math.min(H-26,ny));
    if(nx!==pts[pts.length-1].x||ny!==pts[pts.length-1].y) pts.push({x:Math.round(nx),y:Math.round(ny)}); horiz=!horiz; } return pts; }
function buildNetwork(){ const screens=slides.length,total=screens*PERSCREEN,polys=[];
  for(let i=0;i<total;i++){ const bx=(Math.floor(i/PERSCREEN)+Math.random())*SW,by=34+Math.random()*(SH-68); polys.push(genPoly(bx,by,SH)); }
  const plsegs=polys.map(()=>[]),allsegs=[];
  polys.forEach((pts,pl)=>{ for(let i=0;i<pts.length-1;i++){ const seg={pl,a:pts[i],b:pts[i+1],horiz:pts[i].y===pts[i+1].y,cuts:[]}; plsegs[pl].push(seg); allsegs.push(seg); } });
  for(let p=0;p<allsegs.length;p++)for(let q=p+1;q<allsegs.length;q++){ const A=allsegs[p],B=allsegs[q];
    if(A.pl===B.pl||A.horiz===B.horiz)continue; const Hs=A.horiz?A:B,Vs=A.horiz?B:A,hy=Hs.a.y,vx=Vs.a.x;
    const hx1=Math.min(Hs.a.x,Hs.b.x),hx2=Math.max(Hs.a.x,Hs.b.x),vy1=Math.min(Vs.a.y,Vs.b.y),vy2=Math.max(Vs.a.y,Vs.b.y);
    if(vx>hx1&&vx<hx2&&hy>vy1&&hy<vy2){ Hs.cuts.push({x:vx,y:hy}); Vs.cuts.push({x:vx,y:hy}); } }
  const vmap=new Map(),verts=[];
  const vid=(x,y)=>{const k=x+'_'+y;let id=vmap.get(k); if(id==null){id=verts.length;verts.push({x,y,adj:new Map(),node:false,charge:0,near:false});vmap.set(k,id);}return id;};
  plsegs.forEach(segs=>segs.forEach(seg=>{
    const seq=[seg.a,...seg.cuts.sort((u,v)=>seg.horiz?(seg.b.x>seg.a.x?u.x-v.x:v.x-u.x):(seg.b.y>seg.a.y?u.y-v.y:v.y-u.y)),seg.b];
    for(let k=0;k<seq.length-1;k++){ const u=vid(seq[k].x,seq[k].y),w=vid(seq[k+1].x,seq[k+1].y); if(u===w)continue;
      const d=Math.hypot(verts[u].x-verts[w].x,verts[u].y-verts[w].y); verts[u].adj.set(w,d); verts[w].adj.set(u,d); } }));
  polys.forEach(pts=>{ verts[vid(pts[0].x,pts[0].y)].node=true; verts[vid(pts[pts.length-1].x,pts[pts.length-1].y)].node=true; });
  const edges=[],seen=new Set(),nodes=[];
  verts.forEach((v,id)=>{ v.adj.forEach((d,w)=>{const key=id<w?id+'_'+w:w+'_'+id; if(!seen.has(key)){seen.add(key);edges.push([id,w]);}}); if(v.node)nodes.push(id); });
  return {verts,edges,nodes}; }
function emit(id,inten){ net.verts[id].adj.forEach((len,w)=>{ if(pulses.length<MAXP) pulses.push({from:id,to:w,d:0,len,inten,depth:0}); }); }
function stepPulses(dt){ const nx=[];
  for(const p of pulses){ p.d+=SPEED*dt; if(p.d<p.len){nx.push(p);continue;}
    const over=p.d-p.len,ni=p.inten*HOPDECAY; if(p.depth>=MAXDEPTH||ni<MININTEN)continue;
    net.verts[p.to].adj.forEach((len,w)=>{ if(w===p.from||nx.length>=MAXP)return; nx.push({from:p.to,to:w,d:over%len,len,inten:ni,depth:p.depth+1}); }); }
  pulses.length=0; for(const n of nx)pulses.push(n); }
function updateCharge(dt,mwx,mwy){ for(const id of net.nodes){ const v=net.verts[id],d=Math.hypot(v.x-mwx,v.y-mwy);
    if(d<CHARGE_R){v.near=true;v.charge=Math.min(1,v.charge+dt*CHARGE_RATE*(1-d/CHARGE_R));}
    else{ if(v.near&&v.charge>0.06){emit(id,0.15+Math.pow(v.charge,1.4)*1.3);v.charge=0;} v.near=false;
      if(v.charge>0){v.charge-=dt*1.4;if(v.charge<0)v.charge=0;} } } }
function softGlow(x,y,r,col,a){ if(a<=0||r<=0)return; const g=ctxS.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(0.5,`rgba(${col},${a*0.4})`); g.addColorStop(1,`rgba(${col},0)`);
  ctxS.fillStyle=g; ctxS.beginPath(); ctxS.arc(x,y,r,0,6.2832); ctxS.fill(); }
function render(){ ctxS.setTransform(DPR,0,0,DPR,0,0); ctxS.clearRect(0,0,SW,SH); ctxS.save(); ctxS.translate(scrollX,0);
  const xmin=-scrollX-120,xmax=-scrollX+SW+120;
  ctxS.lineWidth=1.2;ctxS.lineCap='round';ctxS.strokeStyle='rgba(120,160,190,0.15)';
  for(const [u,w] of net.edges){ const a=net.verts[u],b=net.verts[w]; if(Math.max(a.x,b.x)<xmin||Math.min(a.x,b.x)>xmax)continue;
    ctxS.beginPath();ctxS.moveTo(a.x,a.y);ctxS.lineTo(b.x,b.y);ctxS.stroke(); }
  ctxS.fillStyle='rgba(120,160,190,0.22)';
  for(const id of net.nodes){ const v=net.verts[id]; if(v.x<xmin||v.x>xmax)continue; ctxS.beginPath();ctxS.arc(v.x,v.y,2.3,0,6.2832);ctxS.fill(); }
  ctxS.globalCompositeOperation='lighter';
  for(const id of net.nodes){ const v=net.verts[id],c=v.charge; if(c<0.03||v.x<xmin||v.x>xmax)continue;
    let r=6+c*13,a=0.16*c; if(c>=0.985){const o=0.5+0.5*Math.sin(timeNow*7.5);r+=o*2.5;a*=0.9+0.2*o;}
    softGlow(v.x,v.y,r,'79,209,224',a); ctxS.fillStyle=`rgba(180,244,255,${0.6*c})`;ctxS.beginPath();ctxS.arc(v.x,v.y,2.6,0,6.2832);ctxS.fill(); }
  ctxS.lineCap='round';
  for(const p of pulses){ const a=net.verts[p.from],b=net.verts[p.to],t=p.d/p.len,px=a.x+(b.x-a.x)*t,py=a.y+(b.y-a.y)*t;
    if(px<xmin||px>xmax)continue; const al=Math.min(1.3,p.inten),h=(16+al*16)*0.49/2;
    const ex=(b.x-a.x)/p.len,ey=(b.y-a.y)/p.len,x1=px-ex*h,y1=py-ey*h,x2=px+ex*h,y2=py+ey*h;
    softGlow(px,py,8+al*11,'79,209,224',Math.min(0.26,0.13*al));
    ctxS.strokeStyle=`rgba(180,244,255,${Math.min(0.9,0.5*al)})`;ctxS.lineWidth=1.4+al*1.5;
    ctxS.beginPath();ctxS.moveTo(x1,y1);ctxS.lineTo(x2,y2);ctxS.stroke(); }
  ctxS.globalCompositeOperation='source-over'; ctxS.restore(); }
let _last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-_last)/1000); _last=now; timeNow=now/1000;
  scrollX+=(-idx*SW-scrollX)*Math.min(1,dt*7); updateCharge(dt,mouse.x-scrollX,mouse.y); stepPulses(dt); render(); requestAnimationFrame(frame); }
function resizeSchem(){ DPR=Math.min(2,window.devicePixelRatio||1); SW=window.innerWidth; SH=window.innerHeight;
  schem.width=SW*DPR; schem.height=SH*DPR; net=buildNetwork(); scrollX=-idx*SW; }
resizeSchem();
let _rt; window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(resizeSchem,200);});
requestAnimationFrame(frame);

go(0);
</script>
