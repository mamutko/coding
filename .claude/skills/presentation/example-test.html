<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Example Test &mdash; Titanium Deck Style</title>
<!--
  EXAMPLE TEST for the `presentation` skill.
  A self-contained multiple-choice test in the repo's titanium / schematic
  style: paged deck, reactive canvas background, instant per-question feedback,
  animated results ring. Replace the QUESTIONS array to make your own test.
-->
<style>
  :root{
    --bg:#080b11; --ink:#e4ebf2; --muted:#93a1b1;
    --accent:#4fd1e0; --accent2:#76a8e6; --good:#5fe0a6; --bad:#e0764f;
    --line:rgba(150,175,200,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .mono{font-family:"Consolas","SF Mono",ui-monospace,Menlo,monospace}

  /* ---------- engineering background ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(120,150,180,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,150,180,.05) 1px,transparent 1px),
      linear-gradient(rgba(120,150,180,.10) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,150,180,.10) 1px,transparent 1px);
    background-size:26px 26px,26px 26px,130px 130px,130px 130px;
    background-position:var(--gx,0px) 0,var(--gx,0px) 0,var(--gx,0px) 0,var(--gx,0px) 0;
    transition:background-position .72s cubic-bezier(.76,0,.24,1);
    mask-image:radial-gradient(120% 110% at 50% 40%,#000 55%,transparent 100%);}
  .bg-vignette{position:absolute;inset:0;
    background:radial-gradient(130% 120% at 50% 30%,transparent 40%,rgba(0,0,0,.55) 100%),
               radial-gradient(80% 80% at 80% 90%,rgba(40,70,90,.18),transparent 60%);}
  .bg-schem{position:absolute;inset:0;width:100%;height:100%;opacity:.92}

  /* ---------- deck ---------- */
  .deck{position:relative;z-index:2;height:100%;width:100%;
    display:flex;transition:transform .72s cubic-bezier(.76,0,.24,1)}
  .slide{position:relative;min-width:100%;height:100vh;flex:0 0 100%;overflow-y:auto}
  .inner{min-height:100%;max-width:1080px;margin:0 auto;padding:9vh 7vw 13vh;
    display:flex;flex-direction:column;justify-content:center}

  .eyebrow{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);
    margin:0 0 18px;font-weight:600;opacity:.95}
  h1{font-size:clamp(34px,5.4vw,68px);line-height:1.04;margin:0;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:clamp(15px,1.6vw,20px);margin:14px 0 0;max-width:60ch;line-height:1.5}
  .gradtext{background:linear-gradient(92deg,#dfe9f2,#7fb4ea 60%,#4fd1e0);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  /* ---------- quiz ---------- */
  .qtag{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);
    margin:0 0 10px;font-weight:600}
  .qtext{font-size:clamp(20px,2.6vw,32px);line-height:1.25;margin:0 0 6px;font-weight:700;
    letter-spacing:-.01em;max-width:30ch}
  .options{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:14px;max-width:760px}
  .opt{position:relative;display:flex;align-items:center;gap:16px;
    padding:16px 20px 16px 18px;border-radius:14px;cursor:pointer;
    background:linear-gradient(155deg,rgba(140,162,184,.16),rgba(30,38,48,.55));
    border:1px solid rgba(150,172,194,.20);border-top-color:rgba(206,220,234,.42);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.35);
    font-size:17px;line-height:1.4;color:#d8e2ec;
    transition:transform .2s,border-color .25s,box-shadow .3s,background .3s}
  .opt:hover{transform:translateY(-2px);border-color:rgba(79,209,224,.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 26px rgba(79,209,224,.20)}
  .opt .badge{flex:0 0 34px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    font-weight:700;font-size:15px;color:#cfe7ee;
    background:linear-gradient(135deg,rgba(120,150,180,.3),rgba(40,50,62,.7));
    border:1px solid rgba(150,172,194,.3);transition:all .3s}
  .opt .txt{flex:1 1 auto}
  .opt .mark{flex:0 0 auto;font-size:20px;font-weight:700;opacity:0;transition:opacity .3s}
  .options.locked .opt{cursor:default}
  .options.locked .opt:hover{transform:none;border-color:rgba(150,172,194,.20);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.35)}
  .opt.correct{border-color:rgba(95,224,166,.7);
    background:linear-gradient(155deg,rgba(95,224,166,.2),rgba(30,48,42,.6));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 26px rgba(95,224,166,.28)}
  .opt.correct .badge{background:linear-gradient(135deg,#5fe0a6,#3bbf86);color:#06120d;border-color:transparent}
  .opt.correct .mark{opacity:1;color:var(--good)}
  .opt.wrong{border-color:rgba(224,118,79,.7);
    background:linear-gradient(155deg,rgba(224,118,79,.18),rgba(48,32,28,.6));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 26px rgba(224,118,79,.25)}
  .opt.wrong .badge{background:linear-gradient(135deg,#e0764f,#bf553b);color:#150805;border-color:transparent}
  .opt.wrong .mark{opacity:1;color:var(--bad)}
  .opt.dim{opacity:.5}

  .explain{margin-top:22px;max-width:760px;font-size:15px;line-height:1.5;color:#cdd8e3;
    padding:14px 18px;border-radius:12px;opacity:0;transform:translateY(8px);
    background:linear-gradient(155deg,rgba(79,209,224,.10),rgba(30,38,48,.5));
    border:1px solid rgba(79,209,224,.22);transition:opacity .4s,transform .4s}
  .explain.show{opacity:1;transform:none}
  .explain b{color:#fff}

  /* ---------- results ---------- */
  .scorewrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
  .ring{position:relative;width:230px;height:230px;margin:18px auto 6px}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center}
  .ring .num .big{font-size:46px;font-weight:700;line-height:1;
    background:linear-gradient(92deg,#eaf2fa,#5fd6e4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .verdict{font-size:clamp(22px,3vw,36px);font-weight:700;margin:6px 0 0}
  .btn{display:inline-flex;align-items:center;gap:10px;margin-top:30px;cursor:pointer;
    padding:14px 26px;border-radius:13px;font-size:16px;font-weight:600;color:#eaf3f7;
    background:linear-gradient(155deg,rgba(140,162,184,.24),rgba(30,38,48,.6));
    border:1px solid rgba(150,172,194,.3);border-top-color:rgba(206,220,234,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 30px rgba(0,0,0,.4);
    transition:transform .2s,box-shadow .3s,border-color .3s}
  .btn:hover{transform:translateY(-2px);border-color:rgba(79,209,224,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 30px rgba(79,209,224,.3)}

  .reveal{opacity:0;transform:translateY(20px);
    transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0s)}
  .slide.active .reveal{opacity:1;transform:none}

  /* ---------- chrome ---------- */
  .brand{position:fixed;top:26px;left:34px;z-index:6;display:flex;align-items:center;gap:12px}
  .brand .dot{width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#9cf3ff,#2aa6b6);box-shadow:0 0 14px rgba(79,209,224,.8)}
  .brand .t{font-size:14px;letter-spacing:.32em;font-weight:700}
  .brand .s{font-size:11px;letter-spacing:.18em;color:var(--muted)}
  .counter{position:fixed;top:26px;right:34px;z-index:6;font-size:13px;letter-spacing:.18em;color:var(--muted)}
  .counter b{color:var(--ink)}
  .scorepill{position:fixed;top:52px;right:34px;z-index:6;font-size:12px;letter-spacing:.14em;color:var(--accent)}

  .progress{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;
    display:flex;gap:7px;align-items:center;max-width:90vw;flex-wrap:wrap;justify-content:center}
  .tick{position:relative;width:24px;height:6px;border-radius:4px;cursor:pointer;
    background:rgba(150,175,200,.18);transition:background .3s,box-shadow .3s,width .3s}
  .tick:hover{background:rgba(150,175,200,.4)}
  .tick.on{width:38px;background:linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow:0 0 calc(8px + var(--p,0)*14px) rgba(79,209,224,.6)}
  .tick.answered{background:rgba(95,224,166,.55)}

  .nav{position:fixed;top:50%;z-index:6;transform:translateY(-50%);
    width:60px;height:84px;display:grid;place-items:center;cursor:pointer;
    border-radius:14px;border:1px solid rgba(150,175,200,calc(.18 + var(--p,0)*.5));
    background:linear-gradient(155deg,rgba(140,162,184,calc(.10 + var(--p,0)*.22)),rgba(30,38,48,.5));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 calc(var(--p,0)*34px) rgba(79,209,224,calc(var(--p,0)*.7));
    transition:opacity .35s,transform .25s;backdrop-filter:blur(2px)}
  .nav:hover{transform:translateY(-50%) scale(1.05)}
  .nav svg{width:24px;height:24px;stroke:#dbe6f1;stroke-width:2.2;fill:none;
    filter:drop-shadow(0 0 calc(var(--p,0)*6px) rgba(79,209,224,.9))}
  .nav.next{right:30px} .nav.prev{left:30px}
  .nav.hide{opacity:0;pointer-events:none}
  .hint{position:fixed;right:34px;bottom:26px;z-index:6;color:var(--muted);font-size:12px;letter-spacing:.05em}
  @media (max-width:880px){.nav{width:46px;height:64px}.inner{padding:12vh 6vw 14vh}.qtext{max-width:none}}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-grid"></div>
  <canvas class="bg-schem" id="schem"></canvas>
  <div class="bg-vignette"></div>
</div>

<div class="brand">
  <div class="dot"></div>
  <div><div class="t mono">EXAMPLE&nbsp;TEST</div><div class="s mono">TITANIUM DECK STYLE</div></div>
</div>
<div class="counter mono"><b id="curNo">01</b> / <span id="totNo">--</span></div>
<div class="scorepill mono" id="scorePill"></div>

<div class="deck" id="deck"></div>

<div class="nav prev reactive hide" id="prev" title="Previous"><svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg></div>
<div class="nav next reactive" id="next" title="Next"><svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></div>

<div class="progress" id="progress"></div>
<div class="hint mono">&larr; &rarr; / space &middot; 1&ndash;4</div>

<script>
/* ============================================================
   QUESTIONS — the single source of truth for the test.
   Replace these to build your own test.
   ============================================================ */
const QUESTIONS=[
  { topic:"Deck basics",
    q:"What carries the live, mouse-reactive schematic background?",
    options:["A looping GIF","A <canvas> element","A CSS animation only","An <img> sprite"],
    answer:1,
    explain:"The schematic network is drawn on a <canvas id=\"schem\"> every frame, so it can react to the cursor and scroll with the deck." },
  { topic:"Navigation",
    q:"How does moving to the next slide animate the deck?",
    options:["It fades between slides","It scales the slide up",
             "It translates the flex .deck horizontally","It reloads the page"],
    answer:2,
    explain:"go(i) sets transform: translateX(-i*100%) on the .deck, so slides slide horizontally in the travel direction." },
  { topic:"Feedback",
    q:"After you pick an answer, what happens to the question?",
    options:["Nothing until the end","It locks — one attempt, then shows feedback",
             "You can keep changing it","It skips to results"],
    answer:1,
    explain:"Selecting an option locks the question: the correct option turns green, a wrong pick turns red, and an explanation slides in." },
];

const LETTERS=["A","B","C","D"];
const deck=document.getElementById('deck');
let answered=new Array(QUESTIONS.length).fill(null);
let score=0;

/* ---------- build the deck ---------- */
deck.insertAdjacentHTML('beforeend',`
  <section class="slide" data-title="Start">
    <div class="inner" style="align-items:flex-start">
      <p class="eyebrow reveal" style="--d:.05s">Example &middot; Titanium Deck Test</p>
      <h1 class="reveal" style="--d:.15s">A short <span class="gradtext">demo</span> test</h1>
      <p class="sub reveal" style="--d:.35s">${QUESTIONS.length} multiple-choice questions with instant feedback. Navigate with the chevrons, the arrow keys, the dots below, or number keys 1&ndash;4.</p>
      <div class="btn reveal" style="--d:.6s" id="startBtn">Begin &nbsp;&rarr;</div>
    </div>
  </section>`);

QUESTIONS.forEach((item,qi)=>{
  const opts=item.options.map((o,oi)=>`
    <li class="opt" data-qi="${qi}" data-oi="${oi}">
      <span class="badge">${LETTERS[oi]}</span><span class="txt">${o}</span><span class="mark"></span>
    </li>`).join('');
  deck.insertAdjacentHTML('beforeend',`
    <section class="slide" data-title="Q${qi+1}">
      <div class="inner">
        <p class="qtag reveal" style="--d:.05s">Question ${qi+1} of ${QUESTIONS.length} &middot; ${item.topic}</p>
        <h2 class="qtext reveal" style="--d:.12s;font-size:clamp(20px,2.6vw,32px)">${item.q}</h2>
        <ul class="options reveal" style="--d:.22s">${opts}</ul>
        <div class="explain" data-exp="${qi}"></div>
      </div>
    </section>`);
});

deck.insertAdjacentHTML('beforeend',`
  <section class="slide" data-title="Results">
    <div class="inner"><div class="scorewrap">
      <p class="eyebrow reveal" style="--d:.05s">Test Complete</p>
      <div class="ring reveal" style="--d:.15s">
        <svg width="230" height="230" viewBox="0 0 230 230">
          <circle cx="115" cy="115" r="100" fill="none" stroke="rgba(150,175,200,.18)" stroke-width="16"/>
          <circle id="ringFg" cx="115" cy="115" r="100" fill="none" stroke="url(#g)" stroke-width="16"
                  stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="628"
                  style="transition:stroke-dashoffset 1.1s cubic-bezier(.7,0,.2,1)"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4fd1e0"/><stop offset="1" stop-color="#76a8e6"/></linearGradient></defs>
        </svg>
        <div class="num"><span class="big" id="scoreNum">0</span></div>
      </div>
      <div class="verdict gradtext reveal" id="verdict" style="--d:.4s">&nbsp;</div>
      <p class="sub reveal" id="resultMsg" style="--d:.5s;text-align:center;max-width:46ch">&nbsp;</p>
      <div class="btn reveal" style="--d:.65s" id="retryBtn">&#8634; &nbsp;Retake test</div>
    </div></div>
  </section>`);

/* ---------- navigation ---------- */
const slides=[...document.querySelectorAll('.slide')];
const prev=document.getElementById('prev'), next=document.getElementById('next');
const curNo=document.getElementById('curNo'), totNo=document.getElementById('totNo');
const prog=document.getElementById('progress'), scorePill=document.getElementById('scorePill');
totNo.textContent=String(slides.length).padStart(2,'0');
let idx=0;

slides.forEach((s,i)=>{ const t=document.createElement('div');
  t.className='tick reactive'; t.title=s.dataset.title; t.addEventListener('click',()=>go(i)); prog.appendChild(t); });
const ticks=[...prog.children];

function go(i){
  idx=Math.max(0,Math.min(slides.length-1,i));
  deck.style.transform=`translateX(${-idx*100}%)`;
  document.documentElement.style.setProperty('--gx',(-idx*100)+'vw');
  slides.forEach((s,k)=>s.classList.toggle('active',k===idx));
  ticks.forEach((t,k)=>t.classList.toggle('on',k===idx));
  curNo.textContent=String(idx+1).padStart(2,'0');
  prev.classList.toggle('hide',idx===0);
  next.classList.toggle('hide',idx===slides.length-1);
  scorePill.textContent=answered.filter(a=>a!==null).length?`SCORE ${score} / ${QUESTIONS.length}`:'';
  if(slides[idx].dataset.title==='Results') showResults();
}
next.addEventListener('click',()=>go(idx+1));
prev.addEventListener('click',()=>go(idx-1));
window.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(idx+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1);}
  else if(e.key===' '){if(e.target===document.body){e.preventDefault();go(idx+1);}}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(slides.length-1);
  else if(['1','2','3','4'].includes(e.key)){const list=slides[idx].querySelector('.options');
    if(list){const o=list.children[+e.key-1]; if(o)o.click();}}
});
let tx=0,ty=0;
window.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))go(idx+(dx<0?1:-1));},{passive:true});

document.getElementById('startBtn').addEventListener('click',()=>go(1));
document.getElementById('retryBtn').addEventListener('click',resetQuiz);

/* ---------- answering ---------- */
deck.addEventListener('click',e=>{
  const opt=e.target.closest('.opt'); if(!opt) return;
  const list=opt.parentElement; if(list.classList.contains('locked')) return;
  const qi=+opt.dataset.qi, oi=+opt.dataset.oi, correct=QUESTIONS[qi].answer;
  list.classList.add('locked'); answered[qi]=oi;
  [...list.children].forEach(li=>{ const lo=+li.dataset.oi;
    if(lo===correct){li.classList.add('correct');li.querySelector('.mark').textContent='✓';}
    else if(lo===oi){li.classList.add('wrong');li.querySelector('.mark').textContent='✗';}
    else li.classList.add('dim'); });
  if(oi===correct) score++;
  ticks[qi+1].classList.add('answered');
  const exp=deck.querySelector(`[data-exp="${qi}"]`);
  exp.innerHTML=(oi===correct?'<b>Correct!</b> ':'<b>Not quite.</b> ')+QUESTIONS[qi].explain;
  exp.classList.add('show');
  scorePill.textContent=`SCORE ${score} / ${QUESTIONS.length}`;
});

function resetQuiz(){
  answered=new Array(QUESTIONS.length).fill(null); score=0;
  deck.querySelectorAll('.options').forEach(list=>{ list.classList.remove('locked');
    [...list.children].forEach(li=>{li.classList.remove('correct','wrong','dim');li.querySelector('.mark').textContent='';}); });
  deck.querySelectorAll('.explain').forEach(x=>{x.classList.remove('show');x.innerHTML='';});
  ticks.forEach(t=>t.classList.remove('answered'));
  scorePill.textContent=''; document.getElementById('ringFg').style.strokeDashoffset='628'; go(0);
}

function showResults(){
  const pct=Math.round(score/QUESTIONS.length*100);
  document.getElementById('ringFg').style.strokeDashoffset=String(628*(1-score/QUESTIONS.length));
  const numEl=document.getElementById('scoreNum');
  let cur=0; clearInterval(showResults._t); numEl.textContent=`0 / ${QUESTIONS.length}`;
  showResults._t=setInterval(()=>{cur++;numEl.textContent=`${cur} / ${QUESTIONS.length}`;
    if(cur>=score)clearInterval(showResults._t);},420/Math.max(1,score));
  let verdict,msg;
  if(pct===100){verdict="Perfect score!";msg="You nailed every question.";}
  else if(pct>=67){verdict="Great work!";msg="A strong grasp of the deck mechanics.";}
  else if(pct>=34){verdict="Good effort";msg="Review the pieces you missed and try again.";}
  else {verdict="Time to review";msg="Reread the skill, then retake the test.";}
  document.getElementById('verdict').textContent=verdict;
  document.getElementById('resultMsg').textContent=`You answered ${score} of ${QUESTIONS.length} correctly. ${msg}`;
  scorePill.textContent=`SCORE ${score} / ${QUESTIONS.length}`;
}

/* ---------- mouse proximity (reactive chrome) ---------- */
const mouse={x:-99999,y:-99999};
window.addEventListener('pointermove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY;
  document.querySelectorAll('.reactive').forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width===0)return;
    const d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));
    el.style.setProperty('--p',Math.max(0,1-d/240).toFixed(3)); }); });
window.addEventListener('pointerleave',()=>{mouse.x=-99999;mouse.y=-99999;});

/* ---------- reactive schematic network (generic, content-agnostic) ---------- */
const schem=document.getElementById('schem'), ctxS=schem.getContext('2d');
let SW=0,SH=0,DPR=1,net=null,scrollX=0; const pulses=[];
const CHARGE_R=130,CHARGE_RATE=1.45,SPEED=700,HOPDECAY=0.8,MININTEN=0.1,MAXDEPTH=8,MAXP=220,PERSCREEN=6;
let timeNow=0;
function genPoly(x,y,H){ const pts=[{x:Math.round(x),y:Math.round(y)}]; const steps=3+(Math.random()*4|0);
  let horiz=Math.random()<0.5;
  for(let s=0;s<steps;s++){ const len=(60+Math.random()*170)*1.75, dir=Math.random()<0.5?-1:1;
    let nx=pts[pts.length-1].x, ny=pts[pts.length-1].y; if(horiz) nx+=dir*len; else ny+=dir*len;
    ny=Math.max(26,Math.min(H-26,ny));
    if(nx!==pts[pts.length-1].x||ny!==pts[pts.length-1].y) pts.push({x:Math.round(nx),y:Math.round(ny)}); horiz=!horiz; }
  return pts; }
function buildNetwork(){ const screens=slides.length,total=screens*PERSCREEN,polys=[];
  for(let i=0;i<total;i++){ const bx=(Math.floor(i/PERSCREEN)+Math.random())*SW, by=34+Math.random()*(SH-68); polys.push(genPoly(bx,by,SH)); }
  const plsegs=polys.map(()=>[]),allsegs=[];
  polys.forEach((pts,pl)=>{ for(let i=0;i<pts.length-1;i++){ const seg={pl,a:pts[i],b:pts[i+1],horiz:pts[i].y===pts[i+1].y,cuts:[]}; plsegs[pl].push(seg); allsegs.push(seg); } });
  for(let p=0;p<allsegs.length;p++)for(let q=p+1;q<allsegs.length;q++){ const A=allsegs[p],B=allsegs[q];
    if(A.pl===B.pl||A.horiz===B.horiz) continue; const Hs=A.horiz?A:B,Vs=A.horiz?B:A,hy=Hs.a.y,vx=Vs.a.x;
    const hx1=Math.min(Hs.a.x,Hs.b.x),hx2=Math.max(Hs.a.x,Hs.b.x),vy1=Math.min(Vs.a.y,Vs.b.y),vy2=Math.max(Vs.a.y,Vs.b.y);
    if(vx>hx1&&vx<hx2&&hy>vy1&&hy<vy2){ Hs.cuts.push({x:vx,y:hy}); Vs.cuts.push({x:vx,y:hy}); } }
  const vmap=new Map(),verts=[];
  const vid=(x,y)=>{const k=x+'_'+y;let id=vmap.get(k);
    if(id==null){id=verts.length;verts.push({x,y,adj:new Map(),node:false,charge:0,near:false});vmap.set(k,id);}return id;};
  plsegs.forEach(segs=>segs.forEach(seg=>{
    const seq=[seg.a,...seg.cuts.sort((u,v)=>seg.horiz?(seg.b.x>seg.a.x?u.x-v.x:v.x-u.x):(seg.b.y>seg.a.y?u.y-v.y:v.y-u.y)),seg.b];
    for(let k=0;k<seq.length-1;k++){ const u=vid(seq[k].x,seq[k].y),w=vid(seq[k+1].x,seq[k+1].y); if(u===w)continue;
      const d=Math.hypot(verts[u].x-verts[w].x,verts[u].y-verts[w].y); verts[u].adj.set(w,d); verts[w].adj.set(u,d); } }));
  polys.forEach(pts=>{ verts[vid(pts[0].x,pts[0].y)].node=true; verts[vid(pts[pts.length-1].x,pts[pts.length-1].y)].node=true; });
  const edges=[],seen=new Set(),nodes=[];
  verts.forEach((v,id)=>{ v.adj.forEach((d,w)=>{const key=id<w?id+'_'+w:w+'_'+id; if(!seen.has(key)){seen.add(key);edges.push([id,w]);}}); if(v.node)nodes.push(id); });
  return {verts,edges,nodes}; }
function emit(id,inten){ net.verts[id].adj.forEach((len,w)=>{ if(pulses.length<MAXP) pulses.push({from:id,to:w,d:0,len,inten,depth:0}); }); }
function stepPulses(dt){ const nx=[];
  for(const p of pulses){ p.d+=SPEED*dt; if(p.d<p.len){nx.push(p);continue;}
    const over=p.d-p.len,ni=p.inten*HOPDECAY; if(p.depth>=MAXDEPTH||ni<MININTEN)continue;
    net.verts[p.to].adj.forEach((len,w)=>{ if(w===p.from||nx.length>=MAXP)return; nx.push({from:p.to,to:w,d:over%len,len,inten:ni,depth:p.depth+1}); }); }
  pulses.length=0; for(const n of nx)pulses.push(n); }
function updateCharge(dt,mwx,mwy){ for(const id of net.nodes){ const v=net.verts[id],d=Math.hypot(v.x-mwx,v.y-mwy);
    if(d<CHARGE_R){v.near=true;v.charge=Math.min(1,v.charge+dt*CHARGE_RATE*(1-d/CHARGE_R));}
    else{ if(v.near&&v.charge>0.06){emit(id,0.15+Math.pow(v.charge,1.4)*1.3);v.charge=0;} v.near=false;
      if(v.charge>0){v.charge-=dt*1.4;if(v.charge<0)v.charge=0;} } } }
function softGlow(x,y,r,col,a){ if(a<=0||r<=0)return; const g=ctxS.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(0.5,`rgba(${col},${a*0.4})`); g.addColorStop(1,`rgba(${col},0)`);
  ctxS.fillStyle=g; ctxS.beginPath(); ctxS.arc(x,y,r,0,6.2832); ctxS.fill(); }
function render(){ ctxS.setTransform(DPR,0,0,DPR,0,0); ctxS.clearRect(0,0,SW,SH); ctxS.save(); ctxS.translate(scrollX,0);
  const xmin=-scrollX-120,xmax=-scrollX+SW+120;
  ctxS.lineWidth=1.2;ctxS.lineCap='round';ctxS.strokeStyle='rgba(120,160,190,0.15)';
  for(const [u,w] of net.edges){ const a=net.verts[u],b=net.verts[w]; if(Math.max(a.x,b.x)<xmin||Math.min(a.x,b.x)>xmax)continue;
    ctxS.beginPath();ctxS.moveTo(a.x,a.y);ctxS.lineTo(b.x,b.y);ctxS.stroke(); }
  ctxS.fillStyle='rgba(120,160,190,0.22)';
  for(const id of net.nodes){ const v=net.verts[id]; if(v.x<xmin||v.x>xmax)continue; ctxS.beginPath();ctxS.arc(v.x,v.y,2.3,0,6.2832);ctxS.fill(); }
  ctxS.globalCompositeOperation='lighter';
  for(const id of net.nodes){ const v=net.verts[id],c=v.charge; if(c<0.03||v.x<xmin||v.x>xmax)continue;
    let r=6+c*13,a=0.16*c; if(c>=0.985){const o=0.5+0.5*Math.sin(timeNow*7.5);r+=o*2.5;a*=0.9+0.2*o;}
    softGlow(v.x,v.y,r,'79,209,224',a); ctxS.fillStyle=`rgba(180,244,255,${0.6*c})`;ctxS.beginPath();ctxS.arc(v.x,v.y,2.6,0,6.2832);ctxS.fill(); }
  ctxS.lineCap='round';
  for(const p of pulses){ const a=net.verts[p.from],b=net.verts[p.to],t=p.d/p.len,px=a.x+(b.x-a.x)*t,py=a.y+(b.y-a.y)*t;
    if(px<xmin||px>xmax)continue; const al=Math.min(1.3,p.inten),h=(16+al*16)*0.49/2;
    const ex=(b.x-a.x)/p.len,ey=(b.y-a.y)/p.len,x1=px-ex*h,y1=py-ey*h,x2=px+ex*h,y2=py+ey*h;
    softGlow(px,py,8+al*11,'79,209,224',Math.min(0.26,0.13*al));
    ctxS.strokeStyle=`rgba(180,244,255,${Math.min(0.9,0.5*al)})`;ctxS.lineWidth=1.4+al*1.5;
    ctxS.beginPath();ctxS.moveTo(x1,y1);ctxS.lineTo(x2,y2);ctxS.stroke(); }
  ctxS.globalCompositeOperation='source-over'; ctxS.restore(); }
let _last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-_last)/1000); _last=now; timeNow=now/1000;
  scrollX+=(-idx*SW-scrollX)*Math.min(1,dt*7); updateCharge(dt,mouse.x-scrollX,mouse.y); stepPulses(dt); render(); requestAnimationFrame(frame); }
function resizeSchem(){ DPR=Math.min(2,window.devicePixelRatio||1); SW=window.innerWidth; SH=window.innerHeight;
  schem.width=SW*DPR; schem.height=SH*DPR; net=buildNetwork(); scrollX=-idx*SW; }
resizeSchem();
let _rt; window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(resizeSchem,200);});
requestAnimationFrame(frame);

go(0);
</script>
