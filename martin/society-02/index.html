<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Society</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;   /* we handle pinch/drag/tap ourselves */
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 10px;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.55);
    color: #e9ecef;
    font-size: 12px;
    line-height: 1.5;
    border-radius: 6px;
    pointer-events: none;
    user-select: none;
  }
  #hud b { color: #ffd166; }
  #hud #stats { margin-top: 4px; }
  #hud .legend { margin-top: 4px; }
  #hud .keys { margin-top: 6px; opacity: 0.8; }

  #overlay {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 260px;
    box-sizing: border-box;
    padding: 18px 16px;
    background: rgba(15, 18, 28, 0.92);
    color: #e9ecef;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: -2px 0 14px rgba(0, 0, 0, 0.45);
    z-index: 10;
  }
  #overlay[hidden] { display: none; }
  #overlay h2 { margin: 0 0 14px; font-size: 16px; color: #ffd166; }
  #overlay-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 4px;
    background: #33384a;
    color: #e9ecef;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  #overlay-close:hover { background: #454b60; }
  #overlay .prop { display: flex; justify-content: space-between; margin: 6px 0; }
  #overlay .prop span:first-child { opacity: 0.8; }
  #overlay .bar {
    height: 8px;
    background: #2a2f3d;
    border-radius: 4px;
    overflow: hidden;
    margin: 2px 0 12px;
  }
  #overlay .bar > span { display: block; height: 100%; }
  #game { cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div><b>Society</b></div>
  <div id="stats">Day 1</div>
  <div class="legend">
    <span style="color:#e8a33d">&#9679;</span> food &nbsp;
    <span style="color:#5fb0e8">&#9679;</span> rest &nbsp;
    <span style="color:#9aa0ad">&#9679;</span> idle
  </div>
  <div class="keys">Zoom: <b>PageUp</b>/<b>PageDown</b>, <b>+</b>/<b>-</b>, or wheel &nbsp; Pan: <b>WASD</b>/arrows</div>
  <div class="keys">Click to inspect &amp; lock the mouse (edges scroll) &middot; <b>ESC</b> to release</div>
  <div class="keys">Touch: drag to pan &middot; pinch to zoom &middot; tap to inspect</div>
</div>

<div id="overlay" hidden>
  <button id="overlay-close" aria-label="Close" title="Close">&times;</button>
  <div id="overlay-content"></div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Constants
 * ------------------------------------------------------------------ */
const BOARD_SIZE = 100;          // 100 x 100 tiles
const TURN_MS = 400;             // one game turn every 400ms
const FRAME_MS = 80;             // animation frame every 80ms
const FRAMES_PER_TURN = TURN_MS / FRAME_MS;   // 5 animation frames per turn
const NPC_COUNT = 10;

// Game clock: a full day is this many turns. The day/night cycle modulates the
// thresholds at which NPCs decide to act on their needs.
const DAY_LENGTH_TURNS = 120;

// Facility types. Each restores one NPC need while the NPC is inside.
const FACILITY = { HOUSE: "house", ORCHARD: "orchard" };
const FACILITY_DEFS = {
  house: {
    w: 2, h: 2, capacity: 4, label: "House", icon: "\u{1F3E1}",
    restores: "alertness",
    tint: "rgba(212,134,74,0.40)", border: "rgba(120,70,40,0.9)",
  },
  orchard: {
    w: 3, h: 3, capacity: 6, label: "Orchard", icon: "\u{1F34E}",
    restores: "fullness",
    tint: "rgba(70,165,80,0.38)", border: "rgba(40,90,45,0.9)",
  },
};
// How many of each to seed onto the map at game start.
const NUM_HOUSES = 7;
const NUM_ORCHARDS = 5;

// NPC needs are on a 0..1000 scale. They decay each turn and are replenished
// inside the matching facility; reaching 0 kills the NPC.
const NEED_MAX = 1000;
const NEED_DECAY = 1;          // per turn, for every need
const NEED_REPLENISH = 15;     // per turn while inside the restoring facility
const NEED_HARD_FLOOR = 300;   // always seek help below this (survival), any time
const NEED_THRESHOLD_BASE = 200;   // day/night threshold swings between...
const NEED_THRESHOLD_AMP = 700;    // ...BASE and BASE+AMP across the cycle
const NEED_SATISFIED = 980;    // leave a facility once the restored need reaches this

// NPC behaviour states (see the state machine in updateNPCs).
const NPC_STATE = {
  EATING: "eating",
  RESTING: "resting",
  SEEKING_FOOD: "seeking-food",
  SEEKING_REST: "seeking-rest",
  WANDERING: "wandering",
  DEAD: "dead",
};
const NPC_STATE_COLOR = {
  eating: "#e8a33d",
  "seeking-food": "#e8a33d",
  resting: "#5fb0e8",
  "seeking-rest": "#5fb0e8",
  wandering: "#9aa0ad",
};

// Tile sprite geometry (see resources/generate_tiles.py and README).
const SPRITE_SIZE = 96;       // sprite PNGs are 96x96
const SPRITE_CORE = 64;       // opaque core maps to exactly one board tile
const SPRITE_OVERHANG = (SPRITE_SIZE - SPRITE_CORE) / 2;   // 16px fading border

// Landscape tile types.
const TILE = {
  OCEAN: 0,
  GRASSLAND: 1,
  WOODS: 2,
  MOUNTAINS: 3,
};

// Fallback flat colours, used until the sprite bitmaps have loaded.
const TILE_COLORS = {
  [TILE.OCEAN]:     "#1d5a8a",
  [TILE.GRASSLAND]: "#5fa463",
  [TILE.WOODS]:     "#2f6d3f",
  [TILE.MOUNTAINS]: "#8a8d91",
};

// Sprite bitmaps per tile type. Woods has several variations for variability.
const SPRITE_SRC = {
  [TILE.OCEAN]:     ["resources/ocean.png"],
  [TILE.GRASSLAND]: ["resources/grassland.png"],
  [TILE.WOODS]:     ["resources/woods-1.png", "resources/woods-2.png", "resources/woods-3.png"],
  [TILE.MOUNTAINS]: ["resources/mountains.png"],
};

const sprites = {};   // tile type -> array of Image

function loadSprites() {
  for (const tile of Object.keys(SPRITE_SRC)) {
    sprites[tile] = SPRITE_SRC[tile].map((src) => {
      const img = new Image();
      img.src = src;
      return img;
    });
  }
}

function spriteFor(tile, variant) {
  const arr = sprites[tile];
  if (!arr || arr.length === 0) return null;
  return arr[variant % arr.length];
}

// Tiles NPCs can stand on / move through.
function isWalkable(tile) {
  return tile === TILE.GRASSLAND || tile === TILE.WOODS;
}

/* ------------------------------------------------------------------ *
 * Utilities
 * ------------------------------------------------------------------ */
function randInt(min, max) {            // inclusive
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function inBounds(x, y) {
  return x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE;
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/* ------------------------------------------------------------------ *
 * Board generation
 * ------------------------------------------------------------------ */
// Paint a filled circle of `value` centred at (cx, cy) with the given radius.
// `onlyOnGrassland` restricts the centre-pick caller; here we just paint.
function paintCircle(board, cx, cy, radius, value) {
  const r2 = radius * radius;
  for (let y = cy - radius; y <= cy + radius; y++) {
    for (let x = cx - radius; x <= cx + radius; x++) {
      if (!inBounds(x, y)) continue;
      const dx = x - cx;
      const dy = y - cy;
      if (dx * dx + dy * dy <= r2) {
        board[y][x] = value;
      }
    }
  }
}

// Collect all tile coordinates currently equal to `value`.
function tilesOfType(board, value) {
  const out = [];
  for (let y = 0; y < BOARD_SIZE; y++) {
    for (let x = 0; x < BOARD_SIZE; x++) {
      if (board[y][x] === value) out.push([x, y]);
    }
  }
  return out;
}

function generateBoard() {
  // Start with all ocean.
  const board = [];
  for (let y = 0; y < BOARD_SIZE; y++) {
    board.push(new Array(BOARD_SIZE).fill(TILE.OCEAN));
  }

  // 5 random locations -> grassland, radius 20-50.
  for (let i = 0; i < 5; i++) {
    const cx = randInt(0, BOARD_SIZE - 1);
    const cy = randInt(0, BOARD_SIZE - 1);
    paintCircle(board, cx, cy, randInt(20, 50), TILE.GRASSLAND);
  }

  // 20 random locations on grassland -> woods, radius 4-15.
  paintFeatureOnGrassland(board, 20, 4, 15, TILE.WOODS);

  // 7 random locations on grassland -> mountains, radius 3-12.
  paintFeatureOnGrassland(board, 7, 3, 12, TILE.MOUNTAINS);

  return board;
}

// Assign each tile a sprite-variation index, chosen once so it stays stable
// across turns. Only matters for tile types with more than one sprite (woods).
function buildVariants(board) {
  const variants = [];
  for (let y = 0; y < BOARD_SIZE; y++) {
    const row = new Array(BOARD_SIZE).fill(0);
    for (let x = 0; x < BOARD_SIZE; x++) {
      const n = SPRITE_SRC[board[y][x]].length;
      row[x] = n > 1 ? randInt(0, n - 1) : 0;
    }
    variants.push(row);
  }
  return variants;
}

// Pick `count` centres that currently sit on grassland and paint circles.
function paintFeatureOnGrassland(board, count, minR, maxR, value) {
  for (let i = 0; i < count; i++) {
    const grass = tilesOfType(board, TILE.GRASSLAND);
    if (grass.length === 0) return;
    const [cx, cy] = grass[randInt(0, grass.length - 1)];
    paintCircle(board, cx, cy, randInt(minR, maxR), value);
  }
}

/* ------------------------------------------------------------------ *
 * Movement helpers
 * ------------------------------------------------------------------ */
const DIRECTIONS = [
  [0, -1], [0, 1], [-1, 0], [1, 0],
];

function key(x, y) {
  return y * BOARD_SIZE + x;
}

// A tile blocks movement if it is off-board, not walkable landscape, or
// covered by a facility footprint. (Facility entrance tiles are not part of
// the footprint, so they remain passable.)
function isBlocked(board, buildingGrid, x, y) {
  if (!inBounds(x, y)) return true;
  if (!isWalkable(board[y][x])) return true;
  return buildingGrid[y][x] !== null;
}

// Breadth-first search over static obstacles (terrain + buildings, ignoring
// other NPCs, which move). Returns the first tile to step to on the shortest
// path from (sx,sy) to (tx,ty), or null if already there / unreachable.
function bfsNextStep(board, buildingGrid, sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return null;
  const cameFrom = new Int32Array(BOARD_SIZE * BOARD_SIZE).fill(-1);
  const start = key(sx, sy);
  cameFrom[start] = start;            // mark visited
  const queue = [[sx, sy]];
  let head = 0;
  while (head < queue.length) {
    const [cx, cy] = queue[head++];
    if (cx === tx && cy === ty) {
      // Walk back to the tile right after the start.
      let cur = key(cx, cy);
      while (cameFrom[cur] !== start) cur = cameFrom[cur];
      return [cur % BOARD_SIZE, Math.floor(cur / BOARD_SIZE)];
    }
    for (const [dx, dy] of DIRECTIONS) {
      const nx = cx + dx;
      const ny = cy + dy;
      // The goal tile itself is the entrance (always passable); other tiles
      // must be unblocked.
      if (!(nx === tx && ny === ty) && isBlocked(board, buildingGrid, nx, ny)) continue;
      if (!inBounds(nx, ny)) continue;
      const nk = key(nx, ny);
      if (cameFrom[nk] !== -1) continue;
      cameFrom[nk] = key(cx, cy);
      queue.push([nx, ny]);
    }
  }
  return null;
}

/* ------------------------------------------------------------------ *
 * Facilities
 * ------------------------------------------------------------------ */
// Find the largest connected region of walkable tiles (4-connectivity) so we
// can seed everything onto one reachable landmass.
function largestWalkableComponent(board) {
  const seen = new Uint8Array(BOARD_SIZE * BOARD_SIZE);
  let best = [];
  for (let y = 0; y < BOARD_SIZE; y++) {
    for (let x = 0; x < BOARD_SIZE; x++) {
      if (seen[key(x, y)] || !isWalkable(board[y][x])) continue;
      const comp = [];
      const queue = [[x, y]];
      seen[key(x, y)] = 1;
      let head = 0;
      while (head < queue.length) {
        const [cx, cy] = queue[head++];
        comp.push([cx, cy]);
        for (const [dx, dy] of DIRECTIONS) {
          const nx = cx + dx, ny = cy + dy;
          if (!inBounds(nx, ny) || seen[key(nx, ny)]) continue;
          if (!isWalkable(board[ny][nx])) continue;
          seen[key(nx, ny)] = 1;
          queue.push([nx, ny]);
        }
      }
      if (comp.length > best.length) best = comp;
    }
  }
  const member = new Set(best.map(([x, y]) => key(x, y)));
  return { tiles: best, member };
}

// Seed facilities of `type` onto buildable land within the component. Each
// needs a clear w*h footprint plus a walkable, non-building entrance tile.
function seedFacilities(board, buildingGrid, component, type, count, facilities) {
  const def = FACILITY_DEFS[type];
  let placed = 0, attempts = 0;
  while (placed < count && attempts < 6000) {
    attempts++;
    const [ox, oy] = component.tiles[randInt(0, component.tiles.length - 1)];
    // Footprint must be fully on component tiles and currently empty.
    let ok = true;
    for (let yy = oy; yy < oy + def.h && ok; yy++) {
      for (let xx = ox; xx < ox + def.w && ok; xx++) {
        if (!component.member.has(key(xx, yy)) || buildingGrid[yy][xx] !== null) ok = false;
      }
    }
    if (!ok) continue;

    // Find an entrance: a component tile adjacent to the footprint that is not
    // itself part of any building.
    let entrance = null;
    outer:
    for (let yy = oy - 1; yy <= oy + def.h; yy++) {
      for (let xx = ox - 1; xx <= ox + def.w; xx++) {
        const insideX = xx >= ox && xx < ox + def.w;
        const insideY = yy >= oy && yy < oy + def.h;
        if (insideX && insideY) continue;                 // footprint
        if (!insideX && !insideY) continue;               // diagonal corner
        if (!component.member.has(key(xx, yy))) continue;
        if (buildingGrid[yy][xx] !== null) continue;
        entrance = { x: xx, y: yy };
        break outer;
      }
    }
    if (!entrance) continue;

    const facility = {
      type, x: ox, y: oy, w: def.w, h: def.h,
      capacity: def.capacity, entrance,
      occupants: new Set(),
    };
    for (let yy = oy; yy < oy + def.h; yy++) {
      for (let xx = ox; xx < ox + def.w; xx++) buildingGrid[yy][xx] = facility;
    }
    facilities.push(facility);
    placed++;
  }
  return placed;
}

function seedBoard(board) {
  const buildingGrid = [];
  for (let y = 0; y < BOARD_SIZE; y++) buildingGrid.push(new Array(BOARD_SIZE).fill(null));
  const component = largestWalkableComponent(board);
  const facilities = [];
  seedFacilities(board, buildingGrid, component, FACILITY.HOUSE, NUM_HOUSES, facilities);
  seedFacilities(board, buildingGrid, component, FACILITY.ORCHARD, NUM_ORCHARDS, facilities);
  return { buildingGrid, component, facilities };
}

/* ------------------------------------------------------------------ *
 * NPCs
 * ------------------------------------------------------------------ */
function placeNPCs(buildingGrid, component, count) {
  const free = component.tiles.filter(([x, y]) => buildingGrid[y][x] === null);
  const npcs = [];
  const occupied = new Set();
  let attempts = 0;
  while (npcs.length < count && free.length > 0 && attempts < 10000) {
    attempts++;
    const [x, y] = free[randInt(0, free.length - 1)];
    if (occupied.has(key(x, y))) continue;
    occupied.add(key(x, y));
    npcs.push({
      x, y, prevX: x, prevY: y,
      inside: null, alive: true,
      state: NPC_STATE.WANDERING,
      // Needs on a 0..1000 scale; decay each turn, restored inside facilities.
      fullness: randInt(700, NEED_MAX),
      alertness: randInt(700, NEED_MAX),
    });
  }
  return npcs;
}

// The facility of `type` whose entrance is closest (Manhattan) to the NPC.
function nearestFacilityOfType(npc, type, facilities) {
  let best = null, bestD = Infinity;
  for (const f of facilities) {
    if (f.type !== type) continue;
    const d = Math.abs(npc.x - f.entrance.x) + Math.abs(npc.y - f.entrance.y);
    if (d < bestD) { bestD = d; best = f; }
  }
  return best;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dayFraction(clock) {
  return (clock.turn % DAY_LENGTH_TURNS) / DAY_LENGTH_TURNS;
}

// Need thresholds at which an NPC will go seek a facility. They swing with the
// day/night cycle: the rest threshold is high at night (so NPCs tend to sleep
// at night) and the food threshold is high by day (so they tend to eat by day).
// Both are floored at NEED_HARD_FLOOR so a critically low need is always acted
// on, whatever the time. This keeps NPCs mostly - but not strictly - aligned to
// the day/night cycle.
function needThresholds(clock) {
  const n = nightFactor(clock);   // 1 at midnight, 0 at noon
  const rest = Math.max(NEED_HARD_FLOOR, NEED_THRESHOLD_BASE + NEED_THRESHOLD_AMP * n);
  const food = Math.max(NEED_HARD_FLOOR, NEED_THRESHOLD_BASE + NEED_THRESHOLD_AMP * (1 - n));
  return { food, rest };
}

// Try to move an NPC one tile in a random unobstructed, unoccupied direction.
function wanderStep(npc, board, buildingGrid, occupied) {
  for (const [dx, dy] of shuffle(DIRECTIONS.slice())) {
    const nx = npc.x + dx, ny = npc.y + dy;
    if (isBlocked(board, buildingGrid, nx, ny)) continue;
    if (occupied.has(key(nx, ny))) continue;
    occupied.delete(key(npc.x, npc.y));
    npc.x = nx; npc.y = ny;
    occupied.add(key(nx, ny));
    return;
  }
}

// Apply per-turn need decay and facility replenishment, and kill NPCs whose
// needs hit zero. Runs before movement so deaths free up board/facility slots.
function updateNeeds(npcs) {
  for (const npc of npcs) {
    if (!npc.alive) continue;
    npc.fullness -= NEED_DECAY;
    npc.alertness -= NEED_DECAY;
    if (npc.inside) {
      if (FACILITY_DEFS[npc.inside.type].restores === "fullness") npc.fullness += NEED_REPLENISH;
      else npc.alertness += NEED_REPLENISH;
    }
    if (npc.fullness <= 0 || npc.alertness <= 0) {
      npc.fullness = Math.max(0, npc.fullness);
      npc.alertness = Math.max(0, npc.alertness);
      if (npc.inside) { npc.inside.occupants.delete(npc); npc.inside = null; }
      npc.alive = false;
      npc.state = NPC_STATE.DEAD;
      continue;
    }
    npc.fullness = Math.min(NEED_MAX, npc.fullness);
    npc.alertness = Math.min(NEED_MAX, npc.alertness);
  }
}

// Advance every living NPC by one turn according to the need-driven state
// machine. Whichever need is below its current day/night threshold sends the
// NPC to the matching facility; if both are, the more depleted need wins.
function updateNPCs(board, buildingGrid, npcs, facilities, clock) {
  updateNeeds(npcs);
  const { food: foodThreshold, rest: restThreshold } = needThresholds(clock);

  // Tiles occupied by living NPCs currently out on the board.
  const occupied = new Set();
  for (const n of npcs) if (n.alive && !n.inside) occupied.add(key(n.x, n.y));

  for (const npc of npcs) {
    if (!npc.alive) continue;
    npc.prevX = npc.x;
    npc.prevY = npc.y;

    // Decide which need (if any) to act on.
    const needFood = npc.fullness < foodThreshold;
    const needRest = npc.alertness < restThreshold;
    let wantType = null;
    if (needFood && needRest) wantType = npc.fullness <= npc.alertness ? FACILITY.ORCHARD : FACILITY.HOUSE;
    else if (needFood) wantType = FACILITY.ORCHARD;
    else if (needRest) wantType = FACILITY.HOUSE;

    const insideState = (f) =>
      FACILITY_DEFS[f.type].restores === "fullness" ? NPC_STATE.EATING : NPC_STATE.RESTING;

    // --- Inside a facility ------------------------------------------------
    if (npc.inside) {
      const restored = FACILITY_DEFS[npc.inside.type].restores === "fullness"
        ? npc.fullness : npc.alertness;
      const stillWantsThis = wantType === npc.inside.type;
      const wantsElsewhere = wantType && !stillWantsThis;
      // Leave once topped up, or when a different need has become the priority.
      if (restored >= NEED_SATISFIED || wantsElsewhere || !wantType) {
        const e = npc.inside.entrance;
        if (!occupied.has(key(e.x, e.y))) {
          npc.inside.occupants.delete(npc);
          npc.inside = null;
          npc.x = npc.prevX = e.x;
          npc.y = npc.prevY = e.y;
          occupied.add(key(e.x, e.y));
          npc.state = NPC_STATE.WANDERING;
        } else {
          npc.state = insideState(npc.inside);   // doorway blocked, stay a turn
        }
      } else {
        npc.state = insideState(npc.inside);
      }
      continue;
    }

    // --- Out on the board -------------------------------------------------
    if (!wantType) {
      wanderStep(npc, board, buildingGrid, occupied);
      npc.state = NPC_STATE.WANDERING;
      continue;
    }

    const target = nearestFacilityOfType(npc, wantType, facilities);
    npc.state = wantType === FACILITY.ORCHARD ? NPC_STATE.SEEKING_FOOD : NPC_STATE.SEEKING_REST;
    if (!target) {
      wanderStep(npc, board, buildingGrid, occupied);
      continue;
    }

    const e = target.entrance;
    if (npc.x === e.x && npc.y === e.y) {
      // At the door: enter if there is room, otherwise loiter nearby.
      if (target.occupants.size < target.capacity) {
        occupied.delete(key(npc.x, npc.y));
        target.occupants.add(npc);
        npc.inside = target;
        npc.state = insideState(target);
      } else {
        wanderStep(npc, board, buildingGrid, occupied);
      }
      continue;
    }

    // Walk one step along the shortest path toward the door.
    const next = bfsNextStep(board, buildingGrid, npc.x, npc.y, e.x, e.y);
    if (next) {
      if (!occupied.has(key(next[0], next[1]))) {
        occupied.delete(key(npc.x, npc.y));
        npc.x = next[0]; npc.y = next[1];
        occupied.add(key(npc.x, npc.y));
      }
      // else: another NPC is in the way this turn — wait.
    } else {
      wanderStep(npc, board, buildingGrid, occupied);   // unreachable fallback
    }
  }
}

/* ------------------------------------------------------------------ *
 * Camera (zoom + pan)
 * ------------------------------------------------------------------ */
// Edge-scrolling while the mouse is locked to the window.
const EDGE_SCROLL_MARGIN = 70;   // px from an edge that triggers scrolling
const EDGE_SCROLL_PX = 12;       // screen px to scroll per animation frame

const camera = {
  tileSize: 32,         // pixels per tile (starting zoom)
  minTileSize: 2,
  maxTileSize: 96,      // closest zoom
  // Top-left of the viewport, in world tile coordinates (may be fractional).
  offsetX: BOARD_SIZE / 2,
  offsetY: BOARD_SIZE / 2,
};

function viewportTiles(canvas) {
  return {
    w: canvas.width / camera.tileSize,
    h: canvas.height / camera.tileSize,
  };
}

// Keep the offset such that the visible window stays over the board.
function clampCamera(canvas) {
  const { w, h } = viewportTiles(canvas);

  if (w >= BOARD_SIZE) {
    camera.offsetX = (BOARD_SIZE - w) / 2;      // centre when board is narrower than view
  } else {
    camera.offsetX = Math.max(0, Math.min(BOARD_SIZE - w, camera.offsetX));
  }

  if (h >= BOARD_SIZE) {
    camera.offsetY = (BOARD_SIZE - h) / 2;
  } else {
    camera.offsetY = Math.max(0, Math.min(BOARD_SIZE - h, camera.offsetY));
  }
}

// Set the zoom so that `newTileSize` is applied while keeping the world point
// currently under screen pixel (px, py) fixed under that same pixel.
function zoomAt(canvas, newTileSize, px, py) {
  const ts0 = camera.tileSize;
  const worldX = camera.offsetX + px / ts0;
  const worldY = camera.offsetY + py / ts0;
  camera.tileSize = Math.max(camera.minTileSize, Math.min(camera.maxTileSize, newTileSize));
  camera.offsetX = worldX - px / camera.tileSize;
  camera.offsetY = worldY - py / camera.tileSize;
  clampCamera(canvas);
}

// Zoom by a factor about the centre of the screen (used by the keyboard).
function zoom(canvas, factor) {
  zoomAt(canvas, camera.tileSize * factor, canvas.width / 2, canvas.height / 2);
}

function pan(canvas, dxTiles, dyTiles) {
  camera.offsetX += dxTiles;
  camera.offsetY += dyTiles;
  clampCamera(canvas);
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
// Refresh the on-screen clock and population breakdown.
function updateHud(npcs, clock) {
  const el = document.getElementById("stats");
  if (!el) return;
  const day = Math.floor(clock.turn / DAY_LENGTH_TURNS) + 1;
  const mins = Math.floor(dayFraction(clock) * 1440);
  const hh = String(Math.floor(mins / 60)).padStart(2, "0");
  const mm = String(mins % 60).padStart(2, "0");
  const phase = nightFactor(clock) > 0.5 ? "Night" : "Day";
  let eating = 0, resting = 0, out = 0, dead = 0;
  for (const n of npcs) {
    if (!n.alive) dead++;
    else if (n.inside && n.inside.type === FACILITY.ORCHARD) eating++;
    else if (n.inside && n.inside.type === FACILITY.HOUSE) resting++;
    else out++;
  }
  el.innerHTML =
    `Day ${day} &nbsp; <b>${hh}:${mm}</b> &middot; ${phase}<br>` +
    `Pop ${npcs.length - dead} &nbsp; Eating ${eating} &nbsp; Resting ${resting} &nbsp; Out ${out}` +
    (dead ? ` &nbsp; Dead ${dead}` : "");
}

/* ------------------------------------------------------------------ *
 * Inspection overlay
 * ------------------------------------------------------------------ */
function overlayProp(k, v) {
  return `<div class="prop"><span>${k}</span><span>${v}</span></div>`;
}
function overlayBar(k, v, color) {
  const pct = clamp(Math.round(v), 0, 100);
  return overlayProp(k, pct + "%") +
    `<div class="bar"><span style="width:${pct}%;background:${color}"></span></div>`;
}

// Render the properties of the currently selected object into the overlay.
function updateOverlay(sel) {
  const content = document.getElementById("overlay-content");
  if (!content || !sel) return;
  if (sel.kind === "npc") {
    const n = sel.ref;
    // Needs are 0..1000; shown as a percentage in the overlay.
    const head = n.alive ? "Villager" : "Villager <span style=\"color:#e06b6b\">(deceased)</span>";
    content.innerHTML =
      `<h2>${head}</h2>` +
      overlayBar("Fullness", n.fullness / NEED_MAX * 100, "#7bc96f") +
      overlayBar("Alertness", n.alertness / NEED_MAX * 100, "#f2c14e");
  } else {
    const f = sel.ref;
    const def = FACILITY_DEFS[f.type];
    content.innerHTML =
      `<h2>${def.label}</h2>` +
      overlayProp("Type", def.label) +
      overlayProp("Capacity", f.capacity) +
      overlayProp("Occupants", f.occupants.size + " / " + f.capacity);
  }
}

// How dark the night overlay is, 0 (noon) .. 1 (midnight).
function nightFactor(clock) {
  const brightness = 0.5 - 0.5 * Math.cos(2 * Math.PI * dayFraction(clock));
  return 1 - brightness;
}

// Draw one facility: a semi-transparent footprint rectangle with a type icon
// in the top-left corner and (when zoomed in) an occupancy count.
function drawFacility(ctx, f, ts) {
  const sx = (f.x - camera.offsetX) * ts;
  const sy = (f.y - camera.offsetY) * ts;
  const w = f.w * ts, h = f.h * ts;
  const def = FACILITY_DEFS[f.type];

  ctx.fillStyle = def.tint;
  ctx.fillRect(sx, sy, w, h);
  ctx.strokeStyle = def.border;
  ctx.lineWidth = Math.max(1, ts * 0.08);
  ctx.strokeRect(sx, sy, w, h);

  // Type icon in the top-left corner.
  const iconSize = Math.min(w, h) * 0.55;
  if (iconSize >= 9) {
    ctx.font = `${Math.floor(iconSize)}px system-ui, sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText(def.icon, sx + ts * 0.12, sy + ts * 0.08);
  }

  // Occupancy badge in the bottom-right corner.
  if (ts >= 9) {
    const label = f.occupants.size + "/" + f.capacity;
    ctx.font = `${Math.max(8, Math.floor(ts * 0.42))}px system-ui, sans-serif`;
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    ctx.lineWidth = Math.max(2, ts * 0.1);
    ctx.strokeStyle = "rgba(0,0,0,0.7)";
    ctx.strokeText(label, sx + w - ts * 0.1, sy + h - ts * 0.06);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, sx + w - ts * 0.1, sy + h - ts * 0.06);
  }
}

function render(ctx, canvas, board, variants, npcs, facilities, clock, animT, selection) {
  const ts = camera.tileSize;

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Range of tiles visible in the viewport.
  const startX = Math.max(0, Math.floor(camera.offsetX));
  const startY = Math.max(0, Math.floor(camera.offsetY));
  const endX = Math.min(BOARD_SIZE - 1, Math.ceil(camera.offsetX + canvas.width / ts));
  const endY = Math.min(BOARD_SIZE - 1, Math.ceil(camera.offsetY + canvas.height / ts));

  // Draw tiles as sprites, falling back to the flat colour until each sprite
  // image has loaded. The 64px core is scaled to cover the tile, so the 96px
  // sprite is drawn at 1.5x the tile size with its 16px overhang (0.25*ts on
  // screen) spilling into the neighbours. We extend the loop one tile past the
  // viewport so off-screen overhangs still bleed in, and draw top-left to
  // bottom-right so lower/right tiles and their features blend over earlier ones.
  const overhang = ts * (SPRITE_OVERHANG / SPRITE_CORE);   // 0.25 * ts
  const drawSize = ts * (SPRITE_SIZE / SPRITE_CORE);       // 1.5 * ts
  const tx0 = Math.max(0, startX - 1);
  const ty0 = Math.max(0, startY - 1);
  const tx1 = Math.min(BOARD_SIZE - 1, endX + 1);
  const ty1 = Math.min(BOARD_SIZE - 1, endY + 1);
  for (let y = ty0; y <= ty1; y++) {
    for (let x = tx0; x <= tx1; x++) {
      const sx = (x - camera.offsetX) * ts;
      const sy = (y - camera.offsetY) * ts;
      const tile = board[y][x];
      const img = spriteFor(tile, variants[y][x]);
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, sx - overhang, sy - overhang, drawSize, drawSize);
      } else {
        ctx.fillStyle = TILE_COLORS[tile];
        ctx.fillRect(Math.floor(sx), Math.floor(sy), Math.ceil(ts), Math.ceil(ts));
      }
    }
  }

  // Facilities (drawn over tiles, under NPCs).
  for (const f of facilities) {
    if (f.x + f.w < startX - 1 || f.x > endX + 1 ||
        f.y + f.h < startY - 1 || f.y > endY + 1) continue;
    drawFacility(ctx, f, ts);
  }

  // NPCs (only those out on the board; those inside a facility are hidden and
  // shown via the facility's occupancy count). Colour reflects their state.
  ctx.strokeStyle = "#1d1d1d";
  ctx.lineWidth = Math.max(1, ts * 0.08);
  for (const npc of npcs) {
    if (npc.inside || !npc.alive) continue;
    // Interpolate between the previous tile and the current tile.
    const ix = npc.prevX + (npc.x - npc.prevX) * animT;
    const iy = npc.prevY + (npc.y - npc.prevY) * animT;
    if (ix < startX - 1 || ix > endX + 1 ||
        iy < startY - 1 || iy > endY + 1) continue;
    const cx = (ix - camera.offsetX) * ts + ts / 2;
    const cy = (iy - camera.offsetY) * ts + ts / 2;
    const r = Math.max(2, ts * 0.35);
    ctx.fillStyle = NPC_STATE_COLOR[npc.state] || "#e63946";
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    if (ts >= 6) ctx.stroke();
  }

  // Day/night tint over the whole scene.
  const night = nightFactor(clock);
  if (night > 0.01) {
    ctx.fillStyle = `rgba(8, 14, 44, ${(0.55 * night).toFixed(3)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Focus indicator on the currently inspected object (drawn last so it stays
  // bright over the night tint). A selected NPC that has gone inside a facility
  // is tracked by highlighting that facility.
  if (selection) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
    const highlightRect = (rx, ry, rw, rh) => {
      const pad = 2 + pulse * Math.max(2, ts * 0.12);
      ctx.lineWidth = Math.max(2, ts * 0.12);
      ctx.strokeStyle = "rgba(0,0,0,0.65)";
      ctx.strokeRect(rx - pad - 1, ry - pad - 1, rw + 2 * pad + 2, rh + 2 * pad + 2);
      ctx.strokeStyle = "#ffd166";
      ctx.strokeRect(rx - pad, ry - pad, rw + 2 * pad, rh + 2 * pad);
    };

    const npc = selection.kind === "npc" ? selection.ref : null;
    const facility = selection.kind === "facility" ? selection.ref : (npc && npc.inside);

    if (facility) {
      highlightRect((facility.x - camera.offsetX) * ts, (facility.y - camera.offsetY) * ts,
                    facility.w * ts, facility.h * ts);
    } else if (npc) {
      const ix = npc.prevX + (npc.x - npc.prevX) * animT;
      const iy = npc.prevY + (npc.y - npc.prevY) * animT;
      const cx = (ix - camera.offsetX) * ts + ts / 2;
      const cy = (iy - camera.offsetY) * ts + ts / 2;
      const r = Math.max(4, ts * 0.55) + pulse * Math.max(2, ts * 0.12);
      ctx.lineWidth = Math.max(2, ts * 0.12);
      ctx.strokeStyle = "rgba(0,0,0,0.65)";
      ctx.beginPath(); ctx.arc(cx, cy, r + 1, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

/* ------------------------------------------------------------------ *
 * Main
 * ------------------------------------------------------------------ */
(function main() {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    clampCamera(canvas);
  }
  window.addEventListener("resize", resize);

  // Load tile bitmaps (rendering falls back to flat colours until they arrive).
  loadSprites();

  // Game state.
  const board = generateBoard();
  const variants = buildVariants(board);
  const { buildingGrid, component, facilities } = seedBoard(board);
  const npcs = placeNPCs(buildingGrid, component, NPC_COUNT);
  const clock = { turn: 0 };

  // Centre the camera on the first NPC (a guaranteed-walkable spot), else board centre.
  if (npcs.length > 0) {
    camera.offsetX = npcs[0].x - 0;
    camera.offsetY = npcs[0].y - 0;
  }
  resize();
  // After resize knows the viewport, recentre on the first NPC.
  if (npcs.length > 0) {
    const { w, h } = viewportTiles(canvas);
    camera.offsetX = npcs[0].x - w / 2;
    camera.offsetY = npcs[0].y - h / 2;
    clampCamera(canvas);
  }

  // Input.
  const PAN_STEP = 3;   // tiles per key press
  window.addEventListener("keydown", (e) => {
    switch (e.key) {
      case "PageUp":     zoom(canvas, 1.25); break;
      case "PageDown":   zoom(canvas, 0.8);  break;
      case "+": case "=": case "Add":      zoom(canvas, 1.25); break;
      case "-": case "_": case "Subtract": zoom(canvas, 0.8);  break;
      case "a": case "A": case "ArrowLeft":  pan(canvas, -PAN_STEP, 0); break;
      case "d": case "D": case "ArrowRight": pan(canvas,  PAN_STEP, 0); break;
      case "w": case "W": case "ArrowUp":    pan(canvas, 0, -PAN_STEP); break;
      case "s": case "S": case "ArrowDown":  pan(canvas, 0,  PAN_STEP); break;
      default: return;
    }
    e.preventDefault();
  });

  // Click-to-inspect: select the NPC or facility under a screen point and show
  // the overlay. Selecting another object replaces the current selection (only
  // one overlay at a time); the X button clears it. Clicking empty terrain
  // leaves any existing overlay unchanged.
  let selection = null;
  const overlayEl = document.getElementById("overlay");
  document.getElementById("overlay-close").addEventListener("click", () => {
    selection = null;
    overlayEl.hidden = true;
  });

  function selectAt(screenX, screenY) {
    const ts = camera.tileSize;
    const worldX = camera.offsetX + screenX / ts;
    const worldY = camera.offsetY + screenY / ts;

    // Prefer an NPC (small target, drawn on top): nearest on-board NPC whose
    // drawn centre is within ~0.45 tile of the point.
    let picked = null, bestD = 0.45;
    for (const npc of npcs) {
      if (npc.inside || !npc.alive) continue;
      const ix = npc.prevX + (npc.x - npc.prevX) * animT + 0.5;
      const iy = npc.prevY + (npc.y - npc.prevY) * animT + 0.5;
      const d = Math.hypot(worldX - ix, worldY - iy);
      if (d < bestD) { bestD = d; picked = { kind: "npc", ref: npc }; }
    }
    // Otherwise a facility, if the point landed on its footprint.
    if (!picked) {
      const tx = Math.floor(worldX), ty = Math.floor(worldY);
      if (inBounds(tx, ty) && buildingGrid[ty][tx]) {
        picked = { kind: "facility", ref: buildingGrid[ty][tx] };
      }
    }
    if (picked) {
      selection = picked;
      overlayEl.hidden = false;
      updateOverlay(selection);
    }
  }

  // --- Mouse + pointer lock -------------------------------------------------
  // Clicking the game locks the mouse to the window; a virtual cursor (vcx,vcy)
  // then tracks relative movement, and the click selects the object under it.
  // While locked, moving the cursor near an edge scrolls the map (see drawFrame).
  // Press ESC to release the lock (handled by the browser).
  let pointerLocked = false;
  let vcx = 0, vcy = 0;

  canvas.addEventListener("click", (e) => {
    if (pointerLocked) {
      selectAt(vcx, vcy);
    } else {
      const rect = canvas.getBoundingClientRect();
      vcx = e.clientX - rect.left;
      vcy = e.clientY - rect.top;
      selectAt(vcx, vcy);
      // Request the lock; ignore failures (e.g. when not permitted).
      if (canvas.requestPointerLock) {
        const req = canvas.requestPointerLock();
        if (req && typeof req.catch === "function") req.catch(() => {});
      }
    }
  });

  document.addEventListener("pointerlockchange", () => {
    pointerLocked = document.pointerLockElement === canvas;
  });

  document.addEventListener("mousemove", (e) => {
    if (!pointerLocked) return;
    vcx = clamp(vcx + e.movementX, 0, canvas.width);
    vcy = clamp(vcy + e.movementY, 0, canvas.height);
  });

  // Mouse wheel zooms, centred on the cursor (the crosshair while locked).
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const px = pointerLocked ? vcx : e.clientX - rect.left;
    const py = pointerLocked ? vcy : e.clientY - rect.top;
    zoomAt(canvas, camera.tileSize * Math.exp(-e.deltaY * 0.0015), px, py);
  }, { passive: false });

  // --- Touch: drag to pan, pinch to zoom, tap to select ---------------------
  let touchMode = null;     // "pan" | "pinch" | null
  let panStart = null;      // { x, y, offsetX, offsetY, time, moved }
  let pinchStart = null;    // { dist, tileSize }

  function touchPoint(t) {
    const rect = canvas.getBoundingClientRect();
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function pinchMetrics(e) {
    const a = touchPoint(e.touches[0]), b = touchPoint(e.touches[1]);
    return { dist: Math.hypot(a.x - b.x, a.y - b.y), midX: (a.x + b.x) / 2, midY: (a.y + b.y) / 2 };
  }

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
      const p = touchPoint(e.touches[0]);
      touchMode = "pan";
      panStart = { x: p.x, y: p.y, offsetX: camera.offsetX, offsetY: camera.offsetY,
                   time: Date.now(), moved: false };
    } else if (e.touches.length === 2) {
      touchMode = "pinch";
      pinchStart = { dist: pinchMetrics(e).dist, tileSize: camera.tileSize };
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (touchMode === "pan" && e.touches.length === 1 && panStart) {
      const p = touchPoint(e.touches[0]);
      const dx = p.x - panStart.x, dy = p.y - panStart.y;
      if (Math.hypot(dx, dy) > 6) panStart.moved = true;
      camera.offsetX = panStart.offsetX - dx / camera.tileSize;   // drag the map
      camera.offsetY = panStart.offsetY - dy / camera.tileSize;
      clampCamera(canvas);
    } else if (touchMode === "pinch" && e.touches.length === 2 && pinchStart) {
      const m = pinchMetrics(e);
      zoomAt(canvas, pinchStart.tileSize * (m.dist / pinchStart.dist), m.midX, m.midY);
    }
  }, { passive: false });

  canvas.addEventListener("touchend", (e) => {
    e.preventDefault();
    // A short, still single-finger touch is a tap -> select.
    if (touchMode === "pan" && panStart && !panStart.moved && Date.now() - panStart.time < 300) {
      selectAt(panStart.x, panStart.y);
    }
    if (e.touches.length === 0) {
      touchMode = null; panStart = null; pinchStart = null;
    } else if (e.touches.length === 1) {
      // Dropped from pinch to a single finger: continue as a pan.
      const p = touchPoint(e.touches[0]);
      touchMode = "pan";
      panStart = { x: p.x, y: p.y, offsetX: camera.offsetX, offsetY: camera.offsetY,
                   time: Date.now(), moved: true };
      pinchStart = null;
    }
  }, { passive: false });

  // Turn + animation loop. The board/NPC state only changes once per turn
  // (every TURN_MS). A turn is committed at the start of every FRAMES_PER_TURN
  // frames; the remaining frames interpolate NPC movement toward the new tile.
  // The interval ticks every FRAME_MS (80ms) so motion is animated smoothly.
  let frameInTurn = 0;
  let animT = 0;   // 0..1 progress of the current turn's movement
  setInterval(() => {
    if (frameInTurn === 0) {
      clock.turn++;
      updateNPCs(board, buildingGrid, npcs, facilities, clock);
      updateHud(npcs, clock);
      if (selection && !overlayEl.hidden) updateOverlay(selection);
    }
    frameInTurn++;
    animT = frameInTurn / FRAMES_PER_TURN;
    if (frameInTurn >= FRAMES_PER_TURN) frameInTurn = 0;
  }, FRAME_MS);
  updateHud(npcs, clock);

  // Debug handle: lets you inspect/poke the simulation from the dev console.
  window.society = { board, npcs, facilities, buildingGrid, camera, clock,
                     get animT() { return animT; } };

  // Render loop.
  function drawFrame() {
    // Edge scrolling while the mouse is locked: scroll when the virtual cursor
    // is within EDGE_SCROLL_MARGIN of a window edge.
    if (pointerLocked) {
      let dx = 0, dy = 0;
      if (vcx < EDGE_SCROLL_MARGIN) dx = -1;
      else if (vcx > canvas.width - EDGE_SCROLL_MARGIN) dx = 1;
      if (vcy < EDGE_SCROLL_MARGIN) dy = -1;
      else if (vcy > canvas.height - EDGE_SCROLL_MARGIN) dy = 1;
      if (dx || dy) pan(canvas, dx * EDGE_SCROLL_PX / camera.tileSize,
                              dy * EDGE_SCROLL_PX / camera.tileSize);
    }

    render(ctx, canvas, board, variants, npcs, facilities, clock, animT, selection);

    // Virtual cursor reticle while the mouse is locked.
    if (pointerLocked) {
      ctx.strokeStyle = "rgba(0,0,0,0.7)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(vcx, vcy, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(vcx, vcy, 7, 0, Math.PI * 2);
      ctx.moveTo(vcx - 11, vcy); ctx.lineTo(vcx - 4, vcy);
      ctx.moveTo(vcx + 4, vcy); ctx.lineTo(vcx + 11, vcy);
      ctx.moveTo(vcx, vcy - 11); ctx.lineTo(vcx, vcy - 4);
      ctx.moveTo(vcx, vcy + 4); ctx.lineTo(vcx, vcy + 11);
      ctx.stroke();
    }

    requestAnimationFrame(drawFrame);
  }
  requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
