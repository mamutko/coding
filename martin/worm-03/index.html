<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worm Game</title>
    <!-- PeerJS provides the WebRTC signaling broker used only at connection time.
         Requires internet; if it fails to load, single-player still works. -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }
        #app {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }
        #boardContainer {
            position: relative;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
            display: block;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 22px;
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.92);
            padding: 20px;
            border: 2px solid #fff;
            border-radius: 8px;
            width: 360px;
            max-width: 90%;
            z-index: 20;
        }
        #gameOver label {
            display: block;
            margin: 10px 0 5px;
            font-size: 15px;
        }
        #controlHint {
            font-size: 11px;
            opacity: 0.65;
            margin: 10px 0 0;
        }
        #wellDoneName, #joinCodeInput {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #fff;
            border-radius: 4px;
            background: #000;
            color: #fff;
        }
        button {
            margin-top: 10px;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            border: 1px solid #fff;
            border-radius: 4px;
            background: #111;
            color: #fff;
        }
        button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .cardGrid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .card {
            margin-top: 0;
            padding: 14px 10px;
            font-size: 14px;
            background: #111;
            border: 1px solid #fff;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
        }
        .card:disabled { opacity: 0.4; cursor: default; }
        #mainMenu .card {
            flex-basis: 100%;
            min-height: 70px;
            font-size: 16px;
        }
        #multiMenu .card {
            flex: 1 1 44%;
            min-width: 120px;
            min-height: 68px;
        }
        #yourCode {
            color: #3aa0ff;
            font-weight: bold;
            letter-spacing: 2px;
        }
        #joinNumberArea {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        #joinNumberArea #joinCodeInput { flex: 1; }
        #joinNumberArea #joinBtn { margin-top: 0; width: auto; white-space: nowrap; }
        #mpStatus {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 10px;
            min-height: 16px;
        }
        #leaderboardBtn {
            position: absolute;
            bottom: 6px;
            right: 6px;
            font-size: 11px;
            padding: 4px 8px;
            margin: 0;
            z-index: 10;
            opacity: 0.7;
        }
        #leaderboardPanel {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 16px;
            z-index: 30;
            min-width: 220px;
        }
        #leaderboardPanel h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }
        #leaderboardPanel ol {
            padding-left: 18px;
            margin: 0;
        }
        #leaderboardPanel li {
            margin-bottom: 6px;
            font-size: 13px;
        }
        #leaderboardPanel li .lbName {
            font-weight: bold;
        }
        #leaderboardPanel li .lbScore {
            margin-left: 6px;
        }
        #leaderboardPanel li .lbDate {
            display: block;
            font-size: 10px;
            opacity: 0.7;
        }
        #closeLeaderboard {
            margin-top: 10px;
            width: 100%;
        }
        #nameErrorPanel {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 40;
            align-items: center;
            justify-content: center;
        }
        .nameErrorCard {
            background: #1a1a1a;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 18px 20px;
            max-width: 280px;
        }
        .nameErrorCard h2 { margin: 0 0 8px; font-size: 16px; }
        .nameErrorCard p { margin: 0 0 6px; font-size: 13px; }
        .nameErrorCard ul { margin: 0 0 12px; padding-left: 20px; font-size: 13px; }
        .nameErrorCard li { margin-bottom: 4px; }
        #closeNameError { width: 100%; }
        #wellDonePanel {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 35;
            align-items: center;
            justify-content: center;
        }
        .wellDoneCard {
            background: #1a1a1a;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 18px 20px;
            max-width: 280px;
            text-align: center;
        }
        .wellDoneCard h2 { margin: 0 0 8px; font-size: 18px; }
        .wellDoneCard p { margin: 0 0 12px; font-size: 13px; }
        .wellDoneActions { display: flex; gap: 8px; margin-top: 12px; }
        .wellDoneActions button { flex: 1; padding: 8px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="boardContainer">
            <canvas id="gameCanvas"></canvas>
            <div id="gameOver">
                <div id="overlayTitle">Worm</div>
                <div id="startControls">
                    <div id="mainMenu" class="cardGrid">
                        <button class="card" id="singleCard">Start Single Player Game</button>
                        <button class="card" id="multiCard">Start Multi Player Game</button>
                    </div>
                    <div id="multiMenu" class="cardGrid" style="display: none;">
                        <button class="card" id="backCard">Back</button>
                        <button class="card" id="randomCard" disabled>Join Random Game</button>
                        <button class="card" id="enterNumberCard" disabled>Enter Game Number to Join</button>
                        <button class="card" id="yourNumberCard" disabled>Your Game Number: <span id="yourCode">----</span></button>
                    </div>
                    <div id="joinNumberArea" style="display: none;">
                        <input id="joinCodeInput" type="text" inputmode="numeric" maxlength="4" placeholder="0000" />
                        <button id="joinBtn">Join</button>
                    </div>
                    <div id="mpStatus"></div>
                    <p id="controlHint">Tap top / bottom / left / right of screen to steer</p>
                </div>
            </div>
            <button id="leaderboardBtn">Leaderboard</button>
            <div id="leaderboardPanel">
                <h2>Leaderboard</h2>
                <ol id="leaderboardList"></ol>
                <button id="closeLeaderboard">Close</button>
            </div>
            <div id="wellDonePanel">
                <div class="wellDoneCard">
                    <h2>Well done!</h2>
                    <p>Your score made the leaderboard. Enter a name to publish it.</p>
                    <input id="wellDoneName" type="text" maxlength="18" placeholder="Your name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
                    <div class="wellDoneActions">
                        <button id="publishBtn">Publish Score</button>
                        <button id="skipBtn">Skip</button>
                    </div>
                </div>
            </div>
            <div id="nameErrorPanel">
                <div class="nameErrorCard">
                    <h2>Choose a different name</h2>
                    <p>Your name must be:</p>
                    <ul>
                        <li>at most 18 characters long</li>
                        <li>letters, spaces and dashes only</li>
                        <li>respectful</li>
                    </ul>
                    <button id="closeNameError">OK</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverDiv = document.getElementById('gameOver');
        const overlayTitle = document.getElementById('overlayTitle');
        const startControls = document.getElementById('startControls');
        const mainMenu = document.getElementById('mainMenu');
        const multiMenu = document.getElementById('multiMenu');
        const singleCard = document.getElementById('singleCard');
        const multiCard = document.getElementById('multiCard');
        const backCard = document.getElementById('backCard');
        const randomCard = document.getElementById('randomCard');
        const enterNumberCard = document.getElementById('enterNumberCard');
        const yourNumberCard = document.getElementById('yourNumberCard');
        const joinNumberArea = document.getElementById('joinNumberArea');
        const wellDonePanel = document.getElementById('wellDonePanel');
        const wellDoneName = document.getElementById('wellDoneName');
        const publishBtn = document.getElementById('publishBtn');
        const skipBtn = document.getElementById('skipBtn');
        const leaderboardList = document.getElementById('leaderboardList');
        const leaderboardBtn = document.getElementById('leaderboardBtn');
        const leaderboardPanel = document.getElementById('leaderboardPanel');
        const closeLeaderboard = document.getElementById('closeLeaderboard');
        const nameErrorPanel = document.getElementById('nameErrorPanel');
        const closeNameError = document.getElementById('closeNameError');
        const yourCodeEl = document.getElementById('yourCode');
        const joinCodeInput = document.getElementById('joinCodeInput');
        const joinBtn = document.getElementById('joinBtn');
        const mpStatus = document.getElementById('mpStatus');
        let mpUnavailable = false;

        const BOARD_WIDTH = 80;
        const BOARD_HEIGHT = 40;
        const INITIAL_WORM_LENGTH = 3;
        // ---------- Leaderboard storage (shared, Supabase-backed) ----------
        // Scores live in a public Supabase table so the leaderboard is shared
        // across every player/browser rather than per-device. The publishable
        // key is designed to ship in client code; the table is intentionally
        // world read/write with no row-level access control.
        const SUPABASE_URL = 'https://qifgxysuhskscrjjwzfm.supabase.co/rest/v1/mw3_high_score';
        const SUPABASE_KEY = 'sb_publishable_dJ7DGbkXPYOiD4YipTXEog_vx_FhOot';
        const SUPABASE_HEADERS = {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
        };

        // Well-known PeerJS ID used as a one-slot random-match rendezvous. It is
        // namespaced so it cannot collide with the 4-digit game codes or with
        // other apps sharing the public broker.
        const LOBBY_ID = 'worm03-random-lobby-v1-566231993';
        const MAX_RECONNECT = 5;

        // Per-player visual identity, indexed by player slot.
        // Slot 0 = host / single player (original look), slot 1 = joiner.
        const PLAYER_STYLES = [
            { headColor: '#ffa500', bodyColor: '#0f0', eyeColor: '#0f0', startX: 12,               trail: -1 },
            { headColor: '#0066ff', bodyColor: '#33ccff', eyeColor: '#fff', startX: BOARD_WIDTH - 13, trail: 1 }
        ];

        let CELL_SIZE = 10;

        // mode: 'single' | 'host' | 'joiner'
        let mode = 'single';
        // gamePhase: 'lobby' | 'playing' | 'over'
        let gamePhase = 'lobby';
        // which player slot this browser controls (0 for single/host, 1 for joiner)
        let localPlayerIndex = 0;
        let playerName = null;
        let gameOverShown = false;

        // Authoritative on host/single; a mirror of received state on the joiner.
        let players = [];
        let food = [];
        let poison = [];
        let leaderboard = [];

        // --- Networking state ---
        let peer = null;          // this client's persistent game peer (ID = myCode)
        let conn = null;          // the active game DataConnection
        let myCode = null;        // our 4-digit game code / peer ID
        let peerReady = false;
        let remotePeerId = null;  // opponent's game peer ID (used to reconnect)
        let sessionActive = false;// true while a 2-player session is meant to be live
        let intentionalLeave = false; // suppress reconnect when we close on purpose

        // Reconnect bookkeeping
        let reconnecting = false;
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        let hostGiveupTimer = null;

        // Random-match lobby state
        let lobbyPeer = null;     // transient peer that claims LOBBY_ID when we wait
        let lobbyConn = null;     // transient connection while probing the lobby
        let lobbyProbeTimer = null;
        let lobbyProbeSettled = false;
        let randomState = 'idle'; // 'idle' | 'probing' | 'waiting'

        function computeCellSize() {
            const cellW = Math.floor(window.innerWidth / BOARD_WIDTH);
            const cellH = Math.floor(window.innerHeight / BOARD_HEIGHT);
            CELL_SIZE = Math.max(1, Math.min(cellW, cellH));
            canvas.width = BOARD_WIDTH * CELL_SIZE;
            canvas.height = BOARD_HEIGHT * CELL_SIZE;
        }

        function getMoveInterval(player) {
            // Single player: speed tracks the worm's own length. Multiplayer:
            // both worms share one speed, set by whichever worm is longer.
            const len = (mode === 'single')
                ? player.worm.length
                : Math.max(...players.map(p => p.worm.length));
            return 1000 / Math.max(1, len);
        }

        // ---------- Leaderboard ----------

        // Size of the leaderboard: the board shows this many top scores, and the
        // table is pruned to keep only these rows (everything displayed, nothing
        // more). Scores never expire; repeated names are allowed.
        const LEADERBOARD_SIZE = 20;

        // Deterministic ordering shared by the read and the prune so the rows
        // displayed are exactly the rows kept: highest score first, ties broken
        // by most-recently-inserted (id descending).
        const LEADERBOARD_ORDER = 'score.desc,id.desc';

        // Fetch the top scores (highest first) from Supabase.
        async function loadLeaderboard() {
            const url = `${SUPABASE_URL}?select=name,score,timestamp`
                + `&order=${LEADERBOARD_ORDER}&limit=${LEADERBOARD_SIZE}`;
            try {
                const res = await fetch(url, { headers: SUPABASE_HEADERS });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                leaderboard = await res.json();
            } catch (e) {
                console.warn('Could not load leaderboard from Supabase:', e);
            }
        }

        // Keep only the displayed top scores in the table: delete every row that
        // is not among the top LEADERBOARD_SIZE. No-op while the table is not yet
        // full, so the board fills up before any pruning happens.
        async function pruneLeaderboard() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}?select=id&order=${LEADERBOARD_ORDER}&limit=${LEADERBOARD_SIZE}`,
                    { headers: SUPABASE_HEADERS });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const top = await res.json();
                if (top.length < LEADERBOARD_SIZE) return; // table not full yet
                const ids = top.map(r => r.id).join(',');
                await fetch(`${SUPABASE_URL}?id=not.in.(${ids})`, {
                    method: 'DELETE',
                    headers: SUPABASE_HEADERS
                });
            } catch (e) {
                console.warn('Could not prune leaderboard:', e);
            }
        }

        function updateLeaderboardDisplay() {
            leaderboardList.innerHTML = '';
            leaderboard.slice(0, LEADERBOARD_SIZE).forEach(entry => {
                const item = document.createElement('li');

                const who = document.createElement('span');
                who.className = 'lbName';
                who.textContent = entry.name;

                const pts = document.createElement('span');
                pts.className = 'lbScore';
                pts.textContent = entry.score;

                const when = document.createElement('span');
                when.className = 'lbDate';
                when.textContent = entry.timestamp
                    ? new Date(entry.timestamp).toLocaleString()
                    : '';

                item.appendChild(who);
                item.appendChild(pts);
                item.appendChild(when);
                leaderboardList.appendChild(item);
            });
        }

        // Publish a score the player chose to submit: insert a row, prune the
        // table back to the displayed top scores, and refresh the shared board.
        // Network failures are non-fatal so solo play still works offline.
        async function recordScore(name, value) {
            try {
                const res = await fetch(SUPABASE_URL, {
                    method: 'POST',
                    headers: SUPABASE_HEADERS,
                    body: JSON.stringify({ name: name, score: value })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                await pruneLeaderboard();
            } catch (e) {
                console.warn('Could not submit score to Supabase:', e);
            }
            await loadLeaderboard();
            updateLeaderboardDisplay();
        }

        // ---------- Name validation ----------

        // Names are validated in the browser when the player publishes a score.
        // Rules: 1..NAME_MAX characters, letters/space/dash only, and no bad
        // words. The bad-word lists are not stored in clear text — each word is
        // obfuscated with a Caesar +3 cipher (a->d) and decoded at load time.
        //   - REGULAR words match as a substring anywhere in the name.
        //   - BOUNDED words match only as a whole word (word boundaries), so
        //     they don't flag innocent names (e.g. "cunt" won't block
        //     "Scunthorpe"). All matching is case-insensitive.
        const NAME_MAX = 18;
        const NAME_ALLOWED = /^[A-Za-z -]+$/;

        const BAD_WORDS_REGULAR_ENC = [
            'vklw', 'exoovklw', 'vklwh', 'fuds', 'slvv', 'slvvhg', 'ixfn',
            'ixfnhu', 'ixfnlqj', 'prwkhuixfnhu', 'elwfk', 'edvwdug',
            'dvvkroh', 'duvhkroh', 'glfn', 'glfnkhdg', 'sulfn', 'frfn',
            'frfnvxfnhu', 'sxvvb', 'wzdw', 'zdqnhu', 'eroorfnv', 'exjjhu',
            'voxw', 'zkruh', 'grxfkh', 'grxfkhedj', 'mdfndvv', 'gxpedvv',
            'glsvklw', 'kruvhvklw', 'jrggdpq', 'qljjhu', 'qljjd', 'fklqn',
            'zhwedfn', 'nlnh', 'qdcl', 'idjjrw', 'gbnh', 'wudqqb', 'uhwdug',
            'uhwdughg', 'vsdvwlf', 'fulssoh', 'fudfnhu', 'krqnb',
            'vdqgqljjhu', 'udjkhdg', 'wrzhokhdg', 'ehdqhu', 'clsshukhdg',
            'jlps', 'prqjrorlg', 'sruq', 'sruqr', 'udsh', 'udslvw', 'prohvw',
            'shgr', 'shgrskloh', 'sdhgrskloh', 'erqhu', 'eorzmre', 'kdqgmre',
            'fxpvkrw', 'mlcc', 'glogr', 'kruqb', 'rujdvp', 'pdvwxuedwh',
            'whvwlfoh', 'vfurwxp', 'vfkhlvvh', 'duvfkorfk', 'kxuhqvrkq',
            'irwch', 'sxwdlq', 'phugh', 'frqqdug', 'plhugd', 'fdeurq',
            'pdulfrq', 'nrnrw', 'nxuyd', 'mhedw', 'ifn',
        ];
        const BAD_WORDS_BOUNDED_ENC = [
            'frrq', 'fxqw', 'idj', 'zrs', 'jrrn', 'vslf', 'gdjr', 'sdnl',
            'frq', 'sxwd', 'slfd', 'ix', 'dvv', 'khoo', 'fxp', 'gdpq', 'vha',
            'wlw',
        ];

        // Reverse the +3 cipher (shift letters back by 3).
        function decodeWord(s) {
            let out = '';
            for (const ch of s) {
                const c = ch.charCodeAt(0);
                out += (c >= 97 && c <= 122)
                    ? String.fromCharCode((c - 97 + 23) % 26 + 97)
                    : ch;
            }
            return out;
        }

        const BAD_WORDS_REGULAR = BAD_WORDS_REGULAR_ENC.map(decodeWord);
        const BAD_WORDS_BOUNDED_RE = BAD_WORDS_BOUNDED_ENC
            .map(decodeWord)
            .map(w => new RegExp('\\b' + w + '\\b'));

        // True if the (lowercased) name contains a regular bad word as a
        // substring, or a bounded bad word as a whole word.
        function containsBadWord(name) {
            const lower = name.toLowerCase();
            for (const w of BAD_WORDS_REGULAR) {
                if (lower.includes(w)) return true;
            }
            for (const re of BAD_WORDS_BOUNDED_RE) {
                if (re.test(lower)) return true;
            }
            return false;
        }

        // True if the name is acceptable for publishing: non-empty after
        // trimming, at most NAME_MAX chars, letters/space/dash only, no bad word.
        function isNameValid(rawName) {
            const name = rawName.trim();
            if (name.length === 0 || name.length > NAME_MAX) return false;
            if (!NAME_ALLOWED.test(name)) return false;
            if (containsBadWord(name)) return false;
            return true;
        }

        // Validate the leaderboard name field; show the rules dialog and return
        // false on failure so the caller keeps the publish prompt open.
        function ensureValidName() {
            if (isNameValid(wellDoneName.value)) return true;
            nameErrorPanel.style.display = 'flex';
            return false;
        }

        // ---------- Leaderboard name prompt ----------

        const STORED_NAME_KEY = 'wormPlayerName';
        let pendingScore = 0;

        function getStoredName() {
            try { return localStorage.getItem(STORED_NAME_KEY) || ''; }
            catch (e) { return ''; }
        }
        function setStoredName(name) {
            try { localStorage.setItem(STORED_NAME_KEY, name); } catch (e) {}
        }
        // Name used for the worm during play, since no name is entered up front.
        function activeName(fallback) {
            return getStoredName() || fallback;
        }

        // A score makes the board if the board isn't full yet, or it is at least
        // as high as the current lowest top-20 score.
        function scoreQualifies(value) {
            if (value <= 0) return false;
            if (leaderboard.length < LEADERBOARD_SIZE) return true;
            return value >= leaderboard[leaderboard.length - 1].score;
        }

        // On game over, refresh the board and, if the local score qualifies,
        // prompt the player to publish it under a name. Resolves to true if the
        // prompt was shown.
        async function maybePromptLeaderboard(player) {
            const value = Math.max(player.worm.length - INITIAL_WORM_LENGTH, 0);
            if (value <= 0) return false;
            await loadLeaderboard();
            updateLeaderboardDisplay();
            if (!scoreQualifies(value)) return false;
            pendingScore = value;
            wellDoneName.value = getStoredName();
            // Not auto-focused: the player may still be tapping steering keys,
            // which would otherwise type into the name field.
            wellDonePanel.style.display = 'flex';
            return true;
        }

        publishBtn.addEventListener('click', async () => {
            if (!ensureValidName()) return;
            const name = wellDoneName.value.trim();
            setStoredName(name);
            wellDonePanel.style.display = 'none';
            await recordScore(name, pendingScore);
            returnToStart();
        });

        skipBtn.addEventListener('click', () => {
            wellDonePanel.style.display = 'none';
            returnToStart();
        });

        // ---------- State construction (host/single) ----------

        function makePlayer(slot, name) {
            const style = PLAYER_STYLES[slot];
            const row = Math.floor(BOARD_HEIGHT / 2);
            const worm = [];
            for (let s = 0; s < INITIAL_WORM_LENGTH; s++) {
                worm.push({ x: style.startX + style.trail * s, y: row });
            }
            return {
                name: name,
                worm: worm,
                direction: { x: 0, y: 0 },
                alive: true,
                started: false,
                timer: null,
                headColor: style.headColor,
                bodyColor: style.bodyColor,
                eyeColor: style.eyeColor
            };
        }

        function buildPlayers(names) {
            players = names.map((name, slot) => makePlayer(slot, name));
        }

        function cellOccupied(pos) {
            if (players.some(p => p.worm.some(s => s.x === pos.x && s.y === pos.y))) return true;
            if (food.some(f => f.x === pos.x && f.y === pos.y)) return true;
            if (poison.some(p => p.x === pos.x && p.y === pos.y)) return true;
            return false;
        }

        function randomFreeCell() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * BOARD_WIDTH),
                    y: Math.floor(Math.random() * BOARD_HEIGHT)
                };
            } while (cellOccupied(pos));
            return pos;
        }

        function spawnFoodAndPoison() {
            food = [];
            poison = [];
            for (let i = 0; i < 32; i++) {
                const pos = randomFreeCell();
                if (i < 2) food.push(pos);
                else poison.push(pos);
            }
        }

        // ---------- Rendering ----------

        function drawHeadEyes(head, dir, color) {
            const eyeSize = Math.max(1, Math.floor(CELL_SIZE / 5));
            const padding = Math.max(1, Math.floor(CELL_SIZE / 5));
            ctx.fillStyle = color;
            const cs = CELL_SIZE;
            let eyePositions;

            if (dir.x === 1) {
                eyePositions = [
                    { x: head.x * cs + cs - padding - eyeSize, y: head.y * cs + padding },
                    { x: head.x * cs + cs - padding - eyeSize, y: head.y * cs + cs - padding - eyeSize }
                ];
            } else if (dir.x === -1) {
                eyePositions = [
                    { x: head.x * cs + padding, y: head.y * cs + padding },
                    { x: head.x * cs + padding, y: head.y * cs + cs - padding - eyeSize }
                ];
            } else if (dir.y === -1) {
                eyePositions = [
                    { x: head.x * cs + padding, y: head.y * cs + padding },
                    { x: head.x * cs + cs - padding - eyeSize, y: head.y * cs + padding }
                ];
            } else {
                eyePositions = [
                    { x: head.x * cs + padding, y: head.y * cs + cs - padding - eyeSize },
                    { x: head.x * cs + cs - padding - eyeSize, y: head.y * cs + cs - padding - eyeSize }
                ];
            }

            eyePositions.forEach(pos => ctx.fillRect(pos.x, pos.y, eyeSize, eyeSize));
        }

        function drawLabelBox(text, side) {
            const fontSize = Math.max(10, Math.min(16, CELL_SIZE * 1.4));
            ctx.font = `${fontSize}px Arial`;
            const textW = ctx.measureText(text).width;
            const padding = 4;
            const boxH = fontSize + padding * 2;
            const boxX = side === 'right'
                ? canvas.width - textW - padding * 2 - 2
                : 2;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(boxX, 2, textW + padding * 2, boxH);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(text, boxX + padding, 2 + padding);
            ctx.textBaseline = 'alphabetic';
        }

        function score(player) {
            return Math.max(player.worm.length - INITIAL_WORM_LENGTH, 0);
        }

        function drawScores() {
            if (mode === 'single') {
                const me = players[0];
                if (me) drawLabelBox(`Score: ${score(me)}`, 'right');
                return;
            }
            const me = players[localPlayerIndex];
            const op = players[1 - localPlayerIndex];
            if (me) drawLabelBox(`You: ${score(me)}`, 'right');
            if (op) drawLabelBox(`Opponent: ${score(op)}`, 'left');
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            players.forEach(p => {
                if (!p.worm || p.worm.length === 0) return;
                ctx.fillStyle = p.bodyColor;
                p.worm.slice(1).forEach(segment => {
                    ctx.fillRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                });
                const head = p.worm[0];
                ctx.fillStyle = p.alive ? p.headColor : '#555';
                ctx.fillRect(head.x * CELL_SIZE, head.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                drawHeadEyes(head, p.direction, p.eyeColor);
            });

            ctx.fillStyle = '#ff0';
            food.forEach(f => ctx.fillRect(f.x * CELL_SIZE, f.y * CELL_SIZE, CELL_SIZE, CELL_SIZE));

            ctx.fillStyle = '#f00';
            poison.forEach(p => ctx.fillRect(p.x * CELL_SIZE, p.y * CELL_SIZE, CELL_SIZE, CELL_SIZE));

            if (gamePhase !== 'lobby') drawScores();
        }

        // ---------- Simulation (host/single only) ----------

        function schedulePlayerMove(index) {
            const p = players[index];
            clearTimeout(p.timer);
            if (gamePhase === 'playing' && p.alive && p.started) {
                p.timer = setTimeout(() => movePlayer(index), getMoveInterval(p));
            }
        }

        function stopAllTimers() {
            players.forEach(p => {
                clearTimeout(p.timer);
                p.timer = null;
            });
        }

        // Restart movement for worms already underway (used after a reconnect pause).
        function resumeTimers() {
            players.forEach((p, i) => {
                if (p.alive && p.started) schedulePlayerMove(i);
            });
        }

        function movePlayer(index) {
            const p = players[index];
            if (gamePhase !== 'playing' || !p.alive || !p.started) return;

            const head = { x: p.worm[0].x + p.direction.x, y: p.worm[0].y + p.direction.y };

            const hitsWall = head.x < 0 || head.x >= BOARD_WIDTH || head.y < 0 || head.y >= BOARD_HEIGHT;
            const hitsWorm = players.some(q => q.worm.some(s => s.x === head.x && s.y === head.y));
            const hitsPoison = poison.some(pz => pz.x === head.x && pz.y === head.y);

            if (hitsWall || hitsWorm || hitsPoison) {
                p.alive = false;
                clearTimeout(p.timer);
                draw();
                broadcastState();
                checkGameEnd();
                return;
            }

            const foodIndex = food.findIndex(f => f.x === head.x && f.y === head.y);
            if (foodIndex !== -1) {
                food.splice(foodIndex, 1);
                food.push(randomFreeCell());
                autoStartIdleWorms(index);
            } else {
                p.worm.pop();
            }
            p.worm.unshift(head);

            draw();
            broadcastState();
            schedulePlayerMove(index);
        }

        // Direction the worm's head currently points, inferred from its geometry
        // (head relative to the segment behind it).
        function headDirection(p) {
            const head = p.worm[0];
            const next = p.worm[1] || head;
            const dx = Math.sign(head.x - next.x);
            const dy = Math.sign(head.y - next.y);
            return (dx === 0 && dy === 0) ? { x: 1, y: 0 } : { x: dx, y: dy };
        }

        // Multiplayer: once a worm eats, any opponent that has not begun moving
        // is nudged into motion along the way its head already points.
        function autoStartIdleWorms(eaterIndex) {
            if (mode === 'single') return;
            players.forEach((p, i) => {
                if (i === eaterIndex || !p.alive || p.started) return;
                p.direction = headDirection(p);
                p.started = true;
                schedulePlayerMove(i);
            });
        }

        function checkGameEnd() {
            if (mode === 'single') {
                if (!players[0].alive) finishGame();
                return;
            }
            // Multiplayer: the game ends the moment either worm dies.
            if (players.some(p => !p.alive)) finishGame();
        }

        function finishGame() {
            gamePhase = 'over';
            stopAllTimers();
            broadcastState();
            presentGameOver();
        }

        // Applies a direction change to a player slot, enforcing the
        // perpendicular-only rule (a worm cannot reverse into itself).
        function applyInput(index, newDir) {
            const p = players[index];
            if (!p || gamePhase !== 'playing' || !p.alive) return;
            if (newDir.x !== 0 && p.direction.x !== 0) return;
            if (newDir.y !== 0 && p.direction.y !== 0) return;
            p.direction = newDir;
            if (!p.started) {
                p.started = true;
                schedulePlayerMove(index);
            }
        }

        // ---------- Local input ----------

        function handleLocalDirection(newDir) {
            if (gamePhase !== 'playing') return;
            if (mode === 'joiner') {
                if (conn && conn.open) conn.send({ t: 'input', dir: newDir });
            } else {
                applyInput(localPlayerIndex, newDir);
            }
        }

        function getTouchZone(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const nx = (clientX - rect.left) / rect.width;
            const ny = (clientY - rect.top) / rect.height;
            const d1 = ny - nx;
            const d2 = ny - (1 - nx);
            if (d1 < 0 && d2 < 0) return { x: 0, y: -1 }; // top
            if (d1 > 0 && d2 > 0) return { x: 0, y: 1 };  // bottom
            if (d1 > 0 && d2 < 0) return { x: -1, y: 0 }; // left
            return { x: 1, y: 0 };                         // right
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameOverDiv.style.display === 'block') return;
            const touch = e.touches[0];
            handleLocalDirection(getTouchZone(touch.clientX, touch.clientY));
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (gameOverDiv.style.display === 'block') return;
            const me = players[localPlayerIndex];
            if (!me) return;
            const dir = me.direction;
            const key = e.key.toLowerCase();
            let newDir = null;
            switch (key) {
                case 'w': case 'arrowup':    if (dir.y === 0) newDir = { x: 0, y: -1 }; break;
                case 's': case 'arrowdown':  if (dir.y === 0) newDir = { x: 0, y: 1 };  break;
                case 'a': case 'arrowleft':  if (dir.x === 0) newDir = { x: -1, y: 0 }; break;
                case 'd': case 'arrowright': if (dir.x === 0) newDir = { x: 1, y: 0 };  break;
            }
            if (newDir) handleLocalDirection(newDir);
        });

        // ---------- Overlay ----------

        // The start overlay is a two-screen card menu. The main screen offers
        // single vs multiplayer; the multiplayer screen offers back / random /
        // enter-a-number / show-your-number.
        function showMainMenu() {
            mainMenu.style.display = 'flex';
            multiMenu.style.display = 'none';
            joinNumberArea.style.display = 'none';
            mpStatus.textContent = '';
        }

        function showMultiMenu() {
            mainMenu.style.display = 'none';
            multiMenu.style.display = 'flex';
            joinNumberArea.style.display = 'none';
            if (mpUnavailable) {
                mpStatus.textContent = 'Multiplayer unavailable (could not reach broker).';
            } else if (!peerReady) {
                mpStatus.textContent = 'Connecting…';
            } else {
                mpStatus.textContent = '';
            }
        }

        function showStartOverlay() {
            overlayTitle.textContent = 'Worm';
            startControls.style.display = 'block';
            showMainMenu();
            gameOverDiv.style.display = 'block';
        }

        function hideOverlay() {
            gameOverDiv.style.display = 'none';
        }

        // A bare status overlay (no inputs/buttons), used for reconnect notices.
        function showMessage(title) {
            overlayTitle.textContent = title;
            startControls.style.display = 'none';
            gameOverDiv.style.display = 'block';
        }

        function resultText() {
            if (mode === 'single') return 'Game Over!';
            const me = players[localPlayerIndex];
            const other = players[1 - localPlayerIndex];
            if (me && other && !me.alive && !other.alive) return 'Draw!';
            if (me && !me.alive) return 'You lose!';
            return 'You win!';
        }

        function presentGameOver() {
            if (gameOverShown) return;
            gameOverShown = true;
            stopAllTimers();
            // Write the result ("Game Over!" in solo) across the board, hold for
            // half a second, then move on to the leaderboard prompt or the start
            // screen.
            showMessage(resultText());
            setTimeout(afterGameOver, 500);
        }

        async function afterGameOver() {
            const me = players[localPlayerIndex];
            const prompted = me ? await maybePromptLeaderboard(me) : false;
            // If no leaderboard prompt was shown, go straight back to the start
            // screen. Otherwise the publish/skip buttons handle the return.
            if (!prompted) returnToStart();
        }

        // Tear down any multiplayer session and show the start overlay.
        function returnToStart() {
            leaveSession();
            showLobbyPreview();
        }

        // ---------- Game start / restart ----------

        function startSingle() {
            leaveSession();
            mode = 'single';
            localPlayerIndex = 0;
            gameOverShown = false;
            playerName = activeName('Player');
            buildPlayers([playerName]);
            spawnFoodAndPoison();
            gamePhase = 'playing';
            hideOverlay();
            draw();
        }

        function startHostGame() {
            mode = 'host';
            localPlayerIndex = 0;
            gameOverShown = false;
            sessionActive = true;
            playerName = activeName('Host');
            // Joiner's real name arrives via the 'hello' message and updates slot 1.
            buildPlayers([playerName, 'Player 2']);
            spawnFoodAndPoison();
            gamePhase = 'playing';
            hideOverlay();
            broadcastState();
            draw();
        }

        function showLobbyPreview() {
            mode = 'single';
            localPlayerIndex = 0;
            gamePhase = 'lobby';
            gameOverShown = false;
            buildPlayers([activeName('Player')]);
            spawnFoodAndPoison();
            draw();
            showStartOverlay();
        }

        // ----- Start-menu cards -----
        singleCard.addEventListener('click', () => startSingle());

        multiCard.addEventListener('click', () => showMultiMenu());

        backCard.addEventListener('click', () => {
            if (randomState !== 'idle') cancelRandom();
            showMainMenu();
        });

        enterNumberCard.addEventListener('click', () => {
            if (!peerReady) return;
            joinNumberArea.style.display = 'flex';
            mpStatus.textContent = '';
            joinCodeInput.focus();
        });

        yourNumberCard.addEventListener('click', () => {
            if (!peerReady) return;
            mpStatus.textContent = 'Share this number with a friend, the game will start automatically when your friend enters this number.';
        });

        leaderboardBtn.addEventListener('click', () => {
            leaderboardPanel.style.display = 'block';
            loadLeaderboard().then(updateLeaderboardDisplay);
        });

        closeLeaderboard.addEventListener('click', () => {
            leaderboardPanel.style.display = 'none';
        });

        closeNameError.addEventListener('click', () => {
            nameErrorPanel.style.display = 'none';
            wellDoneName.focus();
        });

        window.addEventListener('resize', () => {
            computeCellSize();
            draw();
        });

        // ---------- Networking: shared state sync ----------

        function applyStyles(playerList) {
            playerList.forEach((p, slot) => {
                const style = PLAYER_STYLES[slot] || PLAYER_STYLES[0];
                p.headColor = style.headColor;
                p.bodyColor = style.bodyColor;
                p.eyeColor = style.eyeColor;
            });
        }

        function broadcastState() {
            if (mode !== 'host' || !conn || !conn.open) return;
            conn.send({
                t: 'state',
                phase: gamePhase,
                players: players.map(p => ({
                    name: p.name,
                    worm: p.worm,
                    direction: p.direction,
                    alive: p.alive,
                    started: p.started
                })),
                food: food,
                poison: poison
            });
        }

        // Joiner: render whatever the host sends and react to phase changes.
        function applyRemoteState(msg) {
            const wasOver = gamePhase === 'over';
            players = msg.players;
            applyStyles(players);
            food = msg.food;
            poison = msg.poison;
            gamePhase = msg.phase;

            if (gamePhase === 'playing') {
                gameOverShown = false;
                hideOverlay();
            }
            draw();
            if (gamePhase === 'over' && !wasOver) {
                presentGameOver();
            }
        }

        // ---------- Networking: connection lifecycle ----------

        // Diagnostic: once a DataConnection opens, inspect the underlying
        // RTCPeerConnection's selected ICE candidate pair and log whether the
        // link is a direct peer-to-peer connection or relayed through a TURN
        // server. Candidate types: host = LAN, srflx/prflx = direct via STUN
        // hole-punching, relay = TURN relay (not true P2P).
        function logConnectionDetails(c) {
            const pc = c && c.peerConnection;
            if (!pc || !pc.getStats) {
                console.log('[worm-03] No RTCPeerConnection available for stats.');
                return;
            }
            // Let ICE settle on its final nominated pair before reading stats.
            setTimeout(() => {
                pc.getStats().then((report) => {
                    let pair = null, transport = null;
                    report.forEach((s) => { if (s.type === 'transport') transport = s; });
                    if (transport && transport.selectedCandidatePairId) {
                        pair = report.get(transport.selectedCandidatePairId);
                    }
                    if (!pair) {
                        report.forEach((s) => {
                            if (s.type === 'candidate-pair' && s.state === 'succeeded' &&
                                (s.nominated || s.selected)) pair = s;
                        });
                    }
                    if (!pair) {
                        console.log('[worm-03] Connected, but no active ICE candidate pair found yet.');
                        return;
                    }
                    const local = report.get(pair.localCandidateId);
                    const remote = report.get(pair.remoteCandidateId);
                    const meaning = {
                        host: 'direct (same LAN)',
                        srflx: 'direct via STUN hole-punch',
                        prflx: 'direct (peer-reflexive)',
                        relay: 'RELAYED via TURN'
                    };
                    const lt = local && local.candidateType;
                    const rt = remote && remote.candidateType;
                    const relayed = lt === 'relay' || rt === 'relay';
                    const fmt = (cand) => cand
                        ? `${cand.candidateType} (${meaning[cand.candidateType] || '?'}) ` +
                          `${cand.address || cand.ip || '?'}:${cand.port || '?'}/${cand.protocol || '?'}` +
                          (cand.url ? `  via ${cand.url}` : '')
                        : 'unknown';
                    console.log(
                        '[worm-03] Connection established — ' +
                        (relayed ? 'RELAYED through a TURN server (not direct P2P)'
                                 : 'DIRECT peer-to-peer') + '\n' +
                        '  Local  candidate: ' + fmt(local) + '\n' +
                        '  Remote candidate: ' + fmt(remote) + '\n' +
                        '  RTT: ' + (pair.currentRoundTripTime != null
                            ? Math.round(pair.currentRoundTripTime * 1000) + ' ms' : 'n/a'));
                    console.log('[worm-03] Selected candidate pair:', pair);
                }).catch((e) => console.log('[worm-03] getStats failed:', e));
            }, 1000);
        }

        // Host side: a peer connected to our game code.
        function setupHostConnection(c) {
            conn = c;
            c.on('open', () => {
                logConnectionDetails(c);
                mpStatus.textContent = '';
                reconnecting = false;
                reconnectAttempts = 0;
                clearTimeout(hostGiveupTimer);
                if (gamePhase === 'playing') {
                    // Reconnect mid-session: resume the paused simulation and resync.
                    hideOverlay();
                    resumeTimers();
                    broadcastState();
                } else {
                    startHostGame();
                }
            });
            c.on('data', (msg) => {
                if (!msg || typeof msg !== 'object') return;
                if (msg.t === 'input') {
                    applyInput(1, msg.dir);
                } else if (msg.t === 'hello') {
                    if (players[1]) players[1].name = (msg.name || 'Player 2');
                    draw();
                    broadcastState();
                }
            });
            c.on('close', onConnClose);
            c.on('error', () => {});
        }

        // Joiner side: we connected to a host's game code.
        function setupJoinerConnection(c) {
            conn = c;
            mode = 'joiner';
            localPlayerIndex = 1;
            c.on('open', () => {
                logConnectionDetails(c);
                reconnecting = false;
                reconnectAttempts = 0;
                sessionActive = true;
                randomState = 'idle';
                randomCard.textContent = 'Join Random Game';
                mpStatus.textContent = 'Connected! Waiting for host…';
                try { c.send({ t: 'hello', name: playerName }); } catch (e) {}
                hideOverlay();
            });
            c.on('data', (msg) => {
                if (msg && msg.t === 'state') applyRemoteState(msg);
            });
            c.on('close', onConnClose);
            c.on('error', () => {});
        }

        function onConnClose() {
            if (intentionalLeave) return;
            // A normal game end sends both players back to the start screen, so a
            // close while the round is over is expected — don't try to reconnect.
            if (gamePhase === 'over') return;
            if (reconnecting) return; // a reconnect attempt is already in flight
            if (!sessionActive) {
                onOpponentLeft('Could not connect. Try again.');
                return;
            }
            stopAllTimers();
            if (mode === 'joiner') startJoinerReconnect();
            else startHostReconnectWait();
        }

        function startJoinerReconnect() {
            reconnecting = true;
            reconnectAttempts = 0;
            joinerReconnectAttempt();
        }

        function joinerReconnectAttempt() {
            if (!sessionActive) { reconnecting = false; return; }
            if (reconnectAttempts >= MAX_RECONNECT) {
                reconnecting = false;
                sessionActive = false;
                onOpponentLeft('Lost connection to opponent.');
                return;
            }
            reconnectAttempts++;
            showMessage(`Reconnecting… (${reconnectAttempts}/${MAX_RECONNECT})`);
            conn = null;
            const c = peer.connect(remotePeerId, { reliable: true });
            setupJoinerConnection(c);
            // Watchdog: if this attempt hasn't opened, try again.
            reconnectTimer = setTimeout(() => {
                if (reconnecting && (!conn || !conn.open)) joinerReconnectAttempt();
            }, 3000);
        }

        function startHostReconnectWait() {
            reconnecting = true;
            conn = null;
            showMessage('Opponent disconnected — waiting to reconnect…');
            clearTimeout(hostGiveupTimer);
            hostGiveupTimer = setTimeout(() => {
                if (!conn || !conn.open) {
                    reconnecting = false;
                    sessionActive = false;
                    onOpponentLeft('Opponent left.');
                }
            }, 20000);
        }

        function onOpponentLeft(message) {
            reconnecting = false;
            clearTimeout(hostGiveupTimer);
            clearTimeout(reconnectTimer);
            reconnectAttempts = 0;
            sessionActive = false;
            if (conn) { try { conn.close(); } catch (e) {} }
            conn = null;
            releaseLobby();
            mode = 'single';
            localPlayerIndex = 0;
            playerName = playerName || 'Player';
            showLobbyPreview();
            if (message) mpStatus.textContent = message;
        }

        // Tear down an active session without triggering reconnect (e.g. when the
        // user deliberately starts a solo game).
        function leaveSession() {
            intentionalLeave = true;
            reconnecting = false;
            sessionActive = false;
            clearTimeout(hostGiveupTimer);
            clearTimeout(reconnectTimer);
            reconnectAttempts = 0;
            if (conn) { try { conn.close(); } catch (e) {} }
            conn = null;
            releaseLobby();
            setTimeout(() => { intentionalLeave = false; }, 500);
        }

        // ---------- Networking: code-based join ----------

        function joinByCode(code) {
            mpStatus.textContent = 'Connecting…';
            randomState = 'idle';
            randomCard.textContent = 'Join Random Game';
            remotePeerId = code;
            const c = peer.connect(code, { reliable: true });
            setupJoinerConnection(c);
        }

        joinBtn.addEventListener('click', async () => {
            if (!peerReady) return;
            const code = joinCodeInput.value.trim();
            if (!/^\d{4}$/.test(code)) {
                mpStatus.textContent = 'Enter a 4-digit code.';
                return;
            }
            if (code === myCode) {
                mpStatus.textContent = "That's your own code — share it instead.";
                return;
            }
            playerName = activeName('Player');
            joinByCode(code);
        });

        // ---------- Networking: random matchmaking (fixed-ID lobby) ----------
        //
        // The lobby is a one-slot rendezvous on a well-known ID. Whoever holds it
        // is "waiting". A searcher first probes the lobby:
        //   - If someone is waiting, the waiter sends back its 4-digit game code,
        //     and the searcher joins it normally (becoming the joiner).
        //   - If nobody is waiting, the searcher claims the lobby ID and waits.
        // When a match forms the waiter releases the lobby ID so the next pair can
        // use it; the game itself runs over the persistent per-client game peers.

        function closeLobbyConn() {
            if (lobbyConn) { try { lobbyConn.close(); } catch (e) {} lobbyConn = null; }
        }

        function releaseLobby() {
            clearTimeout(lobbyProbeTimer);
            closeLobbyConn();
            if (lobbyPeer) { try { lobbyPeer.destroy(); } catch (e) {} lobbyPeer = null; }
            randomState = 'idle';
            randomCard.textContent = 'Join Random Game';
        }

        function cancelRandom() {
            releaseLobby();
            mpStatus.textContent = '';
        }

        function probeLobby() {
            randomState = 'probing';
            lobbyProbeSettled = false;
            mpStatus.textContent = 'Looking for an opponent…';
            lobbyConn = peer.connect(LOBBY_ID, { reliable: true });
            lobbyProbeTimer = setTimeout(onLobbyProbeFailed, 3000);
            lobbyConn.on('open', () => {
                mpStatus.textContent = 'Opponent found, connecting…';
            });
            lobbyConn.on('data', (msg) => {
                if (lobbyProbeSettled) return;
                if (msg && msg.type === 'rendezvous' && msg.code) {
                    lobbyProbeSettled = true;
                    clearTimeout(lobbyProbeTimer);
                    closeLobbyConn();
                    playerName = activeName('Player');
                    joinByCode(msg.code);
                }
            });
            lobbyConn.on('error', onLobbyProbeFailed);
        }

        function onLobbyProbeFailed() {
            if (lobbyProbeSettled || randomState !== 'probing') return;
            lobbyProbeSettled = true;
            clearTimeout(lobbyProbeTimer);
            closeLobbyConn();
            claimLobby();
        }

        function claimLobby() {
            randomState = 'waiting';
            mpStatus.textContent = 'Waiting for an opponent to join…';
            lobbyPeer = new Peer(LOBBY_ID, { debug: 0 });
            lobbyPeer.on('connection', (c) => {
                // A searcher reached us; hand them our game code so they can join.
                c.on('open', () => {
                    try { c.send({ type: 'rendezvous', code: myCode }); } catch (e) {}
                });
                // The lobby peer is released once the real game connection arrives
                // (see peer.on('connection') -> releaseLobby()).
            });
            lobbyPeer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Someone else claimed the lobby a moment ago — go probe them.
                    try { lobbyPeer.destroy(); } catch (e) {}
                    lobbyPeer = null;
                    if (randomState === 'waiting') probeLobby();
                } else {
                    mpStatus.textContent = 'Lobby error: ' + err.type;
                    cancelRandom();
                }
            });
        }

        randomCard.addEventListener('click', async () => {
            if (randomState !== 'idle') { cancelRandom(); return; }
            if (!peerReady) { mpStatus.textContent = 'Still connecting…'; return; }
            playerName = activeName('Player');
            randomCard.textContent = 'Cancel Search';
            probeLobby();
        });

        // ---------- Networking: our persistent game peer ----------

        function createPeer() {
            if (typeof Peer === 'undefined') {
                mpUnavailable = true;
                yourCodeEl.textContent = 'N/A';
                if (multiMenu.style.display !== 'none') {
                    mpStatus.textContent = 'Multiplayer unavailable (could not reach broker).';
                }
                return;
            }
            myCode = String(Math.floor(1000 + Math.random() * 9000));
            peer = new Peer(myCode, { debug: 0 });

            peer.on('open', (id) => {
                peerReady = true;
                myCode = id;
                yourCodeEl.textContent = id;
                randomCard.disabled = false;
                enterNumberCard.disabled = false;
                yourNumberCard.disabled = false;
                // If the player is already looking at the multiplayer menu, clear
                // the "Connecting…" notice now that we are ready.
                if (multiMenu.style.display !== 'none' && randomState === 'idle') {
                    mpStatus.textContent = '';
                }
            });

            peer.on('connection', (c) => {
                // Reject extra connections while a game connection is live.
                if (conn && conn.open) {
                    c.on('open', () => { try { c.close(); } catch (e) {} });
                    return;
                }
                releaseLobby();
                remotePeerId = c.peer;
                setupHostConnection(c);
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Our random code collided; pick another (only happens at startup).
                    try { peer.destroy(); } catch (e) {}
                    createPeer();
                } else if (err.type === 'peer-unavailable') {
                    if (randomState === 'probing') { onLobbyProbeFailed(); return; }
                    if (reconnecting) return; // a reconnect attempt will retry
                    mpStatus.textContent = 'No game found for that code.';
                } else {
                    if (reconnecting) return;
                    mpStatus.textContent = 'Network error: ' + err.type;
                }
            });
        }

        // ---------- Init ----------

        function initGame() {
            computeCellSize();
            loadLeaderboard().then(updateLeaderboardDisplay);
            createPeer();
            showLobbyPreview();
        }

        initGame();
    </script>
</body>
