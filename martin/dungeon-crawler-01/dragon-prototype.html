<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypt Dragon Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Layout: the scene fills the screen; a floating options panel (a collapsible bottom sheet on phones). One dark look, like the game. */
  :root {
    --bg: #040205; --panel: rgba(14, 12, 12, 0.9); --line: #39302a; --fg: #e8dcc4; --muted: #a49378; --gold: #d8b45a;
    --on: #5a2a1c; --onfg: #ffe6d2; --ember: #f0a066;
    --display: Cinzel, Georgia, serif; --body: "IM Fell English", Georgia, serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: var(--body); font-size: 15px; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    width: 320px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(3px); }
  #panel header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-family: var(--display); font-size: 17px; letter-spacing: 0.06em; margin: 0; color: var(--ember); font-weight: 700; }
  .hint { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
  .desc { margin: 0; color: var(--fg); font-size: 13.5px; line-height: 1.35; font-style: italic; opacity: 0.85; }
  .row { display: flex; flex-direction: column; gap: 4px; }
  .lab { font-family: var(--display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .lab output { font-family: var(--body); letter-spacing: 0; text-transform: none; color: var(--fg); font-size: 13px; font-variant-numeric: tabular-nums; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; background: transparent; color: var(--fg); border: 0; border-left: 1px solid var(--line); padding: 6px 4px;
    font: 14px var(--body); cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--on); color: var(--onfg); }
  input[type=range] { width: 100%; accent-color: var(--ember); margin: 0; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--ember); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn { background: #1c1a19; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: 14px var(--body); cursor: pointer; }
  .btn:hover, .seg button:hover { filter: brightness(1.25); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
  #toggle { display: none; }
  #status { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px));
    font: 15px var(--body); color: var(--ember); text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; max-width: calc(100% - 360px); }
  #status small { display: block; color: var(--muted); font-size: 13px; }
  #boss { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px));
    pointer-events: none; text-align: center; display: none; }
  #boss .name { font: 15px var(--display); letter-spacing: 0.08em; color: #7fe08a; text-shadow: 0 0 4px #000; margin-bottom: 4px; }
  #boss .bar { height: 8px; background: rgba(0,0,0,0.7); border: 1px solid #39302a; border-radius: 4px; overflow: hidden; }
  #boss .fill { height: 100%; background: linear-gradient(#6fe07a, #2e8a3a); width: 100%; }
  @media (max-width: 640px) {
    #status { max-width: calc(100% - 24px); }
    #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 58%; border-radius: 12px 12px 0 0; border-bottom: 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    #panel.closed > :not(header) { display: none; }
    #toggle { display: inline-block; }
    #boss { bottom: auto; top: calc(64px + env(safe-area-inset-top, 0px)); }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="status">Loading…</div>
<div id="boss"><div class="name">Vharzul the Ember Wyrm</div><div class="bar"><div class="fill" id="bossFill"></div></div></div>
<div id="panel" class="closed">
  <header><h1>Crypt Dragon</h1><button class="btn" id="toggle" aria-expanded="false">Options</button></header>
  <p class="hint">Placeholder shapes, to tune how a big dragon made of parts moves and sorts. Tap the floor to walk, tap the dragon to strike it (the head takes ×1.5). Walk close to wake it.</p>
  <div class="row"><div class="lab">The dragon</div>
    <div class="seg" data-opt="mode"><button data-v="fight">Fights</button><button data-v="follow">Follows</button><button data-v="still">Stays</button></div>
    <p class="desc" id="modeD"></p></div>
  <div class="row"><div class="lab">Spine</div>
    <div class="seg" data-opt="spine"><button data-v="body">Body leads</button><button data-v="snake">Snake</button></div>
    <p class="desc" id="spineD"></p></div>
  <div class="row"><div class="lab">Depth sorting</div>
    <div class="seg" data-opt="sort"><button data-v="part">Per part</button><button data-v="one">One key</button></div>
    <p class="desc" id="sortD"></p></div>
  <div class="row"><div class="lab">Attacks</div>
    <div class="btns"><button class="btn" data-act="bite">Bite</button><button class="btn" data-act="breath">Fire breath</button><button class="btn" data-act="tail">Tail sweep</button><button class="btn" data-act="buffet">Wing buffet</button><button class="btn" data-act="roar">Roar</button></div></div>
  <div class="row"><label class="lab" for="size">Size <output id="sizeV"></output></label><input type="range" id="size" min="0.7" max="1.4" step="0.05"></div>
  <div class="row"><label class="lab" for="speed">Walking speed <output id="speedV"></output></label><input type="range" id="speed" min="0.6" max="3.6" step="0.1"></div>
  <div class="row"><label class="lab" for="fz">Camera in the fight <output id="fzV"></output></label><input type="range" id="fz" min="0.45" max="1" step="0.05"></div>
  <div class="row"><div class="lab">Light</div>
    <div class="seg" data-opt="light"><button data-v="game">Game</button><button data-v="dim">Dim</button><button data-v="off">Off</button></div></div>
  <div class="checks">
    <label><input type="checkbox" id="wings"> Wings</label>
    <label><input type="checkbox" id="legs"> Legs</label>
    <label><input type="checkbox" id="shadows"> Shadows</label>
    <label><input type="checkbox" id="debug"> Show the spine</label>
    <label><input type="checkbox" id="sound"> Sound</label>
  </div>
  <div class="btns">
    <button class="btn" id="reset">Reset</button><button class="btn" id="kill">Slay it</button>
    <button class="btn" id="zout" aria-label="Zoom out">−</button><button class="btn" id="zin" aria-label="Zoom in">+</button>
  </div>
</div>
<script>
// =====================================================================================
//  Crypt Dragon prototype (todo #17, step 1): a big dragon built from separately sorted parts, with placeholder
//  shapes, in a lair with pillars and braziers, next to the game's hero. Nothing here is loaded by the game.
//   - The body is a spine of 19 nodes (head, 5 neck, shoulders, 2 torso, hips, 9 tail), each a circle on the floor
//     (its collision and hit area) lifted to a height z. Every node, leg and wing panel is its own drawable with its
//     own depth key (x + y), sorted with the walls, pillars and the hero, like everything in the game.
//   - Body leads: the torso walks (centre + heading, turning slowly, bending into the turn); the neck reaches from the
//     shoulders toward what the dragon looks at (a curve, so it curls); the tail is a drag chain behind the hips with a
//     bend limit per joint and a slow sway. Snake: the head walks and every node follows its path at fixed spacing.
//   - Legs: 4 feet planted on the floor; a foot steps (an arc, 0.32 s) when it falls more than a step behind its
//     place under the shoulder or hip; diagonal pairs alternate. Two-bone IK, elbows back, knees forward.
//   - Wings: flat panels between arm and finger bones, blended between folded and spread, flapped by rotating them
//     about the body's axis.
//   - Shadows of all parts go into one mask first (so overlaps don't double up), drawn at 45 % black.
//   - Attacks: bite, fire breath (a cone), tail sweep (the tail whips toward the side the hero is on), wing buffet
//     (knocks the hero back), roar (on waking). One health pool; the head takes ×1.5. Death: the body sinks node by
//     node from the tail tip to the head.
// =====================================================================================
const TW = 96, TH = 48, HW = TW / 2, HH = TH / 2, WALLH = 72, SHADE_Y = 0.42, SHADE_X = 0.18;
const P = HW * Math.SQRT2;       // px per tile in the ground plane
const iso = (x, y) => [(x - y) * HW, (x + y) * HH];
const S3 = (x, y, z) => [(x - y) * HW, (x + y) * HH - z];
const MW = 26, MH = 24;
const isWall = (x, y) => x <= 0 || y <= 0 || x >= MW - 1 || y >= MH - 1;

const SRC = { floor: 'assets/floor.jpg', wall: 'assets/wall.jpg', dirt: 'assets/dirt.jpg', props: 'assets/props.webp', hero: 'assets/hero.webp' };
const HERO_MD = { fw: 144, fh: 152, frames: 8, idle: 3, footY: 128, fpt: 5 };
const PROPS = { brazier: [571, 0, 104, 167], banner: [1593, 0, 84, 206], pillar: [1679, 0, 98, 191], skullpile: [1425, 0, 166, 136] };
const PROP_STYLE = { brazier: [0.62, 10], banner: [0.66, 6], pillar: [0.72, 8], skullpile: [0.42, 8] };
const POST = [0.08, 0.46, 0.21, 0.5, 0.55];
const PROP_SHADOW = { brazier: [0.2, 0.44, 0.2, 0.75, 0.7], banner: POST, pillar: POST, skullpile: [0.2, 0.58, 0.28, 0.5, 0.55] };
const objects = [
  { k: 'pillar', x: 7, y: 7 }, { k: 'pillar', x: 18, y: 7 }, { k: 'pillar', x: 7, y: 16 }, { k: 'pillar', x: 18, y: 16 },
  { k: 'brazier', x: 5, y: 1, light: 4.2 }, { k: 'brazier', x: 12, y: 1, light: 4.2 }, { k: 'brazier', x: 20, y: 1, light: 4.2 },
  { k: 'brazier', x: 1, y: 6, light: 4.2 }, { k: 'brazier', x: 1, y: 13, light: 4.2 }, { k: 'brazier', x: 1, y: 19, light: 4.2 },
  { k: 'banner', x: 16, y: 1 }, { k: 'banner', x: 1, y: 10 }, { k: 'skullpile', x: 4, y: 4 }, { k: 'skullpile', x: 21, y: 4 }];
const COLL = objects.map(o => ({ x: o.x + 0.5, y: o.y + 0.5, r: o.k === 'pillar' ? 0.42 : 0.36 }));
const HOARD = { x: 13, y: 9.5, r: 3.3 };

const O = { mode: 'fight', spine: 'body', sort: 'part', size: 1, speed: 1.9, fz: 0.7, light: 'game', wings: true, legs: true, shadows: true, debug: false, sound: true };
const DESC = {
  fight: 'Asleep on its hoard until you come near; then it roars, follows you and attacks.',
  follow: 'Awake, follows you at a distance and never attacks: to watch the walk, the turns and the legs.',
  still: 'Stays where it is; only the neck and head follow you.',
  body: 'The torso walks and turns; the neck reaches toward you, the tail drags behind with a slow sway.',
  snake: 'The head walks and every part follows its path: it cannot turn on the spot, so it circles.',
  part: 'Every node, leg and wing panel is sorted on its own: the tail sorts at the tail, the head at the head.',
  one: 'The whole dragon uses one key (its middle), as one big sprite would: walk around it to see the wrong parts cover the pillars and the hero.' };

// The spine, head to tail tip: [kind, radius (tiles), spacing to the node before it (tiles)]
const PROFILE = [['head', 0.40, 0],
  ['neck', 0.27, 0.46], ['neck', 0.29, 0.40], ['neck', 0.31, 0.40], ['neck', 0.34, 0.40], ['neck', 0.38, 0.40],
  ['shoulders', 0.62, 0.48], ['torso', 0.72, 0.55], ['torso', 0.70, 0.55], ['hips', 0.60, 0.55],
  ['tail', 0.48, 0.50], ['tail', 0.42, 0.46], ['tail', 0.36, 0.44], ['tail', 0.31, 0.42], ['tail', 0.26, 0.40],
  ['tail', 0.21, 0.38], ['tail', 0.17, 0.36], ['tail', 0.13, 0.34], ['tail', 0.09, 0.32]];
const SH = 6, HIPS = 9, NECK_N = 5;
const COL = { hi: '#a8603f', mid: '#5c261c', lo: '#1a0806', spike: '#8c7656', bone: '#2a120e', claw: '#d8c8a8' };
// wing bones in the body's frame: [forward, outward, up] in tiles; root, elbow, wrist, 3 finger tips, trailing root
const WING_SPREAD = [[0, 0, 0], [0.25, 1.05, 0.38], [0.45, 2.05, 0.6], [-0.25, 3.4, 0.28], [-1.05, 2.9, 0.05], [-1.75, 2.0, -0.05], [-2.0, 0.45, 0]];
const WING_FOLD = [[0, 0, 0], [-0.3, 0.3, 0.45], [0.12, 0.4, 0.9], [-1.25, 0.5, 0.78], [-1.55, 0.48, 0.64], [-1.85, 0.42, 0.52], [-1.95, 0.3, 0.36]];
const WING_PANELS = [[0, 1, 2, 3], [2, 3, 4], [2, 4, 5], [2, 5, 6, 0]];

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const lc = document.createElement('canvas'), lctx = lc.getContext('2d');   // lighting
const sc = document.createElement('canvas'), sctx = sc.getContext('2d');   // the dragon's shadow mask
let W = 0, H = 0, DPR = 1, Z = 1, ZB = 1, camX = 0, camY = 0, TF = [1, 0, 0, 1, 0, 0], time = 0, shake = 0;
const IMG = {};
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = u => u * u * (3 - 2 * u);
const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = Math.random;
const toDev = (x, y, z = 0) => { const [X, Y] = S3(x, y, z); return [TF[0] * X + TF[4], TF[3] * Y + TF[5]]; };

// ---------- sound (synthesised; quiet placeholders) ----------
let AC = null, NOISE = null;
function audio() {
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = NOISE.getChannelData(0);
  let b = 0; for (let i = 0; i < d.length; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; }   // brown noise
  return AC;
}
function noise(dur, f0, f1, vol, q = 1, type = 'lowpass', attack = 0.05) {
  if (!O.sound || !AC || AC.state !== 'running') return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; s.loop = true; f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  roar: () => { noise(1.6, 900, 140, 0.9, 3, 'lowpass', 0.12); noise(1.4, 300, 90, 0.7, 6, 'bandpass', 0.2); },
  bite: () => noise(0.18, 2400, 300, 0.6, 1, 'lowpass', 0.005),
  breath: () => noise(1.5, 700, 1600, 0.45, 0.7, 'bandpass', 0.15),
  flap: () => noise(0.32, 500, 120, 0.5, 1, 'lowpass', 0.06),
  tail: () => noise(0.35, 1500, 400, 0.35, 2, 'bandpass', 0.08),
  hit: () => noise(0.12, 1800, 400, 0.35, 1, 'lowpass', 0.004),
  step: () => noise(0.16, 220, 60, 0.25, 1, 'lowpass', 0.01) };

// ---------- the scene: floor, walls, props, the hoard ----------
const PATS = new Map();
function pats(c) {
  if (PATS.has(c)) return PATS.get(c);
  const floor = c.createPattern(IMG.floor, 'repeat'); floor.setTransform(new DOMMatrix([HW, HH, -HW, HH, 0, 0]).scale(3 / 512));
  const dirt = c.createPattern(IMG.dirt, 'repeat'); dirt.setTransform(new DOMMatrix().scale(1.5 / 512));
  const p = { floor, dirt }; PATS.set(c, p); return p;
}
function face(c, img, sx, sy, sw, sh, A, B, shade) {
  const ux = B[0] - A[0], uy = B[1] - A[1];
  c.save(); c.transform(ux / sw, uy / sw, 0, WALLH / sh, A[0], A[1] - WALLH);
  c.drawImage(img, sx, sy, sw, sh, 0, 0, sw * 1.02, sh * 1.01);
  if (shade) { c.fillStyle = `rgba(0,0,0,${shade})`; c.fillRect(0, 0, sw * 1.02, sh * 1.01); }
  c.restore();
}
function drawWall(c, x, y) {
  const L = iso(x, y + 1), B = iso(x + 1, y + 1), R = iso(x + 1, y);
  const tsx = ((x * 131 + y * 71) % 4) * 128, tsy = ((x * 37 + y * 113) % 4) * 100;
  const inY = y + 1 < MH && !isWall(x, y + 1), inX = x + 1 < MW && !isWall(x + 1, y);
  if (inY) face(c, IMG.wall, tsx, tsy, 128, 75, L, B, SHADE_Y);
  if (inX) face(c, IMG.wall, (tsx + 256) % 512, tsy, 128, 75, B, R, SHADE_X);
  if (!inY && y + 1 < MH) face(c, IMG.dirt, tsx, tsy, 128, 75, L, B, SHADE_Y + 0.2);   // the room's outside: dirt
  if (!inX && x + 1 < MW) face(c, IMG.dirt, (tsx + 256) % 512, tsy, 128, 75, B, R, SHADE_X + 0.2);
  if (y === MH - 1) face(c, IMG.dirt, tsx, tsy, 128, 75, L, B, SHADE_Y + 0.2);
  if (x === MW - 1) face(c, IMG.dirt, (tsx + 256) % 512, tsy, 128, 75, B, R, SHADE_X + 0.2);
  c.save(); c.translate(0, -WALLH); c.transform(HW, HH, -HW, HH, 0, 0);
  c.beginPath(); c.rect(x, y, 1, 1); c.fillStyle = pats(c).dirt; c.fill(); c.fillStyle = 'rgba(0,0,0,0.25)'; c.fill();
  c.lineWidth = 0.012; c.strokeStyle = 'rgba(255,240,220,0.05)'; c.stroke(); c.restore();
}
function softShadow(c, x, y, rx, ry, a, mid) {
  c.save(); c.translate(x, y); c.scale(1, ry / rx);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(mid, `rgba(0,0,0,${a * 0.7})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, 7); c.fill(); c.restore();
}
function drawProp(c, o) {
  const [px, py, pw, ph] = PROPS[o.k], [s, off] = PROP_STYLE[o.k], [sx, sy] = iso(o.x + 0.5, o.y + 0.5);
  const w = pw * s, hh = ph * s, top = sy - hh + off, sh = PROP_SHADOW[o.k];
  if (sh) softShadow(c, sx, top + hh - w * sh[0], w * sh[1], w * sh[2], sh[3], sh[4]);
  c.drawImage(IMG.props, px, py, pw, ph, sx - w / 2, top, w, hh);
  if (o.k === 'brazier') for (let i = 0; i < 2; i++) {
    const t = (time * 0.9 + i * 0.5 + o.x * 0.13) % 1;
    c.fillStyle = `rgba(255,${150 + i * 40},60,${1 - t})`; c.fillRect(sx - 6 + Math.sin(t * 9 + i) * 8, top + 10 - t * 40, 2, 2);
  }
}
let HOARD_IMG = null;   // the gold hoard, baked once: coins on the floor in iso space
function bakeHoard() {
  const s = 2, rx = HOARD.r * P, ry = rx / 2, c = document.createElement('canvas'); c.width = Math.ceil(rx * 2 * s + 20); c.height = Math.ceil(ry * 2 * s + 20);
  const g = c.getContext('2d'); g.setTransform(s, 0, 0, s, c.width / 2, c.height / 2);
  const glow = g.createRadialGradient(0, 0, 0, 0, 0, rx); glow.addColorStop(0, 'rgba(150,105,30,0.55)'); glow.addColorStop(0.7, 'rgba(110,75,20,0.3)'); glow.addColorStop(1, 'rgba(90,60,15,0)');
  g.save(); g.scale(1, 0.5); g.fillStyle = glow; g.beginPath(); g.arc(0, 0, rx, 0, 7); g.fill(); g.restore();
  for (let i = 0; i < 900; i++) {
    const a = rnd() * 7, r = Math.pow(rnd(), 0.75) * 0.97, x = Math.cos(a) * r * rx, y = Math.sin(a) * r * ry;
    const l = 40 + rnd() * 30 - r * 18;
    g.fillStyle = `hsl(${38 + rnd() * 10},${60 + rnd() * 25}%,${l}%)`; g.beginPath(); g.ellipse(x, y, 3.2, 1.7, rnd() * 0.6 - 0.3, 0, 7); g.fill();
    if (rnd() < 0.35) { g.fillStyle = 'rgba(255,240,190,0.7)'; g.fillRect(x - 1, y - 1, 1.4, 0.8); }
  }
  for (let i = 0; i < 7; i++) {   // a few goblets and a chest-lid glint
    const a = rnd() * 7, r = rnd() * 0.7, x = Math.cos(a) * r * rx, y = Math.sin(a) * r * ry;
    g.fillStyle = '#c99a3a'; g.fillRect(x - 2, y - 7, 4, 7); g.fillStyle = '#f0d27a'; g.fillRect(x - 3.5, y - 9, 7, 2.2);
  }
  HOARD_IMG = { c, s };

  for (const f of FX) if (f.type === 'dust') { const u = f.t / f.life, [x, y] = S3(f.x, f.y, f.z); c.fillStyle = `rgba(140,120,95,${0.35 * (1 - u)})`; c.beginPath(); c.arc(x, y, 6 + 18 * u, 0, 7); c.fill(); }
}
function drawDebug(c) {
  const n = DR.n;
  c.save(); c.lineWidth = 1.5;
  c.strokeStyle = 'rgba(90,220,255,0.8)'; c.beginPath(); n.forEach((q, i) => { const [x, y] = iso(q.x, q.y); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke();
  for (const q of n) { const [x, y] = iso(q.x, q.y); c.beginPath(); c.ellipse(x, y, q.r * P, q.r * P / 2, 0, 0, 7); c.stroke(); }
  c.font = '11px sans-serif'; c.fillStyle = '#9fe8ff'; c.textAlign = 'center';
  for (const q of n) { const [x, y] = S3(q.x, q.y, q.z + q.R + 4); c.fillText((q.x + q.y).toFixed(1), x, y); }
  if (O.legs) for (const L of DR.legs) { const fr = legFrame(L), [x, y] = iso(fr.home[0], fr.home[1]); c.strokeStyle = 'rgba(255,220,90,0.8)'; c.beginPath(); c.arc(x, y, 3, 0, 7); c.stroke(); }
  if (O.spine === 'snake') { c.strokeStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); DR.trail.forEach((p, i) => { const [x, y] = iso(p[0], p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); }
  c.restore();
}

// ---------- the frame ----------
function resize() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  for (const c of [cv, lc, sc]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  PATS.clear();
}
function fighting() { return !DR.dead && DR.state !== 'sleep' && O.mode !== 'still' && Math.hypot(hero.x - DR.cx, hero.y - DR.cy) < 18; }
function render() {
  const cw = cv.width, ch = cv.height;
  const zt = ZB * (fighting() ? O.fz : 1); Z += (zt - Z) * 0.04;
  const [hx, hy] = iso(hero.x, hero.y); camX += (hx - camX) * 0.15; camY += (hy - 46 - camY) * 0.15;
  const sh = shake > 0 ? shake * 6 : 0, sx = (rnd() - 0.5) * sh, sy = (rnd() - 0.5) * sh;
  TF = [DPR * Z, 0, 0, DPR * Z, DPR * (W / 2 - camX * Z + sx), DPR * (H / 2 - camY * Z + sy)];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#040205'; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(...TF);
  // floor
  ctx.save(); ctx.transform(HW, HH, -HW, HH, 0, 0); ctx.beginPath();
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) ctx.rect(x, y, 1.02, 1.02);
  ctx.fillStyle = pats(ctx).floor; ctx.fill(); ctx.lineWidth = 0.012; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke(); ctx.restore();
  // the hoard
  const [gx, gy] = iso(HOARD.x, HOARD.y), hs = HOARD_IMG.s; ctx.drawImage(HOARD_IMG.c, gx - HOARD_IMG.c.width / hs / 2, gy - HOARD_IMG.c.height / hs / 2, HOARD_IMG.c.width / hs, HOARD_IMG.c.height / hs);
  if (O.shadows) drawDragonShadows();
  if (O.debug) drawDebug(ctx);
  // the depth-sorted drawables: walls, props, the hero, every part of the dragon
  const dl = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (isWall(x, y)) dl.push({ k: x + y + 1, f: c => drawWall(c, x, y) });
  for (const o of objects) dl.push({ k: o.x + o.y + 1, f: c => drawProp(c, o) });
  dl.push({ k: hero.x + hero.y, f: drawHero });
  dragonDrawables(dl);
  dl.sort((a, b) => a.k - b.k);
  for (const d of dl) d.f(ctx);
  drawFx(ctx);
  // lighting
  if (O.light !== 'off') {
    lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, cw, ch);
    lctx.fillStyle = `rgba(3,1,5,${O.light === 'game' ? 0.93 : 0.72})`; lctx.fillRect(0, 0, cw, ch); lctx.globalCompositeOperation = 'destination-out';
    const hole = (wx, wy, rad, str, lift) => {
      const [X, Y] = toDev(wx, wy, lift), r = rad * HW * 1.42 * Z * DPR;
      lctx.save(); lctx.translate(X, Y); lctx.scale(1, 0.62);
      const gr = lctx.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, `rgba(0,0,0,${str})`); gr.addColorStop(0.5, `rgba(0,0,0,${str * 0.8})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = gr; lctx.beginPath(); lctx.arc(0, 0, r, 0, 7); lctx.fill(); lctx.restore();
    };
    hole(hero.x, hero.y, 7.2, 1, 30);
    for (const o of objects) if (o.light) hole(o.x + 0.5, o.y + 0.5, o.light + Math.sin(time * 9 + o.x) * 0.15 + Math.sin(time * 13.7 + o.y) * 0.1, 0.95, 40);
    hole(HOARD.x, HOARD.y, 3.4, 0.35, 0);
    let fi = 0; for (const f of FX) if (f.type === 'fire' && (fi++ % 6 === 0)) hole(f.x, f.y, 2.2, 0.5 * (1 - f.t / f.life), f.z);
    if (!DR.dead && DR.eyes > 0.5) hole(DR.n[0].x, DR.n[0].y, 1.3, 0.3, DR.n[0].z);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(lc, 0, 0);
  }
  // additive light: braziers, the eyes, the hoard's glints
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter';
  for (const o of objects) if (o.k === 'brazier') {
    const [X, Y] = toDev(o.x + 0.5, o.y + 0.5, 50), r = 170 * Z * DPR;
    const gr = ctx.createRadialGradient(X, Y, 0, X, Y, r); gr.addColorStop(0, 'rgba(255,120,40,0.16)'); gr.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = gr; ctx.fillRect(X - r, Y - r, 2 * r, 2 * r);
  }
  for (let i = 0; i < 5; i++) {
    const s = Math.sin(time * 1.7 + i * 2.1); if (s < 0.85) continue;
    const a = i * 1.9, rr = (i % 3) / 3 * HOARD.r, [X, Y] = toDev(HOARD.x + Math.cos(a) * rr, HOARD.y + Math.sin(a) * rr * 0.9, 2), r = 7 * Z * DPR * (s - 0.85) / 0.15;
    ctx.fillStyle = 'rgba(255,240,190,0.8)'; ctx.fillRect(X - r, Y - 0.6 * DPR, 2 * r, 1.2 * DPR); ctx.fillRect(X - 0.6 * DPR, Y - r, 1.2 * DPR, 2 * r);
  }
  if (!DR.dead && DR.eyes > 0.5 && O.light !== 'off') {
    const q = DR.n[0], [X, Y] = toDev(q.x + Math.cos(DR.ha) * q.r * 0.5, q.y + Math.sin(DR.ha) * q.r * 0.5, q.z + q.R * 0.3), r = 16 * Z * DPR;
    const gr = ctx.createRadialGradient(X, Y, 0, X, Y, r); gr.addColorStop(0, 'rgba(255,190,60,0.45)'); gr.addColorStop(1, 'rgba(255,150,40,0)');
    ctx.fillStyle = gr; ctx.fillRect(X - r, Y - r, 2 * r, 2 * r);
  }
  ctx.globalCompositeOperation = 'source-over';
  // floating numbers
  ctx.setTransform(...TF); ctx.textAlign = 'center'; ctx.font = 'bold 17px Georgia, serif';
  for (const t of TEXTS) { const [x, y] = S3(t.x, t.y, t.z + t.t * 40); ctx.globalAlpha = 1 - Math.pow(t.t / 0.9, 3); ctx.fillStyle = '#000'; ctx.fillText(t.s, x + 1, y + 1); ctx.fillStyle = t.col; ctx.fillText(t.s, x, y); }
  ctx.globalAlpha = 1;
}
function statusText() {
  const st = DR.dead ? 'slain' : DR.state === 'sleep' ? 'asleep on its hoard' : DR.act ? { roar: 'roaring', bite: 'biting', breath: 'breathing fire', tail: 'sweeping its tail', buffet: 'beating its wings' }[DR.act.type] : O.mode === 'still' ? 'watching' : DR.v > 0.2 ? 'walking' : 'turning';
  return `The dragon is ${st} · hero ${Math.ceil(hero.hp)} / ${hero.max}` + (NOTE ? `<small>${NOTE.s}</small>` : `<small>zoom ${Z.toFixed(2)}</small>`);
}
let lastStatus = '';
function update(dt) {
  time += dt;
  updateDragon(dt); updateHero(dt); updateFx(dt);
}

// ---------- input and the panel ----------
function screenToWorld(px, py, lift = 0) {
  const X = (px - W / 2) / Z + camX, Y = (py - H / 2) / Z + camY + lift;
  return [(X / HW + Y / HH) / 2, (Y / HH - X / HW) / 2];
}
function pickDragon(px, py) {   // the front-most node whose circle (at its height) holds the point, within a margin
  const X = (px - W / 2) / Z + camX, Y = (py - H / 2) / Z + camY; let best = null, bk = -1e9;
  DR.n.forEach((q, i) => { const [x, y] = S3(q.x, q.y, q.z); if (Math.hypot(X - x, Y - y) < q.R * 1.05 + 8 && q.x + q.y > bk) { bk = q.x + q.y; best = i; } });
  return best;
}
function wakeAudio() { if (O.sound) { audio(); if (AC && AC.state === 'suspended') AC.resume(); } }
cv.addEventListener('pointerdown', ev => {
  wakeAudio(); if (hero.dead) return;
  const i = DR.dead && DR.dead.t > 3 ? null : pickDragon(ev.clientX, ev.clientY);
  if (i != null) { hero.target = i; hero.tx = null; return; }
  const [fx, fy] = screenToWorld(ev.clientX, ev.clientY);
  hero.target = null; hero.tx = clamp(fx, 1.2, MW - 1.2); hero.ty = clamp(fy, 1.2, MH - 1.2);
});
function syncUI() {
  for (const seg of document.querySelectorAll('.seg')) for (const b of seg.children) b.setAttribute('aria-pressed', String(O[seg.dataset.opt] === b.dataset.v));
  $('size').value = O.size; $('sizeV').textContent = '×' + O.size.toFixed(2) + ' (' + (7.8 * O.size).toFixed(1) + ' tiles long)';
  $('speed').value = O.speed; $('speedV').textContent = O.speed.toFixed(1) + ' tiles/s (the hero 4.2)';
  $('fz').value = O.fz; $('fzV').textContent = '×' + O.fz.toFixed(2);
  $('modeD').textContent = DESC[O.mode]; $('spineD').textContent = DESC[O.spine]; $('sortD').textContent = DESC[O.sort];
  for (const k of ['wings', 'legs', 'shadows', 'debug', 'sound']) $(k).checked = O[k];
}
for (const seg of document.querySelectorAll('.seg')) seg.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const k = seg.dataset.opt, was = O[k]; O[k] = b.dataset.v; syncUI();
  if (k === 'spine' && was !== O[k]) makeDragon();
  if (k === 'mode' && !DR.dead) { if (O.mode !== 'fight' && DR.state === 'sleep') { DR.state = 'awake'; DR.eyes = 1; } DR.act = null; }
});
for (const b of document.querySelectorAll('[data-act]')) b.onclick = () => { wakeAudio(); if (DR.dead) return; if (DR.state === 'sleep') DR.state = 'awake'; if (b.dataset.act === 'tail' && O.spine === 'snake') { note('The tail sweep needs the Body leads spine.'); return; } startAct(b.dataset.act); };
$('size').oninput = e => { O.size = +e.target.value; syncUI(); makeDragon(); };
$('speed').oninput = e => { O.speed = +e.target.value; syncUI(); };
$('fz').oninput = e => { O.fz = +e.target.value; syncUI(); };
for (const k of ['wings', 'legs', 'shadows', 'debug', 'sound']) $(k).onchange = e => { O[k] = e.target.checked; if (k === 'sound' && O[k]) wakeAudio(); };
$('reset').onclick = () => { makeDragon(); hero.x = START[0]; hero.y = START[1]; hero.hp = hero.max; hero.dead = 0; hero.tx = null; hero.target = null; FX.length = 0; };
$('kill').onclick = () => { wakeAudio(); if (DR.dead) { makeDragon(); return; } slay(); };
$('zin').onclick = () => { ZB = Math.min(2, ZB * 1.15); };
$('zout').onclick = () => { ZB = Math.max(0.3, ZB / 1.15); };
$('toggle').onclick = () => { const p = $('panel'), open = p.classList.toggle('closed') === false; $('toggle').setAttribute('aria-expanded', String(open)); $('toggle').textContent = open ? 'Close' : 'Options'; };
addEventListener('resize', resize);

// ---------- start ----------
function loadImg(src) { return new Promise((res, no) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => no(src); im.src = src; }); }
Promise.all(Object.entries(SRC).map(([k, s]) => loadImg(s).then(im => { IMG[k] = im; }))).then(() => {
  resize(); ZB = Z = W < 640 ? 0.62 : Math.min(1.2, Math.max(0.7, W / 1200));
  bakeHoard(); makeDragon(); syncUI();
  const [hx, hy] = iso(hero.x, hero.y); camX = hx; camY = hy - 46;
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    try { update(dt); render(); } catch (e) { if (!window.__err) { window.__err = e; console.error(e); } }
    $('kill').textContent = DR.dead ? 'Revive' : 'Slay it';
    const s = statusText(); if (s !== lastStatus) { $('status').innerHTML = s; lastStatus = s; }
    const bb = $('boss'); bb.style.display = DR.state === 'sleep' || (DR.dead && DR.dead.t > 3) ? 'none' : 'block'; $('bossFill').style.width = (100 * Math.max(0, DR.hp) / DR.max) + '%';
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}).catch(src => { $('status').textContent = 'Could not load ' + src; });
</script>
</body>
</html>
