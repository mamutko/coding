<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypt Ice Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Layout: the scene fills the screen; a floating options panel (a collapsible bottom sheet on phones). One dark look, like the game. */
  :root {
    --bg: #040205; --panel: rgba(14, 12, 12, 0.9); --line: #39302a; --fg: #e8dcc4; --muted: #a49378; --gold: #d8b45a;
    --on: #2a4858; --onfg: #dcf2fb; --frost: #bfe3f2;
    --display: Cinzel, Georgia, serif; --body: "IM Fell English", Georgia, serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: var(--body); font-size: 15px; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    width: 320px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(3px); }
  #panel header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-family: var(--display); font-size: 17px; letter-spacing: 0.06em; margin: 0; color: var(--frost); font-weight: 700; }
  .hint { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
  .desc { margin: 0; color: var(--fg); font-size: 13.5px; line-height: 1.35; font-style: italic; opacity: 0.85; }
  .row { display: flex; flex-direction: column; gap: 4px; }
  .lab { font-family: var(--display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .lab output { font-family: var(--body); letter-spacing: 0; text-transform: none; color: var(--fg); font-size: 13px; font-variant-numeric: tabular-nums; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; background: transparent; color: var(--fg); border: 0; border-left: 1px solid var(--line); padding: 6px 4px;
    font: 14px var(--body); cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--on); color: var(--onfg); }
  input[type=range] { width: 100%; accent-color: var(--frost); margin: 0; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--frost); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn { background: #1c1a19; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: 14px var(--body); cursor: pointer; }
  .btn:hover, .seg button:hover { filter: brightness(1.25); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--frost); outline-offset: 1px; }
  #toggle { display: none; }
  #status { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px));
    font: 15px var(--body); color: var(--frost); text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; max-width: calc(100% - 360px); }
  #status small { display: block; color: var(--muted); font-size: 13px; }
  @media (max-width: 640px) {
    #status { max-width: calc(100% - 24px); }
    #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 58%; border-radius: 12px 12px 0 0; border-bottom: 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    #panel.closed > :not(header) { display: none; }
    #toggle { display: inline-block; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="status">Loading…</div>
<div id="panel" class="closed">
  <header><h1>Crypt Ice</h1><button class="btn" id="toggle" aria-expanded="false">Options</button></header>
  <p class="hint">Tap open water to cast (or throw), tap the floor or the ice to walk. Cracks appear 5 s before the ice melts, starting under the hero if they stand on it.</p>
  <div class="row"><div class="lab">Tapping the water</div>
    <div class="seg" data-opt="tap"><button data-v="cast">Ice blast</button><button data-v="bomb">Fire bomb</button></div></div>
  <div class="row"><div class="lab">Freezing</div>
    <div class="seg" data-opt="freeze"><button data-v="front">Frost front</button><button data-v="shard">Shard burst</button><button data-v="flash">Flash</button></div>
    <p class="desc" id="freezeD"></p></div>
  <div class="row"><div class="lab">Melting</div>
    <div class="seg" data-opt="melt"><button data-v="break">Break up</button><button data-v="thaw">Thaw</button><button data-v="recede">Recede</button></div>
    <p class="desc" id="meltD"></p></div>
  <div class="row"><label class="lab" for="radius">Blast radius <output id="radiusV"></output></label><input type="range" id="radius" min="1.5" max="5" step="0.25"></div>
  <div class="row"><label class="lab" for="life">Ice lasts <output id="lifeV"></output></label><input type="range" id="life" min="8" max="40" step="1"></div>
  <div class="row"><div class="lab">Water</div>
    <div class="seg" data-opt="tint"><button data-v="ink">Ink</button><button data-v="teal">Teal</button><button data-v="moss">Moss</button></div></div>
  <div class="checks">
    <label><input type="checkbox" id="scar"> Blast scar</label>
    <label><input type="checkbox" id="mist"> Cold mist</label>
    <label><input type="checkbox" id="light"> Lighting</label>
    <label><input type="checkbox" id="sound"> Sound</label>
  </div>
  <div class="btns">
    <button class="btn" id="castMid">Cast at the lake</button>
    <button class="btn" id="onIce">Hero onto the ice</button>
    <button class="btn" id="crackNow">Start cracking now</button>
    <button class="btn" id="dripNow">Drip</button>
    <button class="btn" id="zout" aria-label="Zoom out">−</button>
    <button class="btn" id="zin" aria-label="Zoom in">+</button>
  </div>
</div>
<script>
'use strict';
// =====================================================================================
//  Ice prototype for the crypt's lakes (dungeon-crawler-01): an ice blast freezes the still water in a radius
//  around where it lands; the ice lasts a while, cracks for its last 5 s and melts. Built on lake-prototype.html
//  (the same projection, walls, props, characters, reflection and ripples).
//  How the ice is drawn:
//   - A patch of ice is a noisy disc (world coordinates) clipped to the lake, at the water's level. Its look is
//     pre-drawn once into a texture (in the ground plane, so it is foreshortened like the floor): a pale tint
//     over the reflection, cloudy rime, frost ferns, trapped bubbles and the blast scar at the centre (a white
//     crater, a starburst of streaks, broken pressure rings and radial fractures).
//   - The patch is drawn on its own layer over the water each frame: the deep colour, a dim reflection (smooth
//     ice still mirrors a little), the texture, the freezing whiteness, the cracks, and the rim.
//   - Cracks: 5 s before the melt a crack network is made from a Voronoi diagram of seeds set in rings around
//     the crack's start (under the hero if they are on the ice, else the blast scar): spokes from the start, then
//     the cells' edges, revealed outward from the start by their distance along the network (Dijkstra). If the
//     hero walks onto the ice while it cracks, new cracks start under their feet too. The melt uses the same
//     cells: floes for Break up, channels for Thaw.
//   - On the ice nothing ripples: drops tick and bounce, fire bombs shatter and burn. Open water as before.
// =====================================================================================
const TW = 96, TH = 48, HW = TW / 2, HH = TH / 2, WALLH = 72, SHADE_Y = 0.42, SHADE_X = 0.18;
const P = HW * Math.SQRT2;       // px per tile in the ground plane (a world circle is an ellipse P by P/2 on screen)
const iso = (x, y) => [(x - y) * HW, (x + y) * HH];
const MAP = [
  '#################',
  '#....~~~~~......#',
  '#...~~~~~~~~~~..#',
  '#..~~~~~~~~~~~..#',
  '#..~~~~~~~~~~~~.#',
  '#...~~~~~~~~~~~.#',
  '#....~~~~~~~~...#',
  '#......~~~~.....#',
  '#...............#',
  '#...........~~..#',
  '#...........~~..#',
  '#...............#',
  '#################'];
const MW = MAP[0].length, MH = MAP.length;
const T = (x, y) => x < 0 || y < 0 || x >= MW || y >= MH ? '#' : MAP[y][x];
const isWall = (x, y) => T(x, y) === '#', isWater = (x, y) => T(x, y) === '~', isFloor = (x, y) => T(x, y) === '.';

const SRC = { floor: 'assets/floor.jpg', wall: 'assets/wall.jpg', dirt: 'assets/dirt.jpg', props: 'assets/props.webp',
  hero: 'assets/hero.webp', skeleton: 'assets/skeleton.webp', wraith: 'assets/wraith.webp' };
const CHARS = { hero: { fw: 144, fh: 152, frames: 8, idle: 3, footY: 128, fpt: 5 }, skeleton: { fw: 176, fh: 152, frames: 8, idle: 3, footY: 128, fpt: 5 },
  wraith: { fw: 102, fh: 152, frames: 4, idle: 0, footY: 128, fpt: 2 } };
const PROPS = { brazier: [571, 0, 104, 167], banner: [1593, 0, 84, 206], pillar: [1679, 0, 98, 191], candelabrum: [1339, 0, 84, 196],
  sarcophagus: [1779, 0, 154, 144], skullpile: [1425, 0, 166, 136], urn: [827, 0, 95, 151] };
const PROP_STYLE = { brazier: [0.62, 10], banner: [0.66, 6], pillar: [0.72, 8], candelabrum: [0.62, 6], sarcophagus: [0.64, 10], skullpile: [0.42, 8], urn: [0.52, 8] };
const POST = [0.08, 0.46, 0.21, 0.5, 0.55];
const PROP_SHADOW = { brazier: [0.2, 0.44, 0.2, 0.75, 0.7], banner: POST, pillar: POST, candelabrum: POST, urn: POST,
  sarcophagus: [0.25, 0.62, 0.32, 0.5, 0.55], skullpile: [0.2, 0.58, 0.28, 0.5, 0.55] };
const objects = [
  { k: 'brazier', x: 2, y: 2, light: [4.2, 40, 0.95], flame: 52 }, { k: 'banner', x: 4, y: 1 }, { k: 'pillar', x: 10, y: 1 },
  { k: 'candelabrum', x: 14, y: 1, light: [2.6, 60, 0.8], flame: 108 }, { k: 'sarcophagus', x: 6, y: 9 }, { k: 'skullpile', x: 14, y: 7 },
  { k: 'urn', x: 1, y: 8 }, { k: 'brazier', x: 15, y: 10, light: [4.2, 40, 0.95], flame: 52 }];

// options (the panel); the water itself is the lake the game settled on (rounded shores, rings + refraction)
const O = { tap: 'cast', freeze: 'front', melt: 'break', radius: 3, life: 16, tint: 'ink', scar: true, mist: true, light: true, sound: true };
const D = 8, REFL = 0.7, FADE = 0.45, DRIPS = 10;
const TINTS = {
  teal: { deep: '#061419', deepRGB: '6,20,25', tint: 'rgba(12,52,62,0.36)', ring: '190,226,240' },
  ink:  { deep: '#030407', deepRGB: '3,4,7', tint: 'rgba(4,8,14,0.42)', ring: '205,212,228' },
  moss: { deep: '#0a1309', deepRGB: '10,19,9', tint: 'rgba(32,54,26,0.38)', ring: '205,230,190' } };
const FADEH = 120, RSPEED = 24, RLIFE = 3.8, LAMBDA = 7.5;
const WARN = 5;                                                       // s of cracking before the melt
const FREEZE_DUR = { front: 0.9, shard: 1.45, flash: 0.05 }, MELT_DUR = { break: 2.2, thaw: 2.4, recede: 2.6 };
const DESC = {
  front: 'A frost front races out from the blast and slows as it spreads, feathered at its edge. The fresh ice is white with rime, then clears to glassy ice.',
  shard: 'Needles of ice shoot out to the full radius first, then the sheet fills in between them.',
  flash: 'The whole radius turns white at once behind a shock ring that runs out across the open water, then clears.',
  break: 'The cracks open, the sheet breaks into floes along them, and the floes drift apart, darken and sink one by one.',
  thaw: 'The cracks widen into channels of open water and dark melt holes open and join until the lake is back.',
  recede: 'The ice melts back from its rim toward the blast scar, which goes last, with a wet dark edge.' };

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const wc = document.createElement('canvas'), wctx = wc.getContext('2d', { willReadFrequently: true });   // the water layer
const ic = document.createElement('canvas'), ictx = ic.getContext('2d');   // the ice layer
const rc = document.createElement('canvas'), rctx = rc.getContext('2d');   // the mirrored scene
const lc = document.createElement('canvas'), lctx = lc.getContext('2d');   // lighting
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
let W = 0, H = 0, DPR = 1, Z = 1, camX = 0, camY = 0, time = 0, TF = [1, 0, 0, 1, 0, 0];
const IMG = {};
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const easeOut = u => 1 - (1 - u) ** 3, easeInOut = u => u < 0.5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- the lake outline (as in lake-prototype.html) ----------
function traceLoops() {
  const edges = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (!isWater(x, y)) continue;
    if (!isWater(x, y - 1)) edges.push({ a: [x, y], b: [x + 1, y], w: isWall(x, y - 1) });
    if (!isWater(x + 1, y)) edges.push({ a: [x + 1, y], b: [x + 1, y + 1], w: isWall(x + 1, y) });
    if (!isWater(x, y + 1)) edges.push({ a: [x + 1, y + 1], b: [x, y + 1], w: isWall(x, y + 1) });
    if (!isWater(x - 1, y)) edges.push({ a: [x, y + 1], b: [x, y], w: isWall(x - 1, y) });
  }
  const from = new Map(), key = p => p[0] + ',' + p[1];
  for (const e of edges) { const k = key(e.a); if (!from.has(k)) from.set(k, []); from.get(k).push(e); }
  const used = new Set(), loops = [];
  for (const e0 of edges) {
    if (used.has(e0)) continue;
    const pts = [], w = []; let e = e0;
    while (e && !used.has(e)) { used.add(e); pts.push(e.a); w.push(e.w); e = (from.get(key(e.b)) || []).find(f => !used.has(f)); }
    loops.push({ pts, w });
  }
  return loops;
}
function chaikin(L, n) {
  let { pts, w } = L;
  for (let it = 0; it < n; it++) {
    const Pp = [], F = [], m = pts.length;
    for (let i = 0; i < m; i++) {
      const a = pts[i], b = pts[(i + 1) % m], wi = w[i], wn = w[(i + 1) % m];
      const s = wi ? a : [a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], e = wi ? b : [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75];
      Pp.push(s); F.push(wi); Pp.push(e); F.push(wi && wn);
    }
    pts = []; w = [];
    for (let i = 0; i < Pp.length; i++) { const q = Pp[(i + 1) % Pp.length]; if (Math.abs(Pp[i][0] - q[0]) + Math.abs(Pp[i][1] - q[1]) < 1e-9) continue; pts.push(Pp[i]); w.push(F[i]); }
  }
  return { pts, w };
}
let LOOPS = [], SEGS = [], WATER2D = null;
function buildLake() {
  LOOPS = traceLoops().map(L => chaikin(L, 3));
  SEGS = []; WATER2D = new Path2D();
  for (const L of LOOPS) {
    const m = L.pts.length;
    L.pts.forEach((p, i) => i ? WATER2D.lineTo(p[0], p[1]) : WATER2D.moveTo(p[0], p[1])); WATER2D.closePath();
    for (let i = 0; i < m; i++) {
      const a = L.pts[i], b = L.pts[(i + 1) % m], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
      const n = [dy / l, -dx / l];
      SEGS.push({ a, b, wall: L.w[i], n, far: n[0] + n[1] < -0.02, near: n[0] + n[1] > 0.02 });
    }
  }
}
const hit = document.createElement('canvas').getContext('2d');
const inWater = (x, y) => hit.isPointInPath(WATER2D, x, y);
function waterPath(c, dy) {
  c.beginPath();
  for (const L of LOOPS) { L.pts.forEach((p, i) => { const [X, Y] = iso(p[0], p[1]); i ? c.lineTo(X, Y + dy) : c.moveTo(X, Y + dy); }); c.closePath(); }
}
const PATS = new Map();
function pats(c) {
  if (PATS.has(c)) return PATS.get(c);
  const floor = c.createPattern(IMG.floor, 'repeat'); floor.setTransform(new DOMMatrix([HW, HH, -HW, HH, 0, 0]).scale(3 / 512));
  const dirt = c.createPattern(IMG.dirt, 'repeat'); dirt.setTransform(new DOMMatrix().scale(1.5 / 512));
  const rock = c.createPattern(IMG.wall, 'repeat'); rock.setTransform(new DOMMatrix().scale(0.75));
  const p = { floor, dirt, rock }; PATS.set(c, p); return p;
}

// ---------- drawing the scene (as in lake-prototype.html; mir = the mirror image about the water plane) ----------
function face(c, img, sx, sy, sw, sh, A, B, h0, h1, shade, mir) {
  const ux = B[0] - A[0], uy = B[1] - A[1], hh = h1 - h0;
  c.save();
  if (mir) c.transform(ux / sw, uy / sw, 0, -hh / sh, A[0], A[1] + 2 * D + h1);
  else c.transform(ux / sw, uy / sw, 0, hh / sh, A[0], A[1] - h1);
  c.drawImage(img, sx, sy, sw, sh, 0, 0, sw * 1.02, sh * 1.01);
  if (shade) { c.fillStyle = `rgba(0,0,0,${shade})`; c.fillRect(0, 0, sw * 1.02, sh * 1.01); }
  if (!mir && h0 < 0) { const yb = sh * h1 / hh; c.fillStyle = 'rgba(0,8,12,0.5)'; c.fillRect(0, yb, sw * 1.02, sh * 1.01 - yb); }
  if (mir) {
    const g = c.createLinearGradient(0, sh, 0, sh - FADEH / hh * sh), d = TINTS[O.tint].deepRGB;
    g.addColorStop(0, `rgba(${d},0)`); g.addColorStop(1, `rgba(${d},${FADE})`); c.fillStyle = g; c.fillRect(0, 0, sw * 1.02, sh * 1.01);
  }
  c.restore();
}
function wallTop(c, x, y) {
  c.save(); c.translate(0, -WALLH); c.transform(HW, HH, -HW, HH, 0, 0);
  c.beginPath(); c.rect(x, y, 1, 1); c.fillStyle = pats(c).dirt; c.fill(); c.fillStyle = 'rgba(0,0,0,0.25)'; c.fill();
  c.lineWidth = 0.012; c.strokeStyle = 'rgba(255,240,220,0.05)'; c.stroke(); c.restore();
}
function drawWall(c, x, y, mir) {
  const L = iso(x, y + 1), B = iso(x + 1, y + 1), R = iso(x + 1, y);
  const tsx = ((x * 131 + y * 71) % 4) * 128, tsy = ((x * 37 + y * 113) % 4) * 100;
  if (!isWall(x, y + 1)) face(c, IMG.wall, tsx, tsy, 128, 75, L, B, isWater(x, y + 1) ? -D : 0, WALLH, SHADE_Y, mir);
  if (!isWall(x + 1, y)) face(c, IMG.wall, (tsx + 256) % 512, tsy, 128, 75, B, R, isWater(x + 1, y) ? -D : 0, WALLH, SHADE_X, mir);
  if (!mir) wallTop(c, x, y);
}
function softShadow(c, x, y, rx, ry, a, mid) {
  c.save(); c.translate(x, y); c.scale(1, ry / rx);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(mid, `rgba(0,0,0,${a * 0.7})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, 7); c.fill(); c.restore();
}
function mirSprite(c, img, sx, sy, sw, sh, dx, dy, dw, dh, gy) {
  tmp.width = sw; tmp.height = sh; tctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const s = dh / sh, y0 = (gy - dy) / s, y1 = y0 - FADEH / s;
  const g = tctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${FADE})`);
  tctx.globalCompositeOperation = 'destination-out'; tctx.fillStyle = g; tctx.fillRect(0, 0, sw, sh); tctx.globalCompositeOperation = 'source-over';
  c.save(); c.translate(0, 2 * (gy + D)); c.scale(1, -1); c.drawImage(tmp, dx, dy, dw, dh); c.restore();
}
function drawProp(c, o, mir) {
  const [px, py, pw, ph] = PROPS[o.k], [s, off] = PROP_STYLE[o.k], [sx, sy] = iso(o.x + 0.5, o.y + 0.5);
  const w = pw * s, hh = ph * s, top = sy - hh + off;
  if (mir) return mirSprite(c, IMG.props, px, py, pw, ph, sx - w / 2, top, w, hh, sy);
  const sh = PROP_SHADOW[o.k];
  if (sh) softShadow(c, sx, top + hh - w * sh[0], w * sh[1], w * sh[2], sh[3], sh[4]);
  c.drawImage(IMG.props, px, py, pw, ph, sx - w / 2, top, w, hh);
  if (o.k === 'brazier') for (let i = 0; i < 2; i++) {
    const t = (time * 0.9 + i * 0.5 + o.x * 0.13) % 1;
    c.fillStyle = `rgba(255,${150 + i * 40},60,${1 - t})`; c.fillRect(sx - 6 + Math.sin(t * 9 + i) * 8, top + 10 - t * 40, 2, 2);
  }
}

    const k = m.t / m.dur, [X, Y] = toDev(m.x, m.y, m.z - D), s = m.s * (1 + k) * Z * DPR, a = 0.07 * Math.sin(Math.PI * k);
    const gr = ctx.createRadialGradient(X, Y, 0, X, Y, s); gr.addColorStop(0, `rgba(200,228,245,${a})`); gr.addColorStop(1, 'rgba(200,228,245,0)');
    ctx.fillStyle = gr; ctx.fillRect(X - s, Y - s, 2 * s, 2 * s);
  }
  for (const d of drops) {
    const k = d.t / d.tf, h = 320 * (1 - k * k), [X, Y] = toDev(d.x, d.y, h - D), len = (4 + 10 * k) * Z * DPR;
    ctx.strokeStyle = `rgba(200,228,255,${0.35 + 0.5 * k})`; ctx.lineWidth = 1.4 * Z * DPR; ctx.beginPath(); ctx.moveTo(X, Y - len); ctx.lineTo(X, Y); ctx.stroke();
  }
  for (const s of splashes) {
    const [X, Y] = toDev(s.x, s.y, Math.max(0, s.z) - D), r = (s.small ? 0.8 : 1.1) * Z * DPR;
    ctx.fillStyle = s.col ? `rgba(${s.col},0.9)` : 'rgba(200,228,255,0.7)'; ctx.fillRect(X - r, Y - r, 2 * r, 2 * r);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function refract(cw, ch) {
  const sc = DPR * Z, lam = LAMBDA * sc;
  for (const r of ripples) {
    const amp = rippleAmp(r) * 2.4 * sc; if (amp < 0.05) continue;
    const [X, Y] = toDev(r.x, r.y, -D), R = rRad(r) * sc, ext = R + lam * 2.6;
    const x0 = Math.max(0, Math.floor(X - ext)), x1 = Math.min(cw, Math.ceil(X + ext)), y0 = Math.max(0, Math.floor(Y - ext / 2)), y1 = Math.min(ch, Math.ceil(Y + ext / 2));
    const bw = x1 - x0, bh = y1 - y0; if (bw < 2 || bh < 2) continue;
    let img; try { img = wctx.getImageData(x0, y0, bw, bh); } catch (e) { return; }
    const src = img.data, out = new Uint8ClampedArray(src), k2 = 2 * Math.PI / lam, wid = lam * 1.15;
    for (let py = 0; py < bh; py++) {
      const ey = (y0 + py - Y) * 2;
      for (let px = 0; px < bw; px++) {
        const ex = x0 + px - X, rr = Math.hypot(ex, ey), d = rr - R;
        if (rr < 0.5 || d > lam * 2.6 || d < -lam * 2.6) continue;
        const env = Math.exp(-(d / wid) * (d / wid)), ph = d * k2, disp = amp * Math.sin(ph) * env;
        const ux = ex / rr, uy = ey / rr;
        let sx = Math.round(px - ux * disp), sy = Math.round(py - uy * disp * 0.5);
        sx = sx < 0 ? 0 : sx >= bw ? bw - 1 : sx; sy = sy < 0 ? 0 : sy >= bh ? bh - 1 : sy;
        const si = (sy * bw + sx) * 4, o = (py * bw + px) * 4;
        if (src[o + 3] === 0 || src[si + 3] === 0) continue;
        const lit = Math.cos(ph) * env * (-uy) * Math.min(1, amp / sc) * 46;
        out[o] = src[si] + lit; out[o + 1] = src[si + 1] + lit * 1.08; out[o + 2] = src[si + 2] + lit * 1.15; out[o + 3] = src[si + 3];
      }
    }
    img.data.set(out); wctx.putImageData(img, x0, y0);
  }
}

// ---------- status ----------
function statusText() {
  const p = patches[patches.length - 1];
  let s = '';
  if (p) {
    const left = Math.max(0, p.life - p.t);
    s = p.phase === 'freeze' ? 'Freezing…' : p.phase === 'solid' ? `The ice holds · melts in ${left.toFixed(1)} s` :
      p.phase === 'warn' ? `Cracking · melts in ${left.toFixed(1)} s` : 'Melting';
  } else s = 'Open water';
  return s + (note ? `<small>${note.text}</small>` : iceAt(hero.x, hero.y) ? '<small>The hero is standing on the ice.</small>' : '');
}
let lastStatus = '';

// ---------- input and the panel ----------
function screenToWorld(px, py, lift = 0) {
  const X = (px - W / 2) / Z + camX, Y = (py - H / 2) / Z + camY - lift;
  return [(X / HW + Y / HH) / 2, (Y / HH - X / HW) / 2];
}
function wake() { if (O.sound) { audio(); if (AC && AC.state === 'suspended') AC.resume(); } }
cv.addEventListener('pointerdown', ev => {
  wake();
  const [wx, wy] = screenToWorld(ev.clientX, ev.clientY, D);
  if (inWater(wx, wy)) {
    if (O.tap === 'bomb') { throwBomb(wx, wy); return; }
    if (iceAt(wx, wy)) { hero.tx = wx; hero.ty = wy; return; }
    cast(wx, wy); return;
  }
  const [fx, fy] = screenToWorld(ev.clientX, ev.clientY);
  if (isFloor(Math.floor(fx), Math.floor(fy))) {
    if (O.tap === 'bomb' && Math.hypot(fx - hero.x, fy - hero.y) > 1.2) { throwBomb(fx, fy); return; }
    hero.tx = fx; hero.ty = fy;
  }
});
function syncUI() {
  for (const seg of document.querySelectorAll('.seg')) for (const b of seg.children) b.setAttribute('aria-pressed', String(O[seg.dataset.opt] === b.dataset.v));
  $('radius').value = O.radius; $('radiusV').textContent = O.radius + ' tiles';
  $('life').value = O.life; $('lifeV').textContent = O.life + ' s (the last 5 cracking)';
  $('freezeD').textContent = DESC[O.freeze]; $('meltD').textContent = DESC[O.melt];
  for (const k of ['scar', 'mist', 'light', 'sound']) $(k).checked = O[k];
}
for (const seg of document.querySelectorAll('.seg')) seg.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  O[seg.dataset.opt] = b.dataset.v; syncUI();
  if (seg.dataset.opt === 'melt') for (const p of patches) if (p.phase !== 'melt') { p.meltStyle = O.melt; p.md = MELT_DUR[O.melt]; }
  if (seg.dataset.opt === 'freeze') { wake(); recast(); }
});
$('radius').oninput = e => { O.radius = +e.target.value; syncUI(); };
$('life').oninput = e => { O.life = +e.target.value; syncUI(); };
for (const k of ['scar', 'mist', 'light', 'sound']) $(k).onchange = e => { O[k] = e.target.checked; if (k === 'sound' && O[k]) wake(); if (k === 'scar') recast(); };
function recast() {   // cast again where the newest ice is (or at the lake), to compare looks
  const p = patches[patches.length - 1], x = p ? p.ox : 8.3, y = p ? p.oy : 4.2;
  patches.length = 0; cast(x, y);
}
$('castMid').onclick = () => { wake(); cast(8.3 + (Math.random() - 0.5) * 2, 4.2 + (Math.random() - 0.5) * 1.2); };
$('onIce').onclick = () => {
  const p = [...patches].reverse().find(solid); if (!p) { note = { text: 'There is no ice yet: tap the water to cast.', t: 2.5 }; return; }
  for (let i = 0; i < 40; i++) { const a = Math.random() * 7, r = (0.4 + Math.random() * 0.5) * p.R, x = p.ox + Math.cos(a) * r, y = p.oy + Math.sin(a) * r; if (iceAt(x, y)) { hero.x = x; hero.y = y; hero.tx = null; return; } }
};
$('crackNow').onclick = () => { wake(); const p = [...patches].reverse().find(q => q.phase === 'solid' || q.phase === 'freeze'); if (p) p.life = Math.max(p.fd, p.t) + WARN; };
$('dripNow').onclick = () => {   // a drip onto the ice if there is some, to hear and see that it does not splash
  const p = [...patches].reverse().find(solid);
  if (p) { const a = Math.random() * 7, r = Math.random() * p.R * 0.8, x = p.ox + Math.cos(a) * r, y = p.oy + Math.sin(a) * r; if (iceAt(x, y)) { drip(x, y); return; } }
  drip(...randomWaterPoint());
};
$('zin').onclick = () => { Z = Math.min(2.4, Z * 1.2); };
$('zout').onclick = () => { Z = Math.max(0.35, Z / 1.2); };
$('toggle').onclick = () => { const p = $('panel'), open = p.classList.toggle('closed') === false; $('toggle').setAttribute('aria-expanded', String(open)); $('toggle').textContent = open ? 'Close' : 'Options'; };
addEventListener('resize', resize);

// ---------- start ----------
function loadImg(src) { return new Promise((res, no) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => no(src); im.src = src; }); }
Promise.all(Object.entries(SRC).map(([k, s]) => loadImg(s).then(im => { IMG[k] = im; }))).then(() => {
  resize(); Z = W < 640 ? 0.62 : Math.min(1.2, Math.max(0.7, W / 1200));
  buildLake(); syncUI();
  const [hx, hy] = iso(hero.x, hero.y), [lx, ly] = iso(8.5, 4.5); camX = (hx + lx) / 2; camY = (hy + ly) / 2 + 10;
  cast(8.3, 4.2); patches[0].t = 2.5;   // open on ice that has already set
  let last = performance.now();
  const loop = now => {
    update(Math.min(0.05, (now - last) / 1000)); last = now; render();
    const s = statusText(); if (s !== lastStatus) { $('status').innerHTML = s; lastStatus = s; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}).catch(src => { $('status').textContent = 'Could not load ' + src; });
</script>
</body>
