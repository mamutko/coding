<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 48px;
            text-align: center;
            display: none;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="gameOver">
        Game Over!
        <br>
        <button id="restartBtn">Restart Game</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverDiv = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');

        const BOARD_WIDTH = 80;
        const BOARD_HEIGHT = 40;
        const CELL_SIZE = 10;
        const MOVE_SPEED = 250; // milliseconds per move (4 cells/sec = 250ms per cell)

        let worm = [];
        let direction = { x: 0, y: 0 };
        let food = [];
        let poison = [];
        let gameRunning = false;
        let gameInterval;

        function initGame() {
            // Initialize worm in center
            const centerX = Math.floor(BOARD_WIDTH / 2);
            const centerY = Math.floor(BOARD_HEIGHT / 2);
            worm = [
                { x: centerX, y: centerY },
                { x: centerX - 1, y: centerY },
                { x: centerX - 2, y: centerY }
            ];

            direction = { x: 0, y: 0 };

            // Initialize food and poison
            food = [];
            poison = [];
            for (let i = 0; i < 32; i++) {
                let pos;
                do {
                    pos = {
                        x: Math.floor(Math.random() * BOARD_WIDTH),
                        y: Math.floor(Math.random() * BOARD_HEIGHT)
                    };
                } while (worm.some(segment => segment.x === pos.x && segment.y === pos.y));

                if (i < 2) {
                    food.push(pos);
                } else {
                    poison.push(pos);
                }
            }

            gameRunning = false;
            gameOverDiv.style.display = 'none';
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw worm
            ctx.fillStyle = '#0f0';
            worm.forEach(segment => {
                ctx.fillRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });

            // Draw food
            ctx.fillStyle = '#ff0';
            food.forEach(f => {
                ctx.fillRect(f.x * CELL_SIZE, f.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });

            // Draw poison
            ctx.fillStyle = '#f00';
            poison.forEach(p => {
                ctx.fillRect(p.x * CELL_SIZE, p.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });
        }

        function moveWorm() {
            if (!gameRunning) return;

            const head = { x: worm[0].x + direction.x, y: worm[0].y + direction.y };

            // Check boundaries
            if (head.x < 0 || head.x >= BOARD_WIDTH || head.y < 0 || head.y >= BOARD_HEIGHT) {
                gameOver();
                return;
            }

            // Check self collision
            if (worm.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // Check poison
            if (poison.some(p => p.x === head.x && p.y === head.y)) {
                gameOver();
                return;
            }

            // Check food
            const foodIndex = food.findIndex(f => f.x === head.x && f.y === head.y);
            if (foodIndex !== -1) {
                // Eat food, grow
                food.splice(foodIndex, 1);
                // Add new food
                let newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * BOARD_WIDTH),
                        y: Math.floor(Math.random() * BOARD_HEIGHT)
                    };
                } while (worm.some(segment => segment.x === newFood.x && segment.y === newFood.y) ||
                         poison.some(p => p.x === newFood.x && p.y === newFood.y) ||
                         food.some(f => f.x === newFood.x && f.y === newFood.y));
                food.push(newFood);
            } else {
                // Remove tail
                worm.pop();
            }

            // Add new head
            worm.unshift(head);

            draw();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            gameOverDiv.style.display = 'block';
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) {
                if (['w', 'a', 's', 'd'].includes(e.key.toLowerCase())) {
                    gameRunning = true;
                    gameInterval = setInterval(moveWorm, MOVE_SPEED);
                }
            }

            switch (e.key.toLowerCase()) {
                case 'w':
                    if (direction.y === 0) direction = { x: 0, y: -1 };
                    break;
                case 's':
                    if (direction.y === 0) direction = { x: 0, y: 1 };
                    break;
                case 'a':
                    if (direction.x === 0) direction = { x: -1, y: 0 };
                    break;
                case 'd':
                    if (direction.x === 0) direction = { x: 1, y: 0 };
                    break;
            }
        });

        restartBtn.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
